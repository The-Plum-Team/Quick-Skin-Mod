name: Run packaged Minecraft E2E
description: Install the locked runtime, verify an immutable bundle, run scenarios, and upload evidence.

inputs:
  bundle-name:
    description: Exact Actions artifact containing the staged release bundle
    required: true
  row-json:
    description: One authoritative runtime matrix row as JSON
    required: true
  source-sha:
    description: Exact checked-out commit bound to the immutable release bundle
    required: true
  scenarios:
    description: Comma-separated contract scenario ids
    required: true
  selection-base:
    description: Exact complete healthy baseline commit admitted by protected feature policy
    required: false
    default: ""
  selection-policy:
    description: Exact protected policy commit for the authenticated feature selection
    required: false
    default: ""
  selection-sha256:
    description: SHA-256 of the protected Git selection admission; empty runs complete scenarios
    required: false
    default: ""
  release-target:
    description: Exact Minecraft target for a separately staged release; empty consumes the complete build bundle
    required: false
    default: ""
  evidence-name:
    description: Unique Actions artifact name for this runtime lane
    required: true
  compatibility-mod:
    description: Optional lock-selected compatibility mod id
    required: false
    default: ""
  cpm-model-path:
    description: Optional authenticated external CPM fixture path for the CPM compatibility lane
    required: false
    default: ""
  evidence-retention-days:
    description: Bounded retention needed by downstream authenticated consumers
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Install all required JDKs
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: |
          17
          21
          25

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install locked packaged-runtime launcher
      shell: bash
      run: >-
        python -m pip install --only-binary=:all:
        --require-hashes
        --requirement e2e/requirements.txt

    - name: Install software-rendering runtime
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          xvfb \
          xauth \
          mesa-utils \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libasound2t64 \
          libopenal1 \
          libx11-6 \
          libxcursor1 \
          libxext6 \
          libxi6 \
          libxinerama1 \
          libxrandr2 \
          libxrender1 \
          libxtst6 \
          libxxf86vm1

    - name: Download immutable runtime input bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle-name }}
        path: build/release

    - name: Reverify staged bytes, matrix, and source commit
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source-sha }}
        RELEASE_TARGET: ${{ inputs.release-target }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
        target_arguments=()
        if [[ -n "$RELEASE_TARGET" ]]; then
          target_arguments=(--target "$RELEASE_TARGET")
        fi
        GITHUB_SHA="$EXPECTED_SOURCE_SHA" \
          python scripts/release/verify_release.py ${target_arguments[@]+"${target_arguments[@]}"} --verify-staged

    - name: Download protected feature selection from this execution
      if: inputs.selection-sha256 != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: e2e-feature-selection
        path: ${{ runner.temp }}/feature-selection

    - name: Derive the installed-server store identity
      id: server-store
      shell: bash
      env:
        E2E_ROW_JSON: ${{ inputs.row-json }}
        QUICKSKIN_E2E_SERVER_STORE: ${{ runner.temp }}/quick-skin-server-store
      run: |
        set -euo pipefail
        python3 e2e/runtime_store_cache.py \
          --matrix release/release-matrix.json \
          --row-json "$E2E_ROW_JSON" \
          --store-root "$QUICKSKIN_E2E_SERVER_STORE" \
          --github-output "$GITHUB_OUTPUT"

    - name: Decide whether this generation may publish an installed server
      id: server-store-policy
      shell: bash
      run: |
        set -euo pipefail
        read_only="$(python3 scripts/ci/runtime_store_cache_policy.py \
          --event-name "$GITHUB_EVENT_NAME" \
          --ref-name "$GITHUB_REF_NAME" \
          --ref-type "${GITHUB_REF_TYPE:-branch}" \
          --ref-protected "${GITHUB_REF_PROTECTED:-false}")"
        printf 'read-only=%s\n' "$read_only" >> "$GITHUB_OUTPUT"

    # An exact recipe key with no prefix fallback: a near miss must never satisfy a lookup that
    # the recipe digest exists to make exact. A miss simply reinstalls.
    - name: Restore the installed loader server for this recipe
      id: server-store-restore
      if: steps.server-store.outputs.transported == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.server-store.outputs.key }}
        path: ${{ steps.server-store.outputs.paths }}

    - name: Run contract-declared packaged scenarios
      shell: bash
      env:
        E2E_ROW_JSON: ${{ inputs.row-json }}
        E2E_SCENARIOS: ${{ inputs.scenarios }}
        E2E_SELECTION_BASE: ${{ inputs.selection-base }}
        E2E_SELECTION_POLICY: ${{ inputs.selection-policy }}
        E2E_SELECTION_SHA256: ${{ inputs.selection-sha256 }}
        RELEASE_TARGET: ${{ inputs.release-target }}
        E2E_COMPATIBILITY_MOD: ${{ inputs.compatibility-mod }}
        QUICKSKIN_E2E_CPM_MODEL_PATH: ${{ inputs.cpm-model-path }}
        QUICKSKIN_E2E_RUNTIME_STORE: ${{ runner.temp }}/quick-skin-runtime-store
        QUICKSKIN_E2E_SERVER_STORE: ${{ runner.temp }}/quick-skin-server-store
      run: |
        set -euo pipefail
        selection_arguments=()
        if [[ -n "$E2E_SELECTION_SHA256" ]]; then
          if [[ ! "$E2E_SELECTION_BASE" =~ ^[0-9a-f]{40}$ ||
                ! "$E2E_SELECTION_POLICY" =~ ^[0-9a-f]{40}$ ||
                ! "$E2E_SELECTION_SHA256" =~ ^[0-9a-f]{64}$ ||
                -n "$RELEASE_TARGET" || -n "$E2E_COMPATIBILITY_MOD" ]]; then
            exit 1
          fi
          selection_file="$RUNNER_TEMP/feature-selection/selection.json"
          if [[ "$(sha256sum "$selection_file" | cut -d ' ' -f 1)" != "$E2E_SELECTION_SHA256" ]]; then
            exit 1
          fi
          E2E_SCENARIOS="$(jq -er '.selection.runs | map(.scenario) | join(",") | select(length > 0)' "$selection_file")"
          selection_arguments=(--selection-admission "$selection_file"
            --selection-base "$E2E_SELECTION_BASE" --selection-policy "$E2E_SELECTION_POLICY")
        elif [[ -n "$E2E_SELECTION_BASE" || -n "$E2E_SELECTION_POLICY" ]]; then
          exit 1
        fi
        target_arguments=()
        if [[ -n "$RELEASE_TARGET" ]]; then
          target_arguments=(--target "$RELEASE_TARGET")
        fi
        compatibility_arguments=()
        if [[ -n "$E2E_COMPATIBILITY_MOD" ]]; then
          compatibility_arguments=(
            --compatibility-contract e2e/mod-compatibility-contract.json
            --compatibility-mod "$E2E_COMPATIBILITY_MOD"
          )
        fi
        if [[ "$E2E_COMPATIBILITY_MOD" == cpm ]]; then
          expected_cpm_model="$RUNNER_TEMP/qsm-protected-cpm-fixture/complex-model.bin"
          [[ "$QUICKSKIN_E2E_CPM_MODEL_PATH" == "$expected_cpm_model" ]]
          test -f "$QUICKSKIN_E2E_CPM_MODEL_PATH" \
            -a ! -L "$QUICKSKIN_E2E_CPM_MODEL_PATH"
        else
          [[ -z "$QUICKSKIN_E2E_CPM_MODEL_PATH" ]]
        fi
        xvfb-run --auto-servernum \
          --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render" \
          python e2e/orchestrator.py \
            --matrix release/release-matrix.json \
            ${target_arguments[@]+"${target_arguments[@]}"} \
            --row-json "$E2E_ROW_JSON" \
            --artifacts-manifest build/release/artifacts.json \
            --packaged \
            --scenarios "$E2E_SCENARIOS" \
            ${selection_arguments[@]+"${selection_arguments[@]}"} \
            ${compatibility_arguments[@]+"${compatibility_arguments[@]}"}

    - name: Preserve the original healthy coverage provenance
      if: always() && inputs.selection-sha256 != ''
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f e2e-out/current/selection.json ]]; then
          cmp --silent "$RUNNER_TEMP/feature-selection/selection.json" e2e-out/current/selection.json
          cp -- "$RUNNER_TEMP/feature-selection/coverage.json" e2e-out/current/coverage.json
        fi

    - name: Remove the protected CPM fixture
      if: always() && inputs.cpm-model-path != ''
      shell: bash
      env:
        QUICKSKIN_E2E_CPM_MODEL_PATH: ${{ inputs.cpm-model-path }}
      run: |
        set -euo pipefail
        fixture_root="$RUNNER_TEMP/qsm-protected-cpm-fixture"
        expected_cpm_model="$fixture_root/complex-model.bin"
        [[ "$QUICKSKIN_E2E_CPM_MODEL_PATH" == "$expected_cpm_model" ]]
        test ! -L "$QUICKSKIN_E2E_CPM_MODEL_PATH"
        rm -f -- "$QUICKSKIN_E2E_CPM_MODEL_PATH"
        rmdir "$fixture_root"

    - name: Publish the installed loader server for later generations
      if: >-
        steps.server-store.outputs.transported == 'true' &&
        steps.server-store-policy.outputs.read-only == 'false' &&
        steps.server-store-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.server-store.outputs.key }}
        path: ${{ steps.server-store.outputs.paths }}

    - name: Summarize runtime cost and cache behavior
      if: always()
      shell: bash
      run: |
        if [[ -f e2e-out/current/summary.json ]]; then
          python3 e2e/ci_summary.py \
            --summary e2e-out/current/summary.json \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload bounded packaged evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          e2e-out/current/summary.json
          e2e-out/current/resolved-matrix.json
          e2e-out/current/runtime-store.json
          e2e-out/current/selection.json
          e2e-out/current/coverage.json
          e2e-out/current/profiles/**/result.json
          e2e-out/current/profiles/**/logs/**
          e2e-out/current/profiles/**/e2e-report/**
          e2e-out/current/profiles/**/screenshots/**
          e2e-out/current/profiles/**/crash-reports/**
        if-no-files-found: error
        compression-level: 6
        retention-days: ${{ inputs.evidence-retention-days }}
