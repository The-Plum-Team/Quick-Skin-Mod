version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:17"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # mod-base is pinned by SHA and bumped only with `scripts/ci/mod_base_kit.py bump --to vX.Y.Z`,
    # which also re-synchronizes the managed files. A Dependabot bump would fail `template check`.
    # The managed region of pages.yml also pins actions/deploy-pages, so it moves only with a kit
    # bump as well.
    ignore:
      - dependency-name: "The-Plum-Team/mod-base*"
      - dependency-name: "actions/deploy-pages"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:27"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - build
    groups:
      gradle-production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /.github/claude
    schedule:
      interval: monthly
      day: monday
      time: "05:37"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels:
      - dependencies
      - ci
    groups:
      claude-cli:
        patterns:
          - "*"
