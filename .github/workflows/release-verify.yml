name: Verify pending releases

on:
  workflow_run:
    workflows: [Release, Recover release SBOM]
    types: [completed]
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional exact pending tag; empty checks all recorded drafts
        required: false
        type: string

permissions:
  contents: read

# A wakeup checks once and exits while moderation is pending. If final publication needs
# human approval, keep a single verifier active instead of requesting that approval repeatedly.
concurrency:
  group: release-verification
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    name: Observe pending marketplace approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      count: ${{ steps.pending.outputs.count }}
    steps:
      - name: Check out the protected verifier implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Authenticate original evidence and observe public file bytes once
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_TAG: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=()
          if [[ -n "$PENDING_TAG" ]]; then arguments+=(--tag "$PENDING_TAG"); fi
          python scripts/release/verify_pending_publications.py \
            "${arguments[@]}" --github-output "$GITHUB_OUTPUT"

  finalize:
    name: Finalize verified ${{ matrix.tag }}
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.count != '' && needs.verify.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-publish
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - name: Check out the protected verifier implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reauthenticate original bytes and publish the approved complete release
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_TAG: ${{ matrix.tag }}
        run: >-
          python scripts/release/verify_pending_publications.py
          --tag "$PENDING_TAG" --finalize
