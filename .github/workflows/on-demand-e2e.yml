name: Packaged E2E

# The slow lane, and the only one that launches Minecraft: it builds the inputs once, fans the
# contract-selected packaged scenarios out across both loaders. Pull requests run it automatically
# against only the lanes declared by their target version branch. Version synchronization also
# dispatches it explicitly because events created with GITHUB_TOKEN do not recursively trigger
# ordinary pull-request workflows. Secret-bearing visual review runs separately from this gate.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs packaged E2E
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string
      runtime_policy:
        description: Internal version-port runtime policy; ordinary runs must use full
        required: false
        default: full
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: packaged-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa

jobs:
  runtime-policy:
    name: Classify packaged runtime impact
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      effective: ${{ steps.policy.outputs.effective }}
      manifest: ${{ steps.policy.outputs.manifest }}

    steps:
      # Only the not-applicable revalidation reads Git history below; the full-policy
      # path short-circuits before touching the repository, so skip the full clone there.
      - name: Check out the exact requested head without credentials
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.runtime_policy == 'not-applicable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate any not-applicable request from protected policy
        id: candidate-policy
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_POLICY: ${{ inputs.runtime_policy || 'full' }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_POLICY" == full ]]; then
            printf 'effective=full\n' >> "$GITHUB_OUTPUT"
            printf 'manifest={}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REQUESTED_POLICY" == not-applicable ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF_TYPE" == branch ]]
          [[ "$GITHUB_REF_NAME" == automation/sync/* ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

          # This run is dispatched seconds after `gh pr create`, so retry a bounded number
          # of times: a not-yet-indexed automation PR must not silently degrade an
          # authenticated non-runtime port to a full Minecraft run.
          pr_json=""
          for attempt in $(seq 1 10); do
            pr_list="$(gh pr list --state open --head "$GITHUB_REF_NAME" --limit 2 \
              --json number)"
            if [[ "$(jq length <<< "$pr_list")" == 1 ]]; then
              pr_number="$(jq -r '.[0].number' <<< "$pr_list")"
              [[ "$pr_number" =~ ^[0-9]+$ ]]
              candidate_json="$(gh pr view "$pr_number" \
                --json baseRefName,baseRefOid,headRefName,headRefOid,isCrossRepository,labels,state)"
              if jq -e \
                  --arg branch "$GITHUB_REF_NAME" \
                  --arg head "$GITHUB_SHA" \
                  '.state == "OPEN" and .headRefName == $branch and .headRefOid == $head and (.isCrossRepository | not) and ([.labels[].name] | index("automated-version-sync")) != null' \
                  <<< "$candidate_json" > /dev/null; then
                pr_json="$candidate_json"
                break
              fi
            fi
            printf 'The open automation PR for %s is not yet consistent (attempt %s of 10).\n' \
              "$GITHUB_REF_NAME" "$attempt"
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done
          [[ -n "$pr_json" ]]
          base_branch="$(jq -r .baseRefName <<< "$pr_json")"
          base_sha="$(jq -r .baseRefOid <<< "$pr_json")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          target_slug="${base_branch//[^A-Za-z0-9._-]/-}"
          [[ "$GITHUB_REF_NAME" == "automation/sync/$target_slug/"* ]]

          protected_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$protected_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" \
            "+refs/heads/$base_branch:refs/remotes/origin/$base_branch" \
            "$protected_sha"
          [[ "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse "refs/remotes/origin/$base_branch")" == "$base_sha" ]]

          policy_dir="$RUNNER_TEMP/protected-e2e-policy"
          mkdir -p "$policy_dir"
          git show "$protected_sha:scripts/ci/e2e_impact.py" \
            > "$policy_dir/e2e_impact.py"
          git show "$protected_sha:scripts/release/version_branches.py" \
            > "$policy_dir/version_branches.py"
          python3 "$policy_dir/version_branches.py" \
            --target "$base_branch" > /dev/null

          # The head must be a chain of synchronization merges over the exact PR base: every
          # first-parent hop is a two-parent merge whose second parent is protected master
          # content. A new port is one hop; an updated open port adds one hop per wave.
          chain_commit="$GITHUB_SHA"
          chain_complete=false
          for chain_hop in $(seq 1 32); do
            read -r -a parents <<< "$(git rev-list --parents -n 1 "$chain_commit")"
            [[ "${#parents[@]}" == 3 ]]
            git merge-base --is-ancestor "${parents[2]}" "$protected_sha"
            chain_commit="${parents[1]}"
            if [[ "$chain_commit" == "$base_sha" ]]; then
              chain_complete=true
              break
            fi
          done
          [[ "$chain_complete" == true ]]

          impact_output="$RUNNER_TEMP/e2e-impact-output"
          : > "$impact_output"
          python3 "$policy_dir/e2e_impact.py" \
            --repository . \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$impact_output"
          runtime_required="$(sed -n 's/^runtime_required=//p' "$impact_output")"
          manifest="$(sed -n 's/^manifest=//p' "$impact_output")"
          [[ "$runtime_required" == false ]]
          jq -e \
            '.schema_version == 1 and .runtime_required == false and (.paths | type == "array" and length > 0) and (.runtime_paths == [])' \
            <<< "$manifest" > /dev/null
          printf 'effective=not-applicable\n' >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Resolve failures to the full runtime policy
        id: policy
        if: always()
        shell: bash
        env:
          CANDIDATE_MANIFEST: ${{ steps.candidate-policy.outputs.manifest }}
          CANDIDATE_OUTCOME: ${{ steps.candidate-policy.outcome }}
          CANDIDATE_POLICY: ${{ steps.candidate-policy.outputs.effective }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_OUTCOME" == success \
              && ("$CANDIDATE_POLICY" == full \
              || "$CANDIDATE_POLICY" == not-applicable) ]]; then
            printf 'effective=%s\n' "$CANDIDATE_POLICY" >> "$GITHUB_OUTPUT"
            printf 'manifest=%s\n' "${CANDIDATE_MANIFEST:-{}}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'effective=full\n' >> "$GITHUB_OUTPUT"
          printf 'manifest={}\n' >> "$GITHUB_OUTPUT"
          printf 'The requested runtime policy could not be authenticated; running full Packaged E2E.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build immutable E2E input bundle
    needs: runtime-policy
    if: >-
      needs.runtime-policy.result == 'success' &&
      needs.runtime-policy.outputs.effective == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      anchors: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < gradle/wrapper/gradle-9.7.1-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Install all required JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Build gate is the only writer. Packaged Minecraft jobs consume its stable cache
          # instead of creating another immutable cache generation for every E2E run.
          cache-read-only: true

      - name: Validate central release matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      # A version-port dispatch starts an exact-head Build gate run concurrently. When that
      # run has already finished successfully, reuse its verified staged bundle instead of
      # repeating the identical Gradle build. Every discovery, download, or verification
      # failure falls back to building from source; only a fully reverified bundle skips it.
      - name: Discover the exact-head Build gate staged bundle
        id: gate-bundle
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.attest_run_id == ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-gate.yml/runs?event=workflow_dispatch&status=success&head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] // empty')"
          [[ -n "$run_json" ]]
          jq -e \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/build-gate.yml" and .head_branch == $branch and .head_sha == $head and .head_repository.full_name == $repository' \
            <<< "$run_json" > /dev/null
          run_id="$(jq -r .id <<< "$run_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the staged Build gate bundle
        id: gate-bundle-download
        if: steps.gate-bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-release-bundle
          path: build/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gate-bundle.outputs.run_id }}

      - name: Reverify the reused staged bytes against this exact commit
        id: gate-bundle-verify
        if: steps.gate-bundle-download.outcome == 'success'
        continue-on-error: true
        run: python scripts/release/verify_release.py --verify-staged

      - name: Resolve whether the Build gate bundle was reused
        id: reuse
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.attest_run_id == ''
        shell: bash
        env:
          GATE_RUN_ID: ${{ steps.gate-bundle.outputs.run_id }}
          VERIFY_OUTCOME: ${{ steps.gate-bundle-verify.outcome }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == success ]]; then
            printf 'reused=true\n' >> "$GITHUB_OUTPUT"
            printf 'Reused the reverified staged bundle from Build gate run %s.\n' \
              "$GATE_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf build/release
          printf 'reused=false\n' >> "$GITHUB_OUTPUT"
          printf 'No exact-head Build gate bundle was authenticated; building from source.\n' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build all production artifacts and E2E harnesses
        if: steps.reuse.outputs.reused != 'true'
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify all production artifacts
        if: steps.reuse.outputs.reused != 'true'
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      - name: Resolve authoritative E2E matrix
        id: matrix
        shell: bash
        env:
          MATRIX_KIND: ${{ github.event_name == 'schedule' && 'native-anchors' || 'pr-anchors' }}
        run: |
          set -euo pipefail
          matrix="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind "$MATRIX_KIND")"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$matrix"
          printf 'coverage matrix: %s\n' "$MATRIX_KIND"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable E2E input bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-input-bundle
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ startsWith(github.ref_name, 'automation/sync/') && 7 || 1 }}

  e2e:
    name: ${{ matrix.id }} - contract scenarios
    needs:
      - runtime-policy
      - build
    if: >-
      needs.runtime-policy.result == 'success' &&
      needs.runtime-policy.outputs.effective == 'full' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.anchors) }}

    steps:
      - name: Check out exact tested orchestration code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run contract-selected packaged-JAR scenarios
        uses: ./.github/actions/run-packaged-e2e
        with:
          bundle-name: e2e-input-bundle
          row-json: ${{ toJSON(matrix) }}
          source-sha: ${{ github.sha }}
          scenarios: ${{ matrix.scenarios }}
          evidence-name: packaged-e2e-${{ matrix.id }}
          evidence-retention-days: ${{ startsWith(github.ref_name, 'automation/sync/') && '7' || '1' }}

  required-gate:
    name: Packaged E2E gate
    needs:
      - runtime-policy
      - build
      - e2e
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.attest_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require build and packaged behavior
        shell: bash
        env:
          POLICY_RESULT: ${{ needs.runtime-policy.result }}
          RUNTIME_POLICY: ${{ needs.runtime-policy.outputs.effective }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          [[ "$POLICY_RESULT" == success ]]
          case "$RUNTIME_POLICY" in
            full)
              [[ "$BUILD_RESULT" == success ]]
              [[ "$E2E_RESULT" == success ]]
              printf 'Packaged Minecraft was required and passed.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            not-applicable)
              [[ "$BUILD_RESULT" == skipped ]]
              [[ "$E2E_RESULT" == skipped ]]
              printf 'Packaged Minecraft was not applicable to this authenticated non-runtime port.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit 1
              ;;
          esac

  attest:
    name: Attest tested E2E on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: on-demand-e2e.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  prepare-pages-evidence:
    name: Prepare public visual evidence (advisory)
    needs:
      - runtime-policy
      - required-gate
      - attest
    # Non-attest runs boot this advisory job only on a release-branch-named ref; pull
    # requests, schedule, and automation/sync/* runs always resolve publish=false, so they
    # skip the runner entirely and the skip stays visible in the job graph.
    if: >-
      always() &&
      ((inputs.attest_run_id == '' &&
      (startsWith(github.ref_name, 'fabric-and-neoforge-') ||
      startsWith(github.ref_name, 'forge-and-fabric-')) &&
      needs.runtime-policy.outputs.effective == 'full' &&
      needs.required-gate.result == 'success') ||
      (inputs.attest_run_id != '' &&
      inputs.runtime_policy == 'full' &&
      needs.attest.result == 'success'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      published: ${{ steps.published.outputs.published }}

    steps:
      - name: Check out the final candidate tree without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked evidence decoder
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      # The job-level ref-name prefilter is shape-only; only a branch the release inventory
      # actually validates may create the stable artifact consumed by Pages.
      - name: Resolve exact public evidence provenance
        id: identity
        shell: bash
        env:
          ATTEST_BRANCH: ${{ inputs.attest_branch }}
          ATTEST_RUN_ID: ${{ inputs.attest_run_id }}
          ATTEST_SHA: ${{ inputs.attest_sha }}
          ATTEST_TARGET_SHA: ${{ inputs.attest_target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! python3 scripts/release/version_branches.py \
              --target "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_run_id="${ATTEST_RUN_ID:-$GITHUB_RUN_ID}"
          source_branch="${ATTEST_BRANCH:-$GITHUB_REF_NAME}"
          source_sha="${ATTEST_SHA:-$GITHUB_SHA}"
          target_sha="${ATTEST_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_branch" != *$'\n'* ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$GITHUB_SHA" ]]

          source_created_at="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" --jq .created_at)"
          target_created_at="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          test -n "$source_created_at"
          test -n "$target_created_at"

          printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"
          printf 'source_branch=%s\n' "$source_branch" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_created_at=%s\n' "$source_created_at" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'target_created_at=%s\n' "$target_created_at" >> "$GITHUB_OUTPUT"
          reference_retention_days="$(python3 e2e/visual_review.py \
            --matrix release/release-matrix.json \
            --reference-retention-days)"
          [[ "$reference_retention_days" == 1 || "$reference_retention_days" == 90 ]]
          printf 'reference_retention_days=%s\n' "$reference_retention_days" \
            >> "$GITHUB_OUTPUT"

      - name: Fetch exact packaged behavior evidence
        if: steps.identity.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packaged-e2e-*
          merge-multiple: true
          path: e2e-out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.source_run_id }}

      - name: Prepare the curated SHA-bound evidence bundle
        if: steps.identity.outputs.publish == 'true'
        run: >-
          python3 scripts/pages/evidence.py prepare
          --e2e-root e2e-out
          --matrix release/release-matrix.json
          --contract e2e/scenario-contract.json
          --output public-evidence
          --repository "$GITHUB_REPOSITORY"
          --source-run-id "${{ steps.identity.outputs.source_run_id }}"
          --source-branch "${{ steps.identity.outputs.source_branch }}"
          --source-sha "${{ steps.identity.outputs.source_sha }}"
          --source-created-at "${{ steps.identity.outputs.source_created_at }}"
          --target-run-id "$GITHUB_RUN_ID"
          --target-branch "$GITHUB_REF_NAME"
          --target-sha "${{ steps.identity.outputs.target_sha }}"
          --target-created-at "${{ steps.identity.outputs.target_created_at }}"

      - name: Upload stable public evidence for this release branch
        if: steps.identity.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-e2e-${{ github.ref_name }}
          path: public-evidence/
          if-no-files-found: error
          compression-level: 6
          # Ordinary raw handoffs are deleted after Pages promotion. The matrix-derived 1.20.1
          # visual anchor remains lossless for bounded AI comparison and is rotated on replacement.
          retention-days: ${{ steps.identity.outputs.reference_retention_days }}

      - name: Confirm the exact handoff was published
        id: published
        if: steps.identity.outputs.publish == 'true'
        run: printf 'published=true\n' >> "$GITHUB_OUTPUT"

  notify-pages:
    name: Wake the protected project site (advisory)
    needs: prepare-pages-evidence
    if: >-
      always() &&
      needs.prepare-pages-evidence.outputs.published == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the exact release-branch handoff
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          payload="$RUNNER_TEMP/pages-evidence-ready.json"
          jq -n \
            --arg evidence_branch "$GITHUB_REF_NAME" \
            --arg evidence_repository "$GITHUB_REPOSITORY" \
            --arg evidence_run_id "$GITHUB_RUN_ID" \
            --arg evidence_sha "$GITHUB_SHA" \
            '{event_type:"pages-evidence-ready",client_payload:{evidence_branch:$evidence_branch,evidence_repository:$evidence_repository,evidence_run_id:$evidence_run_id,evidence_sha:$evidence_sha}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null

  notify-version-port:
    name: Notify version port controller
    # Wait only for local advisory handoff jobs, never for the separate AI review workflow. This
    # makes the notification the settled tail of the source run while its conclusion still derives
    # exclusively from the required gate.
    needs:
      - runtime-policy
      - required-gate
      - prepare-pages-evidence
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the settled E2E result
        shell: bash
        env:
          GATE_RESULT: ${{ needs.required-gate.result }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          RUNTIME_POLICY: ${{ needs.runtime-policy.outputs.effective || inputs.runtime_policy }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          conclusion=success
          if [[ "$GATE_RESULT" != success ]]; then
            conclusion=failure
          fi
          payload="$RUNNER_TEMP/version-port-e2e-result.json"
          jq -n \
            --arg gate on-demand-e2e.yml \
            --arg conclusion "$conclusion" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg runtime_policy "$RUNTIME_POLICY" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,runtime_policy:$runtime_policy,source_event:$source_event,source_repository:$source_repository}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null

      - name: Request the separate AI visual review
        if: >-
          needs.required-gate.result == 'success' &&
          needs.runtime-policy.outputs.effective == 'full'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          payload="$RUNNER_TEMP/visual-review-dispatch.json"
          jq -n \
            --arg source_branch "$GITHUB_REF_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"visual-review-requested",client_payload:{source_branch:$source_branch,source_repository:$source_repository,source_run_id:$source_run_id,source_sha:$source_sha}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
