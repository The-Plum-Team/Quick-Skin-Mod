name: Packaged E2E

# Packaged Minecraft consumes the exact successful Build bundle, then runs contract-selected
# scenarios on every matrix lane. A standalone run without an available bundle uses the same
# isolated target compiler. Semantic visual review remains a separate protected workflow.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs packaged E2E
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string
      runtime_policy:
        description: Internal version-port runtime policy; ordinary runs must use full
        required: false
        default: full
        type: string
      capture_coverage:
        description: Use authenticated feature coverage or force every PR-profile capture
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full

permissions:
  actions: read
  contents: read

concurrency:
  group: packaged-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa

jobs:
  runtime-policy:
    name: Classify packaged runtime impact
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      effective: ${{ steps.policy.outputs.effective }}
      manifest: ${{ steps.policy.outputs.manifest }}

    steps:
      # Only the not-applicable revalidation reads Git history below; the full-policy
      # path short-circuits before touching the repository, so skip the full clone there.
      - name: Check out the exact requested head without credentials
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.runtime_policy == 'not-applicable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate any not-applicable request from protected policy
        id: candidate-policy
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_POLICY: ${{ inputs.runtime_policy || 'full' }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_POLICY" == full ]]; then
            printf 'effective=full\n' >> "$GITHUB_OUTPUT"
            printf 'manifest={}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REQUESTED_POLICY" == not-applicable ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF_TYPE" == branch ]]
          [[ "$GITHUB_REF_NAME" == automation/sync/* ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

          # This run is dispatched seconds after `gh pr create`, so retry a bounded number
          # of times: a not-yet-indexed automation PR must not silently degrade an
          # authenticated non-runtime port to a full Minecraft run.
          pr_json=""
          for attempt in $(seq 1 10); do
            pr_list="$(gh pr list --state open --head "$GITHUB_REF_NAME" --limit 2 \
              --json number)"
            if [[ "$(jq length <<< "$pr_list")" == 1 ]]; then
              pr_number="$(jq -r '.[0].number' <<< "$pr_list")"
              [[ "$pr_number" =~ ^[0-9]+$ ]]
              candidate_json="$(gh pr view "$pr_number" \
                --json baseRefName,baseRefOid,headRefName,headRefOid,isCrossRepository,labels,state)"
              if jq -e \
                  --arg branch "$GITHUB_REF_NAME" \
                  --arg head "$GITHUB_SHA" \
                  '.state == "OPEN" and .headRefName == $branch and .headRefOid == $head and (.isCrossRepository | not) and ([.labels[].name] | index("automated-version-sync")) != null' \
                  <<< "$candidate_json" > /dev/null; then
                pr_json="$candidate_json"
                break
              fi
            fi
            printf 'The open automation PR for %s is not yet consistent (attempt %s of 10).\n' \
              "$GITHUB_REF_NAME" "$attempt"
            if [[ "$attempt" -lt 10 ]]; then
              sleep 3
            fi
          done
          [[ -n "$pr_json" ]]
          base_branch="$(jq -r .baseRefName <<< "$pr_json")"
          base_sha="$(jq -r .baseRefOid <<< "$pr_json")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          target_slug="${base_branch//[^A-Za-z0-9._-]/-}"
          [[ "$GITHUB_REF_NAME" == "automation/sync/$target_slug/"* ]]

          protected_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$protected_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" \
            "+refs/heads/$base_branch:refs/remotes/origin/$base_branch" \
            "$protected_sha"
          [[ "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse "refs/remotes/origin/$base_branch")" == "$base_sha" ]]

          policy_dir="$RUNNER_TEMP/protected-e2e-policy"
          mkdir -p "$policy_dir"
          git show "$protected_sha:scripts/ci/e2e_impact.py" \
            > "$policy_dir/e2e_impact.py"
          git show "$protected_sha:scripts/release/version_branches.py" \
            > "$policy_dir/version_branches.py"
          python3 "$policy_dir/version_branches.py" \
            --target "$base_branch" > /dev/null

          # The head must be a chain of synchronization merges over the exact PR base: every
          # first-parent hop is a two-parent merge whose second parent is protected master
          # content. A new port is one hop; an updated open port adds one hop per wave.
          chain_commit="$GITHUB_SHA"
          chain_complete=false
          for chain_hop in $(seq 1 32); do
            read -r -a parents <<< "$(git rev-list --parents -n 1 "$chain_commit")"
            [[ "${#parents[@]}" == 3 ]]
            git merge-base --is-ancestor "${parents[2]}" "$protected_sha"
            chain_commit="${parents[1]}"
            if [[ "$chain_commit" == "$base_sha" ]]; then
              chain_complete=true
              break
            fi
          done
          [[ "$chain_complete" == true ]]

          impact_output="$RUNNER_TEMP/e2e-impact-output"
          : > "$impact_output"
          python3 "$policy_dir/e2e_impact.py" \
            --repository . \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$impact_output"
          runtime_required="$(sed -n 's/^runtime_required=//p' "$impact_output")"
          manifest="$(sed -n 's/^manifest=//p' "$impact_output")"
          [[ "$runtime_required" == false ]]
          jq -e \
            '.schema_version == 1 and .runtime_required == false and (.paths | type == "array" and length > 0) and (.runtime_paths == [])' \
            <<< "$manifest" > /dev/null
          printf 'effective=not-applicable\n' >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Resolve failures to the full runtime policy
        id: policy
        if: always()
        shell: bash
        env:
          CANDIDATE_MANIFEST: ${{ steps.candidate-policy.outputs.manifest }}
          CANDIDATE_OUTCOME: ${{ steps.candidate-policy.outcome }}
          CANDIDATE_POLICY: ${{ steps.candidate-policy.outputs.effective }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_OUTCOME" == success \
              && ("$CANDIDATE_POLICY" == full \
              || "$CANDIDATE_POLICY" == not-applicable) ]]; then
            printf 'effective=%s\n' "$CANDIDATE_POLICY" >> "$GITHUB_OUTPUT"
            printf 'manifest=%s\n' "${CANDIDATE_MANIFEST:-{}}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'effective=full\n' >> "$GITHUB_OUTPUT"
          printf 'manifest={}\n' >> "$GITHUB_OUTPUT"
          printf 'The requested runtime policy could not be authenticated; running full Packaged E2E.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  feature-policy:
    name: Select affected feature coverage
    needs: runtime-policy
    if: >-
      needs.runtime-policy.outputs.effective == 'full' &&
      inputs.capture_coverage != 'full' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' &&
        inputs.attest_run_id == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      selective: ${{ steps.result.outputs.selective }}
      base: ${{ steps.result.outputs.base }}
      policy: ${{ steps.result.outputs.policy }}
      selection_sha256: ${{ steps.result.outputs.selection_sha256 }}
    steps:
      - name: Check out protected feature policy
        id: protected
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: protected-policy
          persist-credentials: false
      - name: Read candidate Git history without executing candidate code
        id: candidate
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate-history
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate complete baseline and cumulative feature impact
        id: selection
        if: steps.protected.outcome == 'success' && steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          controller=protected-policy/scripts/ci/feature_coverage_consumer.py
          if [[ ! -f "$controller" ]]; then
            printf 'The protected base predates feature coverage; running the complete profile.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ || ! "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ||
                "$(git -C protected-policy rev-parse HEAD)" != "$POLICY_SHA" ||
                "$(git -C candidate-history rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            exit 1
          fi
          if ! jq -e '.schema_version == 3' protected-policy/release/release-matrix.json > /dev/null; then
            exit 0
          fi
          arguments=(
            --github-repository "$GITHUB_REPOSITORY"
            --repository "$GITHUB_WORKSPACE/candidate-history"
            --head "$TESTED_SHA" --policy "$POLICY_SHA" --run-id "$GITHUB_RUN_ID"
            --output "$RUNNER_TEMP/feature-selection" --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$PULL_NUMBER" ]]; then
            if [[ ! "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi
            arguments+=(--pull-number "$PULL_NUMBER")
          fi
          python3 "$controller" "${arguments[@]}"
      - name: Preserve authenticated selection and original coverage provenance
        id: upload
        if: steps.selection.outcome == 'success' && steps.selection.outputs.selective == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-feature-selection
          path: ${{ runner.temp }}/feature-selection/
          if-no-files-found: error
          retention-days: 1
      - name: Resolve unavailable selection to complete captures
        id: result
        if: always()
        shell: bash
        env:
          SELECTION_OUTCOME: ${{ steps.selection.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SELECTIVE: ${{ steps.selection.outputs.selective }}
          SELECTION_BASE: ${{ steps.selection.outputs.base }}
          SELECTION_POLICY: ${{ steps.selection.outputs.policy }}
          SELECTION_SHA256: ${{ steps.selection.outputs.selection_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$SELECTION_OUTCOME" == success && "$UPLOAD_OUTCOME" == success &&
                "$SELECTIVE" == true && "$SELECTION_BASE" =~ ^[0-9a-f]{40}$ &&
                "$SELECTION_POLICY" =~ ^[0-9a-f]{40}$ && "$SELECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'selective=true\nbase=%s\npolicy=%s\nselection_sha256=%s\n' \
              "$SELECTION_BASE" "$SELECTION_POLICY" "$SELECTION_SHA256" >> "$GITHUB_OUTPUT"
            printf 'Authenticated cumulative feature captures selected.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'selective=false\nbase=\npolicy=\nselection_sha256=\n' >> "$GITHUB_OUTPUT"
            printf 'Complete captures required; no reusable feature selection was established.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  build-source:
    name: Resolve the exact source Build bundle
    needs: runtime-policy
    if: >-
      needs.runtime-policy.result == 'success' &&
      needs.runtime-policy.outputs.effective == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reused: ${{ steps.bundle.outputs.reused }}
      run_id: ${{ steps.bundle.outputs.run_id }}
      artifact_id: ${{ steps.bundle.outputs.artifact_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Authenticate the complete Build bundle and wait for PR compilation
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/staged_build_bundle.py --wait-seconds 5400

  compile:
    needs: build-source
    if: >-
      needs.build-source.result == 'success' &&
      needs.build-source.outputs.reused == 'false'
    uses: ./.github/workflows/build-matrix.yml

  build:
    name: Build immutable E2E input bundle
    needs: [runtime-policy, build-source, compile]
    if: >-
      always() && !cancelled() && needs.runtime-policy.result == 'success' &&
      needs.runtime-policy.outputs.effective == 'full' &&
      needs.build-source.result == 'success' &&
      (needs.build-source.outputs.reused == 'true' || needs.compile.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      anchors: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the authenticated Build gate bundle by immutable ID
        if: needs.build-source.outputs.reused == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-source.outputs.artifact_id }}
          merge-multiple: true
          path: build/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.build-source.outputs.run_id }}
      - name: Download the independently compiled complete matrix
        if: needs.build-source.outputs.reused == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-matrix-bundle
          path: build/release
      - name: Reverify the staged bytes against this exact tested commit
        run: python scripts/release/verify_release.py --verify-staged

      - name: Resolve authoritative E2E matrix
        id: matrix
        shell: bash
        env:
          MATRIX_KIND: ${{ github.event_name == 'schedule' && 'native-anchors' || 'pr-anchors' }}
        run: |
          set -euo pipefail
          matrix="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind "$MATRIX_KIND")"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$matrix"
          printf 'coverage matrix: %s\n' "$MATRIX_KIND"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable E2E input bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-input-bundle
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ startsWith(github.ref_name, 'automation/sync/') && 7 || 1 }}

  e2e:
    name: ${{ matrix.id }} - contract scenarios
    needs:
      - runtime-policy
      - build
      - feature-policy
    if: >-
      always() && !cancelled() && needs.runtime-policy.result == 'success' &&
      needs.runtime-policy.outputs.effective == 'full' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Every Minecraft process stays isolated; independent versions need not wait eight waves.
      max-parallel: 16
      matrix: ${{ fromJSON(needs.build.outputs.anchors) }}

    steps:
      - name: Check out exact tested orchestration code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.feature-policy.outputs.selective == 'true' && '0' || '1' }}
          persist-credentials: false

      - name: Run contract-selected packaged-JAR scenarios
        uses: ./.github/actions/run-packaged-e2e
        with:
          bundle-name: e2e-input-bundle
          row-json: ${{ toJSON(matrix) }}
          source-sha: ${{ github.sha }}
          scenarios: ${{ matrix.scenarios }}
          selection-base: ${{ needs.feature-policy.outputs.base }}
          selection-policy: ${{ needs.feature-policy.outputs.policy }}
          selection-sha256: ${{ needs.feature-policy.outputs.selection_sha256 }}
          evidence-name: packaged-e2e-${{ matrix.id }}
          evidence-retention-days: ${{ startsWith(github.ref_name, 'automation/sync/') && '7' || '1' }}

  required-gate:
    name: Packaged E2E gate
    needs:
      - runtime-policy
      - build
      - e2e
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.attest_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require build and packaged behavior
        shell: bash
        env:
          POLICY_RESULT: ${{ needs.runtime-policy.result }}
          RUNTIME_POLICY: ${{ needs.runtime-policy.outputs.effective }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          [[ "$POLICY_RESULT" == success ]]
          case "$RUNTIME_POLICY" in
            full)
              [[ "$BUILD_RESULT" == success ]]
              [[ "$E2E_RESULT" == success ]]
              printf 'Packaged Minecraft was required and passed.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            not-applicable)
              [[ "$BUILD_RESULT" == skipped ]]
              [[ "$E2E_RESULT" == skipped ]]
              printf 'Packaged Minecraft was not applicable to this authenticated non-runtime port.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit 1
              ;;
          esac

  attest:
    name: Attest tested E2E on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: on-demand-e2e.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  pages-inventory:
    name: Resolve public evidence targets (advisory)
    needs:
      - runtime-policy
      - required-gate
      - attest
    # Only complete public-profile runs may emit handoffs. Scheduled release-profile
    # and pull-request evidence have different coverage/provenance and stay private.
    if: >-
      always() && !cancelled() &&
      ((inputs.attest_run_id == '' &&
      ((github.ref_name == 'master' && github.event_name == 'workflow_dispatch') ||
      startsWith(github.ref_name, 'fabric-and-neoforge-') ||
      startsWith(github.ref_name, 'forge-and-fabric-')) &&
      needs.runtime-policy.outputs.effective == 'full' &&
      needs.required-gate.result == 'success') ||
      (inputs.attest_run_id != '' &&
      inputs.runtime_policy == 'full' &&
      needs.attest.result == 'success'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.inventory.outputs.targets }}
    steps:
      - name: Check out the exact source inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Derive every public target from the validated release matrix
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          source_branch="$(python3 scripts/pages/evidence_target.py --kind source-branch)"
          if [[ "$source_branch" != "$GITHUB_REF_NAME" ]]; then
            printf 'Public evidence requires the canonical source branch.\n' >&2
            exit 1
          fi
          targets="$(python3 scripts/pages/evidence_target.py --kind matrix)"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"

  prepare-pages-evidence:
    name: Prepare public evidence for ${{ matrix.bundle_key }} (advisory)
    needs:
      - pages-inventory
      - feature-policy
    if: always() && !cancelled() && needs.pages-inventory.result == 'success' && needs.pages-inventory.outputs.targets != ''
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.pages-inventory.outputs.targets) }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      published: ${{ steps.published.outputs.published }}

    steps:
      - name: Check out the final candidate tree without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.feature-policy.outputs.selective == 'true' && '0' || '1' }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked evidence decoder
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      # The job-level ref-name prefilter is shape-only; only a branch the release inventory
      # actually validates may create the stable artifact consumed by Pages.
      - name: Resolve exact public evidence provenance
        id: identity
        shell: bash
        env:
          ATTEST_BRANCH: ${{ inputs.attest_branch }}
          ATTEST_RUN_ID: ${{ inputs.attest_run_id }}
          ATTEST_SHA: ${{ inputs.attest_sha }}
          ATTEST_TARGET_SHA: ${{ inputs.attest_target_sha }}
          SOURCE_BRANCH: ${{ matrix.source_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canonical_branch="$(python3 scripts/pages/evidence_target.py --kind source-branch)"
          if [[ "$SOURCE_BRANCH" != "$GITHUB_REF_NAME" || "$canonical_branch" != "$SOURCE_BRANCH" ]]; then
            printf 'Public evidence source identity changed.\n' >&2
            exit 1
          fi

          source_run_id="${ATTEST_RUN_ID:-$GITHUB_RUN_ID}"
          source_branch="${ATTEST_BRANCH:-$GITHUB_REF_NAME}"
          source_sha="${ATTEST_SHA:-$GITHUB_SHA}"
          target_sha="${ATTEST_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_branch" != *$'\n'* ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" == "$GITHUB_SHA" ]]

          source_created_at="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" --jq .created_at)"
          target_created_at="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          test -n "$source_created_at"
          test -n "$target_created_at"

          printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"
          printf 'source_branch=%s\n' "$source_branch" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_created_at=%s\n' "$source_created_at" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'target_created_at=%s\n' "$target_created_at" >> "$GITHUB_OUTPUT"

      - name: Fetch exact packaged behavior evidence
        if: steps.identity.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.artifact_pattern }}
          merge-multiple: true
          path: e2e-out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.source_run_id }}

      - name: Prepare the curated SHA-bound evidence bundle
        if: steps.identity.outputs.publish == 'true'
        shell: bash
        env:
          MINECRAFT_TARGET: ${{ matrix.minecraft_target }}
          SOURCE_RUN_ID: ${{ steps.identity.outputs.source_run_id }}
          SOURCE_BRANCH: ${{ steps.identity.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SOURCE_CREATED_AT: ${{ steps.identity.outputs.source_created_at }}
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
          TARGET_CREATED_AT: ${{ steps.identity.outputs.target_created_at }}
          SELECTION_ENABLED: ${{ needs.feature-policy.outputs.selective }}
          SELECTION_BASE: ${{ needs.feature-policy.outputs.base }}
          SELECTION_POLICY: ${{ needs.feature-policy.outputs.policy }}
          SELECTION_SHA256: ${{ needs.feature-policy.outputs.selection_sha256 }}
        run: |
          set -euo pipefail
          target_argument=()
          if [[ -n "$MINECRAFT_TARGET" ]]; then
            target_argument=(--minecraft-target "$MINECRAFT_TARGET")
          fi
          selection_arguments=()
          if [[ "$SELECTION_ENABLED" == true ]]; then
            if [[ ! "$SELECTION_SHA256" =~ ^[0-9a-f]{64}$ ||
                  "$(sha256sum e2e-out/selection.json | cut -d' ' -f1)" != "$SELECTION_SHA256" ]]; then
              printf 'Public runtime selection differs from protected admission.\n' >&2
              exit 1
            fi
            selection_arguments=(--selection-admission e2e-out/selection.json
              --selection-coverage e2e-out/coverage.json --selection-base "$SELECTION_BASE"
              --selection-policy "$SELECTION_POLICY")
          fi
          python3 scripts/pages/evidence.py prepare \
            --e2e-root e2e-out \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --output public-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-branch "$SOURCE_BRANCH" \
            --source-sha "$SOURCE_SHA" \
            --source-created-at "$SOURCE_CREATED_AT" \
            --target-run-id "$GITHUB_RUN_ID" \
            --target-branch "$GITHUB_REF_NAME" \
            --target-sha "$TARGET_SHA" \
            --target-created-at "$TARGET_CREATED_AT" \
            ${target_argument[@]+"${target_argument[@]}"} \
            ${selection_arguments[@]+"${selection_arguments[@]}"}

      - name: Upload stable public evidence for this Minecraft target
        if: steps.identity.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-e2e-${{ matrix.bundle_key }}
          path: public-evidence/
          if-no-files-found: error
          compression-level: 6
          # Ordinary raw handoffs are deleted after Pages promotion. The matrix-derived 1.20.1
          # visual anchor remains lossless for bounded AI comparison and is rotated on replacement.
          retention-days: ${{ matrix.raw_retention_days }}

      - name: Confirm the exact handoff was published
        id: published
        if: steps.identity.outputs.publish == 'true'
        run: printf 'published=true\n' >> "$GITHUB_OUTPUT"

  notify-pages:
    name: Wake the protected project site (advisory)
    needs: prepare-pages-evidence
    if: >-
      always() &&
      needs.prepare-pages-evidence.outputs.published == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the exact release-branch handoff
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          payload="$RUNNER_TEMP/pages-evidence-ready.json"
          jq -n \
            --arg evidence_branch "$GITHUB_REF_NAME" \
            --arg evidence_repository "$GITHUB_REPOSITORY" \
            --arg evidence_run_id "$GITHUB_RUN_ID" \
            --arg evidence_sha "$GITHUB_SHA" \
            '{event_type:"pages-evidence-ready",client_payload:{evidence_branch:$evidence_branch,evidence_repository:$evidence_repository,evidence_run_id:$evidence_run_id,evidence_sha:$evidence_sha}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null

  notify-shared-review:
    name: Wake shared-source visual review (advisory)
    needs:
      - required-gate
      - prepare-pages-evidence
      - notify-pages
    if: >-
      always() && needs.required-gate.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.attest_run_id == '' &&
      github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the current protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Wake visual review for the completed shared generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/master ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ || ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Shared review wake requires a canonical master runtime generation.\n' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ||
                "$(python3 scripts/release/release_sources.py --kind mode)" != shared ]]; then
            printf 'This runtime generation no longer owns the protected shared source.\n'
            exit 0
          fi
          source scripts/ci/github_api_retry.sh
          current_sha="$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            printf 'Shared source advanced before its visual-review wake.\n'
            exit 0
          fi
          payload="$RUNNER_TEMP/shared-visual-review-request.json"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            '{event_type:"visual-review-requested",client_payload:{source_repository:$repository,
              source_run_id:$run_id,source_sha:$sha,source_branch:"master"}}' > "$payload"
          github_api_retry --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" > /dev/null

  notify-version-port:
    name: Notify version port controller
    # Wait only for local advisory handoff jobs, never for the separate AI review workflow. This
    # makes the notification the settled tail of the source run while its conclusion still derives
    # exclusively from the required gate.
    needs:
      - runtime-policy
      - required-gate
      - prepare-pages-evidence
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the settled E2E result
        shell: bash
        env:
          GATE_RESULT: ${{ needs.required-gate.result }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          RUNTIME_POLICY: ${{ needs.runtime-policy.outputs.effective || inputs.runtime_policy }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          conclusion=success
          if [[ "$GATE_RESULT" != success ]]; then
            conclusion=failure
          fi
          payload="$RUNNER_TEMP/version-port-e2e-result.json"
          jq -n \
            --arg gate on-demand-e2e.yml \
            --arg conclusion "$conclusion" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg runtime_policy "$RUNTIME_POLICY" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,runtime_policy:$runtime_policy,source_event:$source_event,source_repository:$source_repository}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null

      - name: Request the separate AI visual review
        if: >-
          needs.required-gate.result == 'success' &&
          needs.runtime-policy.outputs.effective == 'full'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          payload="$RUNNER_TEMP/visual-review-dispatch.json"
          jq -n \
            --arg source_branch "$GITHUB_REF_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"visual-review-requested",client_payload:{source_branch:$source_branch,source_repository:$source_repository,source_run_id:$source_run_id,source_sha:$source_sha}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
