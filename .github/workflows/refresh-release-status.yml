name: Refresh release status table

# The README status inventory comes from the complete shared-source matrix. Source changes and
# the scheduled recovery refresh keep it current. Changes travel
# through one reusable automation PR so master can remain PR-only with no workflow bypass.
on:
  push:
    branches: [master]
    paths:
      - release/release-matrix.json
      - gradle.properties
      - scripts/release/status_table.py
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-release-status
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate version badges
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked Pages image dependency
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      - name: Validate the authoritative shared-source matrix
        run: python3 scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Generate the deterministic README candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/status_table.py \
            --matrix release/release-matrix.json \
            --repository "$GITHUB_REPOSITORY" \
            --readme README.md \
            > "$RUNNER_TEMP/generated-README.md"
          if cmp --silent README.md "$RUNNER_TEMP/generated-README.md"; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated documentation and repository tooling
        run: |
          python3 scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme "$RUNNER_TEMP/generated-README.md" \
            --profile-branch master \
            --check
          python3 -m compileall -q e2e scripts
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          python3 -m unittest discover \
            -s scripts/release/tests -p 'test_*.py' -v

      - name: Update the automation branch and PR
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          AUTOMATION_BRANCH: automation/refresh-release-status
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --no-tags origin "$AUTOMATION_BRANCH"; then
            previous_head="$(git rev-parse FETCH_HEAD)"
            git switch --detach "$previous_head"
            set +e
            git merge --no-edit "$base_sha"
            merge_status=$?
            set -e
            if [[ $merge_status -ne 0 ]]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              [[ "$conflicts" == README.md ]]
              cp "$RUNNER_TEMP/generated-README.md" README.md
              git add README.md
              git commit --no-edit
            fi
          else
            previous_head=''
          fi

          if [[ -z "$previous_head" ]]; then
            git switch --detach "$base_sha"
          fi
          cp "$RUNNER_TEMP/generated-README.md" README.md
          git diff --check
          if ! git diff --quiet -- README.md; then
            git add README.md
            git diff --cached --check
            git commit -m 'docs: refresh release status table'
          fi
          cmp --silent README.md "$RUNNER_TEMP/generated-README.md"
          changed_paths="$(git diff --name-only "$base_sha" HEAD)"
          [[ "$changed_paths" == README.md ]]

          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$previous_head" || "$head_sha" != "$previous_head" ]]; then
            git push origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          fi

          pr_url="$(gh pr list --state open --base master --head "$AUTOMATION_BRANCH" \
            --json url --jq '.[0].url // ""')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create \
              --base master \
              --head "$AUTOMATION_BRANCH" \
              --title 'docs: refresh release status table' \
              --body 'Automated deterministic refresh generated from the authoritative shared-source release matrix.')"
          fi

          # Gate dispatch is keyed to the current automation head, not to whether this run
          # pushed it: a cancellation between push and dispatch must not strand the PR. The
          # response is read shape-agnostically so an object or page-array body both count.
          gate_runs_for_head() {
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$head_sha&per_page=1" \
              --jq 'if type == "array" then [.[].workflow_runs[]?] else .workflow_runs end | length'
          }
          if [[ "$(gate_runs_for_head build-gate.yml)" == 0 ]]; then
            printf 'Dispatching build-gate.yml for automation head %s\n' "$head_sha"
            gh workflow run build-gate.yml --ref "$AUTOMATION_BRANCH"
          else
            printf 'build-gate.yml already has a run for %s\n' "$head_sha"
          fi
          if [[ "$(gate_runs_for_head on-demand-e2e.yml)" == 0 ]]; then
            printf 'Dispatching on-demand-e2e.yml for automation head %s\n' "$head_sha"
            gh workflow run on-demand-e2e.yml --ref "$AUTOMATION_BRANCH"
          else
            printf 'on-demand-e2e.yml already has a run for %s\n' "$head_sha"
          fi
          printf 'Release status PR: %s\n' "$pr_url"
