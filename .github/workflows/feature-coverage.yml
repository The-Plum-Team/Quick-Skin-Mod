name: Certify complete feature coverage
run-name: Complete baseline ${{ github.event.client_payload.source_run_id || inputs.source_run_id }} attempt ${{ github.event.client_payload.source_run_attempt || inputs.source_run_attempt }}

on:
  repository_dispatch:
    types:
      - feature-coverage-requested
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing complete shared-source Packaged E2E run to certify without another model call
        required: true
        type: string
      source_run_attempt:
        description: Exact current attempt of the complete source run
        required: true
        default: "1"
        type: string

permissions: {}

concurrency:
  group: quick-skin-feature-baseline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: Authenticate complete shared feature coverage
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact protected baseline policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Authenticate the existing source and all normalized reviews
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.client_payload.producer_run_id }}
          REQUEST_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          REQUESTED_SOURCE_RUN: ${{ inputs.source_run_id || github.event.client_payload.source_run_id }}
          REQUESTED_SOURCE_ATTEMPT: ${{ inputs.source_run_attempt || github.event.client_payload.source_run_attempt }}
          REQUESTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$GITHUB_REF" != refs/heads/master ]]; then
            printf 'Feature coverage requires the exact protected master checkout.\n' >&2
            exit 1
          fi
          if [[ "$(python3 scripts/release/release_sources.py --kind mode)" != shared ]]; then
            printf 'Historical source layouts do not publish shared feature baselines.\n'
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch &&
                ( "$REQUEST_REPOSITORY" != "$GITHUB_REPOSITORY" || "$REQUESTED_SOURCE_SHA" != "$GITHUB_SHA" ) ]]; then
            printf 'Feature coverage wake has a foreign repository identity.\n' >&2
            exit 1
          fi
          if [[ -n "$TRIGGER_RUN_ID" ]]; then
            source_arguments=(--trigger-run-id "$TRIGGER_RUN_ID")
          else
            source_arguments=(--source-run-id "$REQUESTED_SOURCE_RUN")
          fi
          python3 scripts/ci/feature_coverage_github.py \
            "${source_arguments[@]}" --github-repository "$GITHUB_REPOSITORY" \
            --expected-source-run-id "$REQUESTED_SOURCE_RUN" \
            --expected-source-attempt "$REQUESTED_SOURCE_ATTEMPT" \
            --source-sha "$GITHUB_SHA" --issuer-run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/feature-baseline/baseline.json" --github-output "$GITHUB_OUTPUT"
      - name: Recheck the source immediately before publishing its baseline
        id: current
        if: steps.baseline.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SOURCE_RUN: ${{ steps.baseline.outputs.source_run_id }}
          BASELINE_SOURCE_ATTEMPT: ${{ steps.baseline.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$BASELINE_SOURCE_RUN" =~ ^[1-9][0-9]*$ || ! "$BASELINE_SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          current_attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_SOURCE_RUN" --jq .run_attempt)"
          if [[ "$current_sha" == "$GITHUB_SHA" && "$current_attempt" == "$BASELINE_SOURCE_ATTEMPT" ]]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the complete feature baseline
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          path: ${{ runner.temp }}/feature-baseline/baseline.json
          if-no-files-found: error
          retention-days: 90
