name: AI visual review

# This workflow authenticates and curates immutable review capsules from protected code. Ordinary
# trusted runs arrive through workflow_run; GITHUB_TOKEN-driven version ports use the explicit
# authenticated dispatch because recursive workflow events are suppressed. Separate protected,
# artifact-scoped drainers own the Claude credential. Reports are not required gate conclusions;
# only a clean synchronized 1.20.1 report can mint the certificate that releases the later-version
# wave.
on:
  repository_dispatch:
    types:
      - visual-review-requested
  workflow_run:
    workflows:
      - Packaged E2E
    types:
      - completed

permissions: {}

concurrency:
  group: >-
    visual-review-${{ github.event.client_payload.source_run_id ||
    github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  authenticate:
    name: Authenticate successful packaged evidence
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # A source wake can coincide with a wide release fan-out that exhausts the installation API
    # quota. Authentication waits for the declared reset without repeatedly probing the closed
    # window; it never holds a Claude-capacity slot.
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_inventory: ${{ steps.source.outputs.artifact_inventory }}
      eligible: ${{ steps.source.outputs.eligible }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}

    steps:
      - name: Check out the exact protected impact policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Authenticate scalar payloads and the required gate before invoking protected policy code.
      - name: Resolve the exact trusted source run
        id: source
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ github.event.client_payload.source_branch }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          printf 'eligible=false\n' >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            [[ "$DISPATCH_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
            source_run_id="$DISPATCH_RUN_ID"
            source_branch="$DISPATCH_BRANCH"
            source_sha="$DISPATCH_SHA"
          else
            source_run_id="$TRIGGER_RUN_ID"
            source_branch="$TRIGGER_BRANCH"
            source_sha="$TRIGGER_SHA"
          fi
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          source_run=''
          for attempt in {1..120}; do
            # A transient API error consumes one bounded attempt instead of failing the job.
            if ! source_run="$(github_api_retry \
                "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" 2>/dev/null)"; then
              source_run=''
              sleep 2
              continue
            fi
            if [[ "$(jq -r .status <<< "$source_run")" == completed ]]; then
              break
            fi
            sleep 2
          done
          # The review is advisory: a source run that never settled successfully inside the poll
          # budget is skipped loudly instead of surfacing as a red advisory run.
          if [[ -z "$source_run" ]] \
            || [[ "$(jq -r .status <<< "$source_run")" != completed ]] \
            || [[ "$(jq -r .conclusion <<< "$source_run")" != success ]]; then
            printf 'source run not settled within budget; skipping advisory review\n'
            exit 0
          fi
          workflow_id="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/workflows/on-demand-e2e.yml" --jq .id)"
          jq -e \
            --arg branch "$source_branch" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$source_sha" \
            --argjson run_id "$source_run_id" \
            --argjson workflow_id "$workflow_id" \
            '.id == $run_id and .workflow_id == $workflow_id and
             .status == "completed" and .conclusion == "success" and
             (.event == "pull_request" or .event == "schedule" or
              .event == "workflow_dispatch") and
             .head_branch == $branch and .head_sha == $sha and
             .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$source_run" > /dev/null

          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            [[ "$(jq -r .event <<< "$source_run")" == workflow_dispatch ]]
            [[ "$source_branch" == automation/sync/* ]]
          fi

          # Ordinary PR evidence can be deterministically irrelevant to this review domain even
          # though the packaged gate ran fail-closed. Only protected master code, a complete
          # server-side file inventory, and the narrow source-PR allowlist may suppress the
          # ordinary visual model. Compatibility-review orchestration is intentionally isolated;
          # visual prompts, runners, scenarios, product code, and unknown paths remain reviewable.
          if [[ "$(jq -r .event <<< "$source_run")" == pull_request ]]; then
            associated_pulls="$(github_api_retry -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$source_sha/pulls?per_page=20")"
            source_pr_number="$(jq -er \
              --arg branch "$source_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$source_sha" \
              'select(type == "array" and length <= 20) |
               [.[] | select(
                 .head.ref == $branch and .head.sha == $sha and
                 .head.repo.full_name == $repository and
                 .base.repo.full_name == $repository)] |
               if length == 1 then .[0].number else error("ambiguous source PR") end' \
              <<< "$associated_pulls")"
            [[ "$source_pr_number" =~ ^[1-9][0-9]*$ ]]
            source_pr="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/pulls/$source_pr_number")"
            jq -e \
              --arg branch "$source_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$source_sha" \
              --argjson number "$source_pr_number" \
              '.number == $number and .state == "open" and .merged == false and
               .head.ref == $branch and .head.sha == $sha and
               .head.repo.full_name == $repository and
               .base.repo.full_name == $repository and
               (.changed_files | type == "number" and . > 0 and . <= 100)' \
              <<< "$source_pr" > /dev/null
            changed_files="$(jq -r .changed_files <<< "$source_pr")"
            source_pr_files="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/pulls/$source_pr_number/files?per_page=100")"
            source_pr_files_path="$(mktemp \
              "$RUNNER_TEMP/visual-review-source-impact.XXXXXX.json")"
            printf '%s' "$source_pr_files" > "$source_pr_files_path"
            impact="$(python3 scripts/ci/visual_review_impact.py \
              --files "$source_pr_files_path" \
              --changed-files "$changed_files" \
              --scope source-pr)"
            [[ "$impact" == review || "$impact" == skip ]]
            if [[ "$impact" == skip ]]; then
              printf 'Ignoring source PR %s: its complete diff is outside ordinary visual review\n' \
                "$source_pr_number"
              exit 0
            fi
          fi

          if [[ "$(jq -r .event <<< "$source_run")" == workflow_dispatch \
              && "$source_branch" == automation/sync/* ]]; then
            anchor_branch="$(jq -er '
              .unit_test_version as $version |
              select($version == "1.20.1") |
              select(([.artifacts[] |
                select(.artifact_version == $version) | .loader] |
                sort | unique) == ["fabric", "forge"]) |
              .project.release_branch |
              select(type == "string" and length > 0)
            ' release/release-matrix.json)"

            # A shared visual-review infrastructure change is exercised once on its source PR.
            # Its generated non-anchor ports still need Build and Packaged E2E, but reviewing the
            # same unaffected screenshots for every later release branch would spend model
            # capacity without adding product signal. Skip only an exact, bot-owned non-anchor PR
            # whose complete server-side file inventory is confined to this orchestration, its
            # contracts, and documentation. Any ambiguity or renamed runtime path falls through.
            associated_pulls="$(github_api_retry -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$source_sha/pulls?per_page=20" \
              2>/dev/null || true)"
            source_pr_number=""
            if [[ -n "$associated_pulls" ]]; then
              source_pr_number="$(jq -er \
                --arg branch "$source_branch" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg sha "$source_sha" \
                'select(type == "array" and length <= 20) |
                 [.[] | select(
                   .head.ref == $branch and .head.sha == $sha and
                   .head.repo.full_name == $repository and
                   .base.repo.full_name == $repository and
                   .user.login == "github-actions[bot]")] |
                 if length == 1 then .[0].number else empty end' \
                <<< "$associated_pulls" 2>/dev/null || true)"
            fi
            if [[ "$source_pr_number" =~ ^[1-9][0-9]*$ ]]; then
              source_pr="$(github_api_retry \
                "repos/$GITHUB_REPOSITORY/pulls/$source_pr_number" \
                2>/dev/null || true)"
              changed_files=""
              source_pr_base=""
              source_pr_merged=""
              if [[ -n "$source_pr" ]] && jq -e \
                  --arg branch "$source_branch" \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg sha "$source_sha" \
                  --argjson number "$source_pr_number" \
                  '.number == $number and
                   (.state == "open" or .state == "closed") and
                   .head.ref == $branch and .head.sha == $sha and
                   .head.repo.full_name == $repository and
                   .base.repo.full_name == $repository and
                   (.base.ref | type == "string" and length > 0) and
                   (.merged | type == "boolean") and
                   .user.login == "github-actions[bot]" and
                   (.changed_files | type == "number" and . > 0 and . <= 100)' \
                  <<< "$source_pr" > /dev/null; then
                changed_files="$(jq -r .changed_files <<< "$source_pr")"
                source_pr_base="$(jq -er .base.ref <<< "$source_pr")"
                source_pr_merged="$(jq -er \
                  '.merged | if . then "true" else "false" end' <<< "$source_pr")"
              fi
              if [[ "$source_pr_base" == "$anchor_branch" \
                  && "$source_pr_merged" != true ]]; then
                # The exact merge handler sends another authenticated request after the anchor
                # merge is known. Do not spend model capacity or risk consuming a clean report
                # while the independent Build gate is still pending.
                printf 'Deferring semantic anchor review until PR %s is merged\n' \
                  "$source_pr_number"
                exit 0
              fi
              if [[ "$changed_files" =~ ^[1-9][0-9]*$ ]]; then
                source_pr_files="$(github_api_retry \
                  "repos/$GITHUB_REPOSITORY/pulls/$source_pr_number/files?per_page=100" \
                  2>/dev/null || true)"
                if [[ -n "$source_pr_files" ]]; then
                  source_pr_files_path="$(mktemp \
                    "$RUNNER_TEMP/visual-review-impact.XXXXXX.json")"
                  printf '%s' "$source_pr_files" > "$source_pr_files_path"
                  impact="$(python3 scripts/ci/visual_review_impact.py \
                    --files "$source_pr_files_path" \
                    --changed-files "$changed_files" \
                    --scope replicated-port)"
                  [[ "$impact" == review || "$impact" == skip ]]
                  # The merge controller independently authenticates Build, full anchor E2E,
                  # merge topology, and this exact protected classification before it can mint a
                  # nonvisual continuation. No model queue entry is useful for any such port.
                  if [[ "$impact" == skip ]]; then
                    printf 'Ignoring infrastructure-only visual review sync PR %s (%s files)\n' \
                      "$source_pr_number" "$changed_files"
                    exit 0
                  fi
                fi
              fi
            fi
          fi

          # Duplicate workflow_run and repository_dispatch twins for the same source run exit
          # here before the heavier jobs and artifact validation below. Query only the three
          # exact names that can belong to this source and protected generation: repository-wide
          # artifact inventories are both unnecessary and unbounded as release evidence grows.
          report_name="visual-review-$source_run_id"
          input_name="visual-review-input-$source_run_id"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          generation_input_name="$input_name-$GITHUB_SHA"
          for artifact_query_name in \
              "$report_name" "$input_name" "$generation_input_name"; do
            artifacts="$(github_api_retry --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_query_name&per_page=100")"
            jq -e --arg name "$artifact_query_name" \
              '(type == "array") and
               ([.[] | (.artifacts | type == "array")] | all) and
               ([.[].artifacts[]] | length <= 100) and
               ([.[].artifacts[] | .name == $name] | all)' \
              <<< "$artifacts" > /dev/null
            while IFS=$'\t' read -r artifact_name artifact_run_id artifact_expired; do
              [[ -n "$artifact_run_id" ]] || continue
              [[ "$artifact_expired" == false ]] || continue
              expected_workflow=".github/workflows/visual-review.yml"
              expected_events='["repository_dispatch","workflow_run"]'
              expected_conclusions='["success","failure"]'
              if [[ "$artifact_name" == "$report_name" ]]; then
                expected_workflow=".github/workflows/visual-review-drain.yml"
                expected_events='["repository_dispatch","schedule","workflow_dispatch"]'
              else
                [[ "$artifact_name" == "$input_name" \
                  || "$artifact_name" == "$generation_input_name" ]]
              fi
              owner_run="$(github_api_retry \
                "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id" 2>/dev/null || true)"
              if [[ -n "$owner_run" ]] && jq -e \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg workflow "$expected_workflow" \
                  --argjson conclusions "$expected_conclusions" \
                  --argjson events "$expected_events" \
                  '.status == "completed" and
                   (.conclusion as $conclusion | $conclusions | index($conclusion)) != null and
                   (.event as $event | $events | index($event)) != null and
                   .head_branch == "master" and .path == $workflow and
                   .head_repository.full_name == $repository' \
                  <<< "$owner_run" > /dev/null; then
                printf 'Visual review is already queued or complete for source run %s\n' \
                  "$source_run_id"
                exit 0
              fi
            done < <(jq -r --arg name "$artifact_query_name" \
              '.[].artifacts[] | select(.name == $name) |
               [.name, .workflow_run.id, .expired] | @tsv' <<< "$artifacts")
          done

          # List endpoints are read as --paginate --slurp page arrays, the same shape every other
          # trusted workflow consumes, then flattened before any count or identity assertion.
          jobs="$(github_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/jobs?filter=latest&per_page=100")"
          jq -e \
            '(type == "array") and
             ([.[] | (.jobs | type == "array")] | all) and
             ([.[].jobs[]] | length <= 100)' \
            <<< "$jobs" > /dev/null
          jobs="$(jq -c '[.[].jobs[]]' <<< "$jobs")"
          gate_count="$(jq '[.[] | select(
            .name == "Packaged E2E gate" and .status == "completed" and
            .conclusion == "success")] | length' <<< "$jobs")"
          if [[ "$gate_count" -eq 0 ]]; then
            # A lightweight attestation run legitimately has no gate job; its reusable-workflow
            # jobs are prefixed with the caller job name. Anything else without a gate job means
            # the pinned gate name drifted and must fail loudly instead of no-opping forever.
            attestation_count="$(jq '[.[] | select(
              .name | startswith("Attest tested E2E on release branch"))] | length' \
              <<< "$jobs")"
            if [[ "$attestation_count" -eq 0 ]]; then
              printf 'Source run %s has no packaged gate and no attestation job\n' \
                "$source_run_id" >&2
              exit 1
            fi
            printf 'Ignoring lightweight attestation run %s\n' "$source_run_id"
            exit 0
          fi
          [[ "$gate_count" -eq 1 ]]

          # A successful not-applicable port has the same stable gate but deliberately launches no
          # Minecraft jobs. Bind review eligibility to the source run's own unique lane artifacts.
          expected_artifact_names="$(jq -c '[.[] | select(
            (.name | endswith(" - contract scenarios")) and
            .status == "completed" and .conclusion == "success") |
            ("packaged-e2e-" + (.name | sub(" - contract scenarios$"; "")))] |
            sort' <<< "$jobs")"
          scenario_job_count="$(jq length <<< "$expected_artifact_names")"
          source_artifacts="$(github_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100")"
          jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
            <<< "$source_artifacts" > /dev/null
          artifact_inventory="$(jq -c --argjson run_id "$source_run_id" '[
            .[].artifacts[] | select(.name | startswith("packaged-e2e-")) |
            {id,name,size_in_bytes,digest,expired,workflow_run}] | sort_by(.name)' \
            <<< "$source_artifacts")"
          packaged_count="$(jq length <<< "$artifact_inventory")"
          if [[ "$packaged_count" -eq 0 ]]; then
            printf 'Ignoring successful run %s without packaged runtime artifacts\n' \
              "$source_run_id"
            exit 0
          fi
          [[ "$scenario_job_count" -gt 0 ]]
          [[ "$scenario_job_count" -le 8 ]]
          [[ "$packaged_count" -eq "$scenario_job_count" ]]
          [[ "$(jq -c '[.[].name] | sort' <<< "$artifact_inventory")" \
            == "$expected_artifact_names" ]]
          jq -e --argjson run_id "$source_run_id" '
            ([.[].id] | length) == ([.[].id] | unique | length) and
            ([.[].name] | length) == ([.[].name] | unique | length) and
            ([.[] |
              (.id | type == "number" and . > 0) and
              (.name | type == "string" and
                test("^packaged-e2e-[A-Za-z0-9._-]+$")) and
              (.size_in_bytes | type == "number" and . > 0 and . <= 67108864) and
              (.digest | type == "string" and
                test("^sha256:[0-9a-f]{64}$")) and
              (.expired == false) and (.workflow_run.id == $run_id)] | all) and
            ([.[].size_in_bytes] | add // 0) <= 268435456
          ' <<< "$artifact_inventory" > /dev/null

          [[ "$GITHUB_REF" == refs/heads/master ]]
          printf 'artifact_inventory=%s\n' "$artifact_inventory" >> "$GITHUB_OUTPUT"
          printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"

  curate:
    name: Authenticate and curate review input
    needs: authenticate
    if: needs.authenticate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      generation_sha: ${{ steps.evidence.outputs.generation_sha }}

    steps:
      - name: Check out the exact protected curator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python for protected evidence validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked image decoder
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r scripts/pages/requirements.txt

      # This job has no secrets. It reauthenticates the full protected job graph, downloads each
      # immutable artifact by numeric ID, then passes only decoded, content-addressed PNGs onward.
      # Later versions use current authenticated Fabric 1.20.1 Pages evidence; the 1.20.1 source
      # itself is curated without a reference and requires complete Fabric/Forge capture parity.
      - name: Validate and curate exact packaged evidence
        id: evidence
        shell: bash
        env:
          ARTIFACT_INVENTORY: ${{ needs.authenticate.outputs.artifact_inventory }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ needs.authenticate.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.authenticate.outputs.source_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$IMPLEMENTATION_SHA" == "$GITHUB_SHA" ]]
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          jq -e 'type == "array" and length > 0 and length <= 8' \
            <<< "$ARTIFACT_INVENTORY" > /dev/null
          printf 'review_skipped=false\n' >> "$GITHUB_OUTPUT"

          source_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and .status == "completed" and
             .conclusion == "success" and .head_sha == $sha and
             (.event == "pull_request" or .event == "schedule" or
              .event == "workflow_dispatch") and
             .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$source_run" > /dev/null

          # Import the authenticated source commit as inert Git objects only. Never check out or
          # execute source-head files in this privileged default-branch workflow.
          git fetch --no-tags origin "$SOURCE_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          source_matrix="$RUNNER_TEMP/source-release-matrix.json"
          source_properties="$RUNNER_TEMP/source-gradle.properties"
          source_contract="$RUNNER_TEMP/source-scenario-contract.json"
          git show "$SOURCE_SHA:release/release-matrix.json" > "$source_matrix"
          git show "$SOURCE_SHA:gradle.properties" > "$source_properties"
          git show "$SOURCE_SHA:e2e/scenario-contract.json" > "$source_contract"

          # Protected master code validates review evidence produced from the authenticated source
          # commit. Contract skew would make step parity ambiguous, so it skips advisory review.
          master_contract_sha256="$(sha256sum e2e/scenario-contract.json | cut -d ' ' -f 1)"
          source_contract_sha256="$(sha256sum "$source_contract" | cut -d ' ' -f 1)"
          if [[ "$master_contract_sha256" != "$source_contract_sha256" ]]; then
            printf 'review_skipped=true\n' >> "$GITHUB_OUTPUT"
            printf 'scenario-contract skew between master and source head; skipping advisory review\n' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          matrix_kind=pr-anchors
          if [[ "$(jq -r .event <<< "$source_run")" == schedule ]]; then
            matrix_kind=native-anchors
          fi
          controller_skew_arguments=()
          if [[ "$(jq -r .event <<< "$source_run")" == pull_request ]]; then
            controller_skew_arguments+=(--allow-advisory-controller-skew)
          fi

          jobs="$RUNNER_TEMP/source-jobs.json"
          github_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$jobs"
          jq -e \
            '(type == "array") and
             ([.[] | (.jobs | type == "array")] | all) and
             ([.[].jobs[]] | length > 0 and length <= 100)' \
            "$jobs" > /dev/null

          job_graph_status=0
          python3 scripts/ci/e2e_job_graph.py \
            --matrix "$source_matrix" \
            --matrix-properties "$source_properties" \
            --jobs "$jobs" \
            --repository . \
            --repository-head-sha "$IMPLEMENTATION_SHA" \
            --protected-sha "$IMPLEMENTATION_SHA" \
            --head-sha "$SOURCE_SHA" \
            --bootstrap-contract e2e/loader-bootstrap-contract.json \
            --matrix-kind "$matrix_kind" \
            --runtime-policy full \
            "${controller_skew_arguments[@]}" \
            > "$RUNNER_TEMP/e2e-job-graph.json" || job_graph_status=$?
          if [[ "$job_graph_status" -eq 78 ]]; then
            printf 'review_skipped=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'Automation-only E2E controller skew; deferring visual validation to the protected post-merge generation' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$job_graph_status" -eq 0 ]]
          python3 scripts/release/matrix.py \
            --matrix "$source_matrix" \
            --matrix-properties "$source_properties" \
            --kind "$matrix_kind" \
            > "$RUNNER_TEMP/expected-e2e-matrix.json"
          expected_artifacts="$(jq -c \
            '[.include[].id | "packaged-e2e-" + .] | sort' \
            "$RUNNER_TEMP/expected-e2e-matrix.json")"
          [[ "$expected_artifacts" == \
            "$(jq -c '[.[].name] | sort' <<< "$ARTIFACT_INVENTORY")" ]]

          # Resolve the reference only after the candidate run, source commit, controller parity,
          # job graph, and artifact inventory have all been authenticated by protected code.
          # A shared contract rollout can update master a few minutes before the 1.20.1 release
          # head and its lossless handoff rotate. Wait through that bounded, authenticated window
          # instead of losing an otherwise valid review request to the old reference generation.
          reference_identity="$(python3 e2e/visual_review.py \
            --matrix release/release-matrix.json \
            --reference-identity)"
          REFERENCE_BRANCH="$(jq -er .release_branch <<< "$reference_identity")"
          REFERENCE_ARTIFACT_NODE="$(jq -er .artifact_node <<< "$reference_identity")"
          REFERENCE_VERSION="$(jq -er .version <<< "$reference_identity")"
          REFERENCE_LOADER="$(jq -er .loader <<< "$reference_identity")"
          source_branch="$(jq -er .head_branch <<< "$source_run")"
          source_release_branch="$(jq -er .project.release_branch "$source_matrix")"
          review_mode=reference-comparison
          master_source_sha=''
          # Every controller-owned version port is a two-parent merge whose second parent is the
          # exact master generation being propagated. Preserve that identity for the whole wave,
          # not only for its 1.20.1 anchor, so a confirmed later-version defect can stop sibling
          # reviews without affecting an unrelated generation or advisory PR.
          if [[ "$(jq -r .event <<< "$source_run")" == workflow_dispatch \
              && "$source_branch" == automation/sync/* ]]; then
            read -r -a source_commit <<< "$(git rev-list --parents -n 1 "$SOURCE_SHA")"
            if [[ "${#source_commit[@]}" -eq 3 ]] \
                && git merge-base --is-ancestor \
                  "${source_commit[2]}" "$IMPLEMENTATION_SHA"; then
              master_source_sha="${source_commit[2]}"
            fi
          fi
          if jq -e \
              --arg reference_version "$REFERENCE_VERSION" \
              '(.include | length == 2) and
               ([.include[].runtime_version] | unique) == [$reference_version] and
               ([.include[].loader] | sort) == ["fabric", "forge"]' \
              "$RUNNER_TEMP/expected-e2e-matrix.json" > /dev/null; then
            [[ "$source_release_branch" == "$REFERENCE_BRANCH" ]]
            review_mode=anchor-semantic
          fi
          printf 'review_mode=%s\n' "$review_mode" >> "$GITHUB_OUTPUT"
          generation_sha="$IMPLEMENTATION_SHA"
          if [[ -n "$master_source_sha" ]]; then
            generation_sha="$master_source_sha"
          fi
          [[ "$generation_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'generation_sha=%s\n' "$generation_sha" >> "$GITHUB_OUTPUT"
          if [[ "$generation_sha" != "$IMPLEMENTATION_SHA" ]]; then
            printf 'review_skipped=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'superseded visual-review generation; skipping curation before any image decode or model wake' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$review_mode" == reference-comparison ]]; then
          reference_output="$(mktemp "$RUNNER_TEMP/reference-selection.XXXXXX")"
          reference_contract="$(mktemp "$RUNNER_TEMP/reference-contract.XXXXXX.json")"
          reference_error="$(mktemp "$RUNNER_TEMP/reference-selection.XXXXXX.err")"
          reference_ready=false
          reference_state=''
          for attempt in {1..90}; do
            : > "$reference_output"
            : > "$reference_error"
            next_state=evidence-pending
            next_message='authenticated current-head reference evidence is not ready'
            if python3 scripts/pages/select_artifact.py \
                --repository "$GITHUB_REPOSITORY" \
                --branch "$REFERENCE_BRANCH" \
                --require-raw \
                --github-output "$reference_output" 2> "$reference_error"; then
              [[ "$(wc -l < "$reference_output" | tr -d ' ')" == 5 ]]
              candidate_reference_sha="$(sed -n 's/^sha=//p' "$reference_output")"
              [[ "$candidate_reference_sha" =~ ^[0-9a-f]{40}$ ]]
              if ! git cat-file -e "${candidate_reference_sha}^{commit}" 2> /dev/null; then
                git fetch --no-tags origin "$candidate_reference_sha"
                [[ "$(git rev-parse FETCH_HEAD)" == "$candidate_reference_sha" ]]
              fi
              git show "${candidate_reference_sha}:e2e/scenario-contract.json" \
                > "$reference_contract"
              reference_contract_sha256="$(sha256sum "$reference_contract" | cut -d ' ' -f 1)"
              if [[ "$reference_contract_sha256" == "$master_contract_sha256" ]]; then
                reference_ready=true
                break
              fi
              next_state="contract:$reference_contract_sha256"
              next_message='reference branch still carries the previous scenario contract'
            elif [[ -s "$reference_error" ]]; then
              next_message="$(tail -n 1 "$reference_error")"
            fi
            if [[ "$next_state" != "$reference_state" ]]; then
              printf 'Visual reference pending (%s/90): %s\n' "$attempt" "$next_message"
              reference_state="$next_state"
            fi
            if (( attempt < 90 )); then
              sleep 5
            fi
          done
          if [[ "$reference_ready" != true ]]; then
            cat "$reference_error" >&2
            printf 'visual reference did not reach protected scenario-contract parity in time\n' \
              >&2
            exit 1
          fi
          [[ "$(wc -l < "$reference_output" | tr -d ' ')" == 5 ]]
          REFERENCE_ARTIFACT_ID="$(sed -n 's/^artifact_id=//p' "$reference_output")"
          REFERENCE_ARTIFACT_NAME="$(sed -n 's/^name=//p' "$reference_output")"
          REFERENCE_ARTIFACT_RUN_ID="$(sed -n 's/^run_id=//p' "$reference_output")"
          REFERENCE_SHA="$(sed -n 's/^sha=//p' "$reference_output")"
          REFERENCE_ARTIFACT_SIZE="$(sed -n 's/^size_in_bytes=//p' "$reference_output")"
          rm -f -- "$reference_output" "$reference_contract" "$reference_error"

          [[ "$REFERENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REFERENCE_ARTIFACT_NAME" =~ ^pages-e2e-[A-Za-z0-9._/-]+$ ]]
          [[ "$REFERENCE_ARTIFACT_NODE" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$REFERENCE_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REFERENCE_ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( REFERENCE_ARTIFACT_SIZE <= 536870912 ))
          [[ "$REFERENCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$REFERENCE_LOADER" == fabric ]]
          [[ "$REFERENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REFERENCE_VERSION" == 1.20.1 ]]
          [[ "$REFERENCE_ARTIFACT_NAME" == "pages-e2e-$REFERENCE_BRANCH" ]]

          # Reauthenticate and normalize the exact current-head 1.20.1 Pages artifact. The
          # selector already validated its owner workflow; the numeric-ID fetch below binds the
          # bytes used by this run to that selection and to its immutable artifact digest.
          reference_metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REFERENCE_ARTIFACT_ID")"
          reference_artifact_digest="$(jq -er .digest <<< "$reference_metadata")"
          [[ "$reference_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e \
            --arg digest "$reference_artifact_digest" \
            --arg name "$REFERENCE_ARTIFACT_NAME" \
            --argjson artifact_id "$REFERENCE_ARTIFACT_ID" \
            --argjson run_id "$REFERENCE_ARTIFACT_RUN_ID" \
            --argjson size "$REFERENCE_ARTIFACT_SIZE" \
            '.id == $artifact_id and .name == $name and .size_in_bytes == $size and
             .digest == $digest and .expired == false and
             .workflow_run.id == $run_id' \
            <<< "$reference_metadata" > /dev/null
          reference_archive="$RUNNER_TEMP/reference-artifact-$REFERENCE_ARTIFACT_ID.zip"
          github_api_retry_to_file "$reference_archive" \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REFERENCE_ARTIFACT_ID/zip" \
            > /dev/null
          [[ "$(stat -c %s "$reference_archive")" == "$REFERENCE_ARTIFACT_SIZE" ]]
          [[ "sha256:$(sha256sum "$reference_archive" | cut -d ' ' -f 1)" \
            == "$reference_artifact_digest" ]]
          reference_selected="$RUNNER_TEMP/reference-selected"
          python3 scripts/ci/bounded_zip.py \
            "$reference_archive" "$reference_selected" \
            --max-archive-bytes 536870912 \
            --max-entries 512 \
            --max-total-bytes 536870912 \
            --max-file-bytes 33554432 \
            --max-compression-ratio 200 \
            > "$RUNNER_TEMP/reference-extraction.json"
          rm -f -- "$reference_archive"

          python3 scripts/pages/evidence.py validate \
            --evidence-root "$reference_selected" \
            --branch "$REFERENCE_BRANCH" \
            --only-branch \
            --kind raw \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$REFERENCE_SHA" \
            --target-run-id "$REFERENCE_ARTIFACT_RUN_ID"
          reference_manifest="$reference_selected/$REFERENCE_BRANCH/manifest.json"
          reference_manifest_sha256="$(sha256sum "$reference_manifest" | cut -d ' ' -f 1)"
          reference_source_run_id="$(jq -er .provenance.source.run_id "$reference_manifest")"
          reference_source_branch="$(jq -er .provenance.source.branch "$reference_manifest")"
          reference_source_sha="$(jq -er .provenance.source.sha "$reference_manifest")"
          reference_source_created_at="$(jq -er \
            .provenance.source.created_at "$reference_manifest")"
          reference_target_run_id="$(jq -er .provenance.target.run_id "$reference_manifest")"
          reference_target_created_at="$(jq -er \
            .provenance.target.created_at "$reference_manifest")"
          reference_source_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$reference_source_run_id")"
          reference_target_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$reference_target_run_id")"
          jq -e \
            --arg branch "$reference_source_branch" \
            --arg created "$reference_source_created_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$reference_source_sha" \
            '.status == "completed" and .conclusion == "success" and
             .event == "workflow_dispatch" and .head_branch == $branch and
             .head_sha == $sha and .created_at == $created and
             .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$reference_source_run" > /dev/null
          jq -e \
            --arg branch "$REFERENCE_BRANCH" \
            --arg created "$reference_target_created_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$REFERENCE_SHA" \
            '.status == "completed" and .conclusion == "success" and
             .event == "workflow_dispatch" and .head_branch == $branch and
             .head_sha == $sha and .created_at == $created and
             .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$reference_target_run" > /dev/null
          [[ "$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/$REFERENCE_BRANCH" \
            --jq .commit.sha)" == "$REFERENCE_SHA" ]]
          else
            REFERENCE_ARTIFACT_ID=0
            REFERENCE_ARTIFACT_NAME=''
            REFERENCE_ARTIFACT_RUN_ID=0
            REFERENCE_ARTIFACT_SIZE=0
            REFERENCE_SHA=''
            reference_artifact_digest=''
            reference_manifest_sha256=''
          fi

          raw_root="$RUNNER_TEMP/raw-review-evidence"
          mkdir -p "$raw_root/artifacts" "$raw_root/e2e-out/profiles"
          extracted_bytes=0
          extracted_entries=0
          declare -A profile_names=()
          while IFS=$'\t' read -r artifact_id artifact_name declared_size artifact_digest; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_name" =~ ^packaged-e2e-[A-Za-z0-9._-]+$ ]]
            [[ "$declared_size" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            metadata="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            jq -e \
              --arg digest "$artifact_digest" \
              --arg name "$artifact_name" \
              --argjson id "$artifact_id" \
              --argjson run_id "$SOURCE_RUN_ID" \
              --argjson size "$declared_size" \
              '.id == $id and .name == $name and .size_in_bytes == $size and
               .digest == $digest and .expired == false and
               .workflow_run.id == $run_id' \
              <<< "$metadata" > /dev/null

            archive="$RUNNER_TEMP/source-artifact-$artifact_id.zip"
            github_api_retry_to_file "$archive" \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > /dev/null
            [[ "$(stat -c %s "$archive")" == "$declared_size" ]]
            [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" \
              == "$artifact_digest" ]]

            remaining_bytes=$((536870912 - extracted_bytes))
            remaining_entries=$((512 - extracted_entries))
            (( remaining_bytes > 0 ))
            (( remaining_entries > 0 ))
            extracted="$raw_root/artifacts/$artifact_name"
            summary="$(python3 scripts/ci/bounded_zip.py \
              "$archive" "$extracted" \
              --max-archive-bytes 67108864 \
              --max-entries "$remaining_entries" \
              --max-total-bytes "$remaining_bytes" \
              --max-file-bytes 67108864 \
              --max-compression-ratio 200)"
            rm -f -- "$archive"
            extracted_bytes=$((extracted_bytes + $(jq -r .bytes <<< "$summary")))
            extracted_entries=$((extracted_entries + $(jq -r .entries <<< "$summary")))
            (( extracted_bytes <= 536870912 ))
            (( extracted_entries <= 512 ))

            mapfile -d '' top_level < <(
              find "$extracted" -mindepth 1 -maxdepth 1 -print0
            )
            [[ "${#top_level[@]}" -eq 4 ]]
            for required_file in summary.json resolved-matrix.json runtime-store.json; do
              [[ -f "$extracted/$required_file" && ! -L "$extracted/$required_file" ]]
            done
            [[ -d "$extracted/profiles" && ! -L "$extracted/profiles" ]]
            row_id="${artifact_name#packaged-e2e-}"
            row_json="$(jq -ce --arg id "$row_id" \
              '[.include[] | select(.id == $id)] |
               if length == 1 then .[0] else error("matrix row identity mismatch") end' \
              "$RUNNER_TEMP/expected-e2e-matrix.json")"
            python3 e2e/visual_review.py \
              --e2e-root "$extracted" \
              --validate-row-json "$row_json" \
              > "$RUNNER_TEMP/evidence-scope-$artifact_id.json"
            mapfile -d '' profiles < <(
              find "$extracted/profiles" -mindepth 1 -maxdepth 1 -print0
            )
            [[ "${#profiles[@]}" -gt 0 ]]
            for profile in "${profiles[@]}"; do
              [[ -d "$profile" && ! -L "$profile" ]]
              profile_name="$(basename "$profile")"
              [[ "$profile_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
              profile_key="${profile_name,,}"
              [[ -z "${profile_names[$profile_key]:-}" ]]
              profile_names[$profile_key]=1
              mv -- "$profile" "$raw_root/e2e-out/profiles/$profile_name"
            done
          done < <(
            jq -r 'sort_by(.id)[] |
              [.id, .name, .size_in_bytes, .digest] | @tsv' \
              <<< "$ARTIFACT_INVENTORY"
          )

          review_arguments=(
            --all
            --e2e-root "$raw_root/e2e-out"
            --curate-output "$RUNNER_TEMP/review-input"
          )
          if [[ "$review_mode" == anchor-semantic ]]; then
            review_arguments+=(--semantic-anchor)
          else
            review_arguments+=(
              --reference-evidence-root "$reference_selected"
              --reference-branch "$REFERENCE_BRANCH"
              --reference-artifact-node "$REFERENCE_ARTIFACT_NODE"
            )
          fi
          python3 e2e/visual_review.py "${review_arguments[@]}" \
            > "$RUNNER_TEMP/manifest.stdout.json"
          cmp --silent \
            "$RUNNER_TEMP/manifest.stdout.json" \
            "$RUNNER_TEMP/review-input/visual-review-manifest.json"
          validation_arguments=(
            --validate-input-only
            --manifest "$RUNNER_TEMP/review-input/visual-review-manifest.json"
            --input-root "$RUNNER_TEMP/review-input"
          )
          if [[ "$review_mode" == reference-comparison ]]; then
            validation_arguments+=(--require-paired)
          fi
          python3 e2e/check_visual_review.py "${validation_arguments[@]}"

          manifest_sha256="$(sha256sum \
            "$RUNNER_TEMP/review-input/visual-review-manifest.json" | cut -d ' ' -f 1)"
          image_count="$(find "$RUNNER_TEMP/review-input/images" \
            -mindepth 1 -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          image_bytes="$(find "$RUNNER_TEMP/review-input/images" \
            -mindepth 1 -maxdepth 1 -type f -name '*.png' \
            -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          frame_count="$(jq length \
            "$RUNNER_TEMP/review-input/visual-review-manifest.json")"
          visual_reference=null
          if [[ "$review_mode" == reference-comparison ]]; then
            visual_reference="$(jq -n \
              --arg artifact_digest "$reference_artifact_digest" \
              --arg artifact_name "$REFERENCE_ARTIFACT_NAME" \
              --arg artifact_node "$REFERENCE_ARTIFACT_NODE" \
              --arg branch "$REFERENCE_BRANCH" \
              --arg loader "$REFERENCE_LOADER" \
              --arg manifest_sha256 "$reference_manifest_sha256" \
              --arg sha "$REFERENCE_SHA" \
              --arg version "$REFERENCE_VERSION" \
              --argjson artifact_id "$REFERENCE_ARTIFACT_ID" \
              --argjson artifact_run_id "$REFERENCE_ARTIFACT_RUN_ID" \
              --argjson artifact_size "$REFERENCE_ARTIFACT_SIZE" \
              '{artifact_id:$artifact_id, artifact_name:$artifact_name,
                artifact_run_id:$artifact_run_id,
                artifact_size_in_bytes:$artifact_size,
                artifact_digest:$artifact_digest, branch:$branch, sha:$sha,
                artifact_node:$artifact_node, version:$version, loader:$loader,
                evidence_kind:"raw-png", manifest_sha256:$manifest_sha256}')"
          fi
          jq -n \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg master_source_sha "$master_source_sha" \
            --arg matrix_kind "$matrix_kind" \
            --arg review_mode "$review_mode" \
            --arg scenario_contract_sha256 \
              "$(sha256sum e2e/scenario-contract.json | cut -d ' ' -f 1)" \
            --arg source_branch "$source_branch" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson artifact_inventory "$ARTIFACT_INVENTORY" \
            --argjson frame_count "$frame_count" \
            --argjson image_bytes "$image_bytes" \
            --argjson image_count "$image_count" \
            --argjson job_graph "$(cat "$RUNNER_TEMP/e2e-job-graph.json")" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --argjson visual_reference "$visual_reference" \
            '{schema_version:4, source_run_id:$source_run_id,
              source_branch:$source_branch, source_sha:$source_sha,
              master_source_sha:($master_source_sha |
                if length == 40 then . else null end),
              implementation_sha:$implementation_sha, matrix_kind:$matrix_kind,
              review_mode:$review_mode,
              scenario_contract_sha256:$scenario_contract_sha256,
              artifact_inventory:$artifact_inventory, job_graph:$job_graph,
              visual_reference:$visual_reference,
              manifest_sha256:$manifest_sha256, frame_count:$frame_count,
              image_count:$image_count, image_bytes:$image_bytes}' \
            > "$RUNNER_TEMP/curation-proof.json"

      - name: Name the source-bound curated handoff
        id: identity
        if: steps.evidence.outputs.review_skipped == 'false'
        shell: bash
        env:
          GENERATION_SHA: ${{ steps.evidence.outputs.generation_sha }}
          SOURCE_RUN_ID: ${{ needs.authenticate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          printf 'artifact_name=visual-review-input-%s-%s\n' \
            "$SOURCE_RUN_ID" "$GENERATION_SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Upload only the curated review input
        id: handoff
        if: steps.evidence.outputs.review_skipped == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/review-input/
            ${{ runner.temp }}/curation-proof.json
          if-no-files-found: error
          compression-level: 6
          # This is a durable bounded queue entry. A successful drainer deletes it by exact ID;
          # expiry is the recovery bound if the advisory provider remains unavailable.
          retention-days: 7

  request-drain:
    name: Wake the durable visual-review queue
    needs:
      - authenticate
      - curate
    if: >-
      needs.authenticate.outputs.eligible == 'true' &&
      needs.curate.result == 'success' &&
      needs.curate.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Request one protected queue drain
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.curate.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.curate.outputs.artifact_name }}
          GENERATION_SHA: ${{ needs.curate.outputs.generation_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_NAME" =~ ^visual-review-input-[1-9][0-9]*-$GENERATION_SHA$ ]]
          payload="$RUNNER_TEMP/visual-review-drain-request.json"
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg generation_sha "$GENERATION_SHA" \
            '{event_type:"visual-review-drain-requested",
              client_payload:{artifact_id:$artifact_id,artifact_name:$artifact_name,
                generation_sha:$generation_sha}}' \
            > "$payload"
          dispatch_error="$RUNNER_TEMP/visual-review-drain-request.error"
          for attempt in 1 2 3; do
            : > "$dispatch_error"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
                --input "$payload" 2> "$dispatch_error"; then
              exit 0
            fi
            if grep -Fq 'API rate limit exceeded' "$dispatch_error"; then
              # The source-bound capsule is already durable. The scheduled sweep will recover
              # this wake after quota returns, so another primary request cannot improve safety.
              echo "::warning::GitHub API quota exhausted; durable visual-review wake deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$dispatch_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$dispatch_error" >&2
            exit 1
          done
