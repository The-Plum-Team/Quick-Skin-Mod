name: Build gate

# The fast lane: everything that can be checked without launching Minecraft. It runs on every
# pull request plus direct pushes to protected/release branches so a broken compile, a bad matrix,
# or a build that dirties tracked sources is caught immediately without building an in-repository
# feature commit twice. Automation branches dispatch this workflow explicitly.
#
# Packaged E2E remains a separate workflow so version branches can run both gates independently.
on:
  pull_request:
  push:
    branches:
      - master
      - "fabric-and-neoforge-*"
      - "forge-and-fabric-*"
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs the full build
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: build-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and verify
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < gradle/wrapper/gradle-9.6.1-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Install all required JDKs
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked Pages image dependency
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      - name: Select the bounded Gradle cache mode
        id: gradle-cache
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          read_only="$(python3 scripts/ci/gradle_cache_policy.py \
            --matrix release/release-matrix.json \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --ref-type "$REF_TYPE" \
            --ref-protected "$REF_PROTECTED")"
          [[ "$read_only" == true || "$read_only" == false ]]
          printf 'read_only=%s\n' "$read_only" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ steps.gradle-cache.outputs.read_only }}
          cache-cleanup: on-success

      - name: Validate central matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Validate branch-specific README profile
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            profile_branch="$BASE_REF"
          elif [[ "$REF_NAME" == master || "$REF_NAME" == automation/refresh-release-status ]]; then
            profile_branch=master
          elif python3 scripts/release/version_branches.py \
              --target "$REF_NAME" > /dev/null 2>&1; then
            profile_branch="$REF_NAME"
          elif [[ "$REF_NAME" == automation/sync/* ]]; then
            profile_branch="${REF_NAME#automation/sync/}"
            profile_branch="${profile_branch%%/*}"
            python3 scripts/release/version_branches.py \
              --target "$profile_branch" > /dev/null
          elif python3 scripts/release/branch_readme.py \
              --matrix release/release-matrix.json \
              --readme README.md \
              --profile-branch master \
              --check 2> /dev/null; then
            profile_branch=master
          else
            profile_branch="$(jq -er '.project.release_branch' \
              release/release-matrix.json)"
          fi
          python3 scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$profile_branch" \
            --check
          python3 scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$profile_branch" \
            --check

      - name: Validate release tooling and repository policy
        run: |
          python -m compileall -q e2e scripts
          node --check site/assets/site.js
          node --check site/assets/gallery.js
          python -m unittest discover -s scripts/release/tests -p 'test_*.py' -v
          python -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

      - name: Build all production artifacts and E2E harnesses
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify all production artifacts
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      # A concurrently dispatched Packaged E2E run for this exact head may reuse these
      # verified bytes instead of repeating the identical Gradle build. Consumers
      # authenticate the owning run and reverify the staged manifest before trusting them.
      - name: Upload the staged release bundle for exact-head reuse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-bundle
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Assert the build did not mutate tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-gate-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/*.log
            **/run/logs/
          if-no-files-found: ignore
          retention-days: 1

  attest:
    name: Attest tested build on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: build-gate.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  notify-version-port:
    name: Notify version port controller
    needs: build
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the settled build result
        shell: bash
        env:
          GATE_RESULT: ${{ needs.build.result }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          conclusion=success
          if [[ "$GATE_RESULT" != success ]]; then
            conclusion=failure
          fi
          payload="$RUNNER_TEMP/version-port-build-result.json"
          jq -n \
            --arg gate build-gate.yml \
            --arg conclusion "$conclusion" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,source_event:$source_event,source_repository:$source_repository}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
