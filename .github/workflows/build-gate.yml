name: Build gate

# Compile each matrix target on an isolated runner while repository-policy checks run alongside.
# The stable required gate reverifies the complete bundle, which Packaged E2E consumes unchanged.
# Historical automation branches may still dispatch both gates independently.
# A draft PR to master defers all of this to its ready head or to a batch PR (ADR 0009).
on:
  pull_request:
    # Converting a PR to draft starts a deferred run that cancels its in-progress gate.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - master
      - "fabric-and-neoforge-*"
      - "forge-and-fabric-*"
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs the full build
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: build-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  source:
    name: Resolve tested build reuse
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.attest_run_id == '') &&
      !(github.event.pull_request.draft && github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reused: ${{ steps.source.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse the merged PR only when the complete tested generation is available
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci_reuse.py resolve --kind build --output reuse/reused-source.json
      - name: Preserve original build provenance without copying its binaries
        if: steps.source.outputs.reused == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reused-source-build
          path: reuse/reused-source.json
          if-no-files-found: error
          retention-days: 90

  compile:
    needs: source
    if: >-
      needs.source.result == 'success' && needs.source.outputs.reused == 'false'
    uses: ./.github/workflows/build-matrix.yml
    with:
      cache-writer: true

  policy:
    name: Validate repository policy
    needs: source
    if: >-
      needs.source.result == 'success' && needs.source.outputs.reused == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify the pinned mod-base kit tree
        uses: The-Plum-Team/mod-base/actions/setup@1401a34dd19be17b2c42b4f494c0b43380919eac # v1.0.2
        with:
          install-imaging: "false"

      - name: Validate central matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Validate branch-specific README profile
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            profile_branch="$BASE_REF"
          elif [[ "$REF_NAME" == master || "$REF_NAME" == automation/refresh-release-status ]]; then
            profile_branch=master
          elif python3 scripts/release/version_branches.py \
              --target "$REF_NAME" > /dev/null 2>&1; then
            profile_branch="$REF_NAME"
          elif [[ "$REF_NAME" == automation/sync/* ]]; then
            profile_branch="${REF_NAME#automation/sync/}"
            profile_branch="${profile_branch%%/*}"
            python3 scripts/release/version_branches.py \
              --target "$profile_branch" > /dev/null
          elif python3 scripts/release/branch_readme.py \
              --matrix release/release-matrix.json \
              --readme README.md \
              --profile-branch master \
              --check 2> /dev/null; then
            profile_branch=master
          else
            profile_branch="$(jq -er '.project.release_branch' \
              release/release-matrix.json)"
          fi
          python3 scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$profile_branch" \
            --check
          python3 scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$profile_branch" \
            --check

      # PR code, like every policy test: the pin must be a released mod-base commit reachable
      # from its protected main (impostor defense), and every managed file must equal the kit.
      # Only the network verification receives the read-only token.
      - name: Verify the pinned mod-base kit and managed files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/mod_base_kit.py verify --network
          env -u GH_TOKEN python3 scripts/ci/mod_base_kit.py run template check --repo .

      - name: Validate Python syntax
        run: python -m compileall -q e2e scripts

      - name: Upload build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-gate-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/*.log
            **/run/logs/
          if-no-files-found: ignore
          retention-days: 1

  policy-release:
    name: Validate release policy
    needs: source
    if: >-
      needs.source.result == 'success' && needs.source.outputs.reused == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The kit tree is verified against this checkout's pin and exported to the mod tests.
      - name: Verify the pinned mod-base kit tree
        uses: The-Plum-Team/mod-base/actions/setup@1401a34dd19be17b2c42b4f494c0b43380919eac # v1.0.2
      - name: Install hash-locked Pages image dependency
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt
      - name: Record discovered release test inventory
        run: |
          python - <<'PY'
          import os
          import unittest
          from pathlib import Path
          loader = unittest.TestLoader()
          count = loader.discover('scripts/release/tests', pattern='test_*.py').countTestCases()
          assert count > 0 and not loader.errors, loader.errors
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f"Release policy: {count} discovered tests at {os.environ['GITHUB_SHA']}.\n")
          print(f"Discovered {count} release policy tests.")
          PY
      - name: Run the complete release policy suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/parallel_unittest.py -s scripts/release/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/release-policy-tests.log"
      - name: Retain release policy results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-policy-diagnostics
          path: |
            ${{ runner.temp }}/release-policy-tests.log
            **/build/reports/
            **/build/test-results/
            **/build/*.log
            **/run/logs/
          if-no-files-found: ignore
          retention-days: 1

  policy-ci:
    name: Validate CI policy
    needs: source
    if: >-
      needs.source.result == 'success' && needs.source.outputs.reused == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The kit tree is verified against this checkout's pin and exported to the mod tests.
      - name: Verify the pinned mod-base kit tree
        uses: The-Plum-Team/mod-base/actions/setup@1401a34dd19be17b2c42b4f494c0b43380919eac # v1.0.2
      - name: Install hash-locked Pages image dependency
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt
      - name: Record discovered CI test inventory
        run: |
          python - <<'PY'
          import os
          import unittest
          from pathlib import Path
          loader = unittest.TestLoader()
          count = loader.discover('scripts/ci/tests', pattern='test_*.py').countTestCases()
          assert count > 0 and not loader.errors, loader.errors
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f"CI policy: {count} discovered tests at {os.environ['GITHUB_SHA']}.\n")
          print(f"Discovered {count} CI policy tests.")
          PY
      - name: Run the complete CI policy suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/parallel_unittest.py -s scripts/ci/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ci-policy-tests.log"
      - name: Retain CI policy results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-policy-diagnostics
          path: |
            ${{ runner.temp }}/ci-policy-tests.log
            **/build/reports/
            **/build/test-results/
            **/build/*.log
            **/run/logs/
          if-no-files-found: ignore
          retention-days: 1

  build:
    # A draft must never report the required context: a skipped or deferred "Build and verify"
    # would still satisfy the ruleset after the same head is marked ready, before it builds.
    name: ${{ github.event.pull_request.draft && github.event.pull_request.base.ref == 'master' && 'Build deferred for draft' || 'Build and verify' }}
    needs: [source, compile, policy, policy-release, policy-ci]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.attest_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DRAFT_DEFERRED: ${{ github.event.pull_request.draft && github.event.pull_request.base.ref == 'master' }}
    steps:
      - name: Require the complete compilation and policy jobs
        shell: bash
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          RELEASE_POLICY_RESULT: ${{ needs.policy-release.result }}
          CI_POLICY_RESULT: ${{ needs.policy-ci.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          REUSED: ${{ needs.source.outputs.reused }}
        run: |
          set -euo pipefail
          if [[ "${DRAFT_DEFERRED:-false}" == true ]]; then
            [[ "$SOURCE_RESULT" == skipped ]] || exit 1
            printf 'Draft PR: Build is deferred until the PR is ready or included in a batch PR.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$SOURCE_RESULT" == success ]] || exit 1
          if [[ "$REUSED" == true ]]; then
            expected=skipped
          else
            [[ "$REUSED" == false ]] || exit 1
            expected=success
          fi
          for result in "$COMPILE_RESULT" "$POLICY_RESULT" "$RELEASE_POLICY_RESULT" "$CI_POLICY_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
      - name: Check out source
        if: env.DRAFT_DEFERRED != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        if: env.DRAFT_DEFERRED != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the exact original-build reference
        if: needs.source.outputs.reused == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reused-source-build
          path: reuse
      - name: Reauthenticate the original passing gate and identical tree
        if: needs.source.outputs.reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/ci_reuse.py verify --kind build --reference reuse/reused-source.json

      - name: Download the complete bundle from this execution
        if: needs.source.outputs.reused == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-matrix-bundle
          path: build/release
      - name: Reverify all staged production artifacts and harnesses
        if: needs.source.outputs.reused == 'false'
        run: python scripts/release/verify_release.py --verify-staged

      - name: Upload the staged release bundle for exact-head reuse
        if: needs.source.outputs.reused == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-bundle
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # A deferred draft built nothing, so it must never seal a record that reuse could admit.
      - name: Record the actual PR commit that passed Build
        if: github.event_name == 'pull_request' && env.DRAFT_DEFERRED != 'true'
        run: python scripts/ci/ci_reuse.py seal --kind build --output tested-source/tested-source.json
      - name: Retain the immutable tested-build record
        if: github.event_name == 'pull_request' && env.DRAFT_DEFERRED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-source-build
          path: tested-source/tested-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Assert the build did not mutate tracked sources
        if: env.DRAFT_DEFERRED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  request-shared-e2e:
    name: Request packaged E2E for shared source
    needs: build
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact successful source inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request one current shared-source runtime generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/master ||
                "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            printf 'Shared runtime dispatch requires the exact successful master push.\n' >&2
            exit 1
          fi
          mode="$(python3 scripts/release/release_sources.py --kind mode)"
          if [[ "$mode" != shared ]]; then
            printf 'Historical source layout retains its existing runtime scheduler.\n'
            exit 0
          fi
          source scripts/ci/github_api_retry.sh
          current_sha="$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            printf 'A newer source commit owns the next runtime generation.\n'
            exit 0
          fi
          runs="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/workflows/on-demand-e2e.yml/runs?event=workflow_dispatch&branch=master&head_sha=$GITHUB_SHA&per_page=100")"
          existing="$(jq -er --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            'select(.total_count | type == "number" and . >= 0 and . <= 100) |
              select(.total_count == (.workflow_runs | length)) |
              .workflow_runs | select(type == "array" and length <= 100) |
              [.[] | select(.head_sha == $sha and .head_branch == "master" and
                .head_repository.full_name == $repository and
                .path == ".github/workflows/on-demand-e2e.yml" and .event == "workflow_dispatch" and
                ((.status == "completed" and .conclusion == "success") or
                 (.status as $status | ["queued","in_progress","requested","waiting","pending"] |
                   index($status)) != null))] |
              length' <<< "$runs")"
          if [[ "$existing" != 0 ]]; then
            printf 'This exact source already has an active or successful runtime generation.\n'
            exit 0
          fi
          current_sha="$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            printf 'Shared source advanced before dispatch; its newer Build owns the request.\n'
            exit 0
          fi
          gh workflow run on-demand-e2e.yml --ref master

  attest:
    name: Attest tested build on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: build-gate.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  notify-version-port:
    name: Notify version port controller
    needs: build
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Dispatch the settled build result
        shell: bash
        env:
          GATE_RESULT: ${{ needs.build.result }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          conclusion=success
          if [[ "$GATE_RESULT" != success ]]; then
            conclusion=failure
          fi
          payload="$RUNNER_TEMP/version-port-build-result.json"
          jq -n \
            --arg gate build-gate.yml \
            --arg conclusion "$conclusion" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,source_event:$source_event,source_repository:$source_repository}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
