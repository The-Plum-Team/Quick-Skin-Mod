name: AI visual review drain

# Curators enqueue immutable, source-bound capsules in visual-review.yml. Exact artifact wakes run
# independently, while a scheduled/manual sweep only redispatches one authenticated exact wake.
# The protected workflow may also certify a clean synchronized 1.20.1 anchor.
on:
  schedule:
    - cron: "17,47 * * * *"
  repository_dispatch:
    types:
      - visual-review-drain-requested
  workflow_dispatch:

permissions: {}

# Deduplicate wakes for one immutable artifact without serializing unrelated capsules. Generic
# sweeps share their own lock and never review directly, so they cannot race an exact wake after
# selecting the oldest fallback entry. GitHub may coalesce duplicate wakes because queue state is
# durable and exact-id cleanup, rather than any pending workflow run, owns completion.
concurrency:
  group: quick-skin-visual-review-${{ github.event.client_payload.artifact_id || 'queue-sweep' }}
  cancel-in-progress: false

jobs:
  select:
    name: Select one durable review capsule
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_digest: ${{ steps.queue.outputs.artifact_digest }}
      artifact_id: ${{ steps.queue.outputs.artifact_id }}
      artifact_name: ${{ steps.queue.outputs.artifact_name }}
      artifact_run_id: ${{ steps.queue.outputs.artifact_run_id }}
      artifact_size: ${{ steps.queue.outputs.artifact_size }}
      direct: ${{ steps.queue.outputs.direct }}
      eligible: ${{ steps.queue.outputs.eligible }}
      generation_sha: ${{ steps.queue.outputs.generation_sha }}
      implementation_sha: ${{ steps.queue.outputs.implementation_sha }}
      source_run_id: ${{ steps.queue.outputs.source_run_id }}

    steps:
      - name: Check out the protected queue selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Select the oldest authenticated non-cooling queue entry
        id: queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
          REQUESTED_ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
          REQUESTED_GENERATION_SHA: ${{ github.event.client_payload.generation_sha }}
        run: |
          set -euo pipefail
          attempts=1
          direct=false
          requested_arguments=()
          if [[ -n "$REQUESTED_ARTIFACT_ID" ]]; then
            [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]
            [[ "$REQUESTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            if [[ -n "$REQUESTED_GENERATION_SHA" ]]; then
              [[ "$REQUESTED_GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$REQUESTED_ARTIFACT_NAME" =~ \
                ^visual-review-input-[1-9][0-9]*-$REQUESTED_GENERATION_SHA$ ]]
            else
              # Migration compatibility for a durable capsule queued by the immediately previous
              # protected workflow. Its authenticated owner SHA becomes the generation fallback.
              [[ "$REQUESTED_ARTIFACT_NAME" =~ ^visual-review-input-[1-9][0-9]*$ ]]
            fi
            # The enqueue workflow dispatches from its final job, just before its own run settles.
            # Poll only that authenticated wake long enough for completed-run provenance to exist.
            attempts=12
            direct=true
            requested_arguments=(--requested-artifact-id "$REQUESTED_ARTIFACT_ID")
          else
            [[ -z "$REQUESTED_ARTIFACT_NAME" ]]
          fi
          queue_output="$(mktemp "$RUNNER_TEMP/visual-review-queue.XXXXXX")"
          selector_status=0
          for (( attempt = 1; attempt <= attempts; attempt++ )); do
            : > "$queue_output"
            selector_status=0
            if python3 scripts/ci/visual_review_queue.py \
                --repository "$GITHUB_REPOSITORY" \
                --github-output "$queue_output" \
                --cooldown-minutes 30 \
                "${requested_arguments[@]}"; then
              selector_status=0
            else
              selector_status=$?
            fi
            if [[ "$selector_status" -eq 75 ]]; then
              break
            fi
            if [[ "$selector_status" -eq 0 ]] && \
                grep -qx 'eligible=true' "$queue_output"; then
              break
            fi
            if (( attempt < attempts )); then
              printf 'Exact queue selection attempt %s/%s did not settle; retrying.\n' \
                "$attempt" "$attempts"
              sleep 5
            fi
          done
          if [[ "$selector_status" -eq 75 ]]; then
            echo "::warning::GitHub API quota exhausted; durable queue selection deferred"
            printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
            printf 'direct=%s\n' "$direct" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$selector_status" -ne 0 ]]; then
            exit "$selector_status"
          fi
          if [[ "$direct" == true ]] && grep -qx 'eligible=true' "$queue_output"; then
            grep -qx "artifact_id=$REQUESTED_ARTIFACT_ID" "$queue_output"
            grep -qx "artifact_name=$REQUESTED_ARTIFACT_NAME" "$queue_output"
            if [[ -n "$REQUESTED_GENERATION_SHA" ]]; then
              grep -qx "generation_sha=$REQUESTED_GENERATION_SHA" "$queue_output"
            fi
          fi
          cat "$queue_output" >> "$GITHUB_OUTPUT"
          printf 'direct=%s\n' "$direct" >> "$GITHUB_OUTPUT"

  dispatch-selected:
    name: Convert one fallback selection into an exact wake
    needs: select
    if: >-
      needs.select.outputs.eligible == 'true' &&
      needs.select.outputs.direct == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch the authenticated exact artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.select.outputs.artifact_name }}
          GENERATION_SHA: ${{ needs.select.outputs.generation_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_NAME" =~ ^visual-review-input-[1-9][0-9]*$ \
            || "$ARTIFACT_NAME" =~ \
              ^visual-review-input-[1-9][0-9]*-$GENERATION_SHA$ ]]
          payload="$RUNNER_TEMP/visual-review-selected.json"
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg generation_sha "$GENERATION_SHA" \
            '{event_type:"visual-review-drain-requested",
              client_payload:{artifact_id:$artifact_id,artifact_name:$artifact_name,
                generation_sha:$generation_sha}}' \
            > "$payload"
          dispatch_error="$RUNNER_TEMP/visual-review-selected.error"
          for attempt in 1 2 3; do
            : > "$dispatch_error"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
                --input "$payload" 2> "$dispatch_error"; then
              exit 0
            fi
            if grep -Fq 'API rate limit exceeded' "$dispatch_error"; then
              echo "::warning::GitHub API quota exhausted; exact queue wake deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$dispatch_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$dispatch_error" >&2
            exit 1
          done

  capacity-check:
    name: Read shared Claude capacity
    needs: select
    if: >-
      needs.select.outputs.eligible == 'true' &&
      needs.select.outputs.direct == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      probe_required: ${{ steps.circuit.outputs.probe_required }}
      ready: ${{ steps.circuit.outputs.ready }}

    steps:
      - name: Check out the protected capacity policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reuse only a fresh authenticated capacity marker
        id: circuit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/claude_capacity_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --implementation-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report an active subscription pause
        if: >-
          steps.circuit.outputs.probe_required == 'false' &&
          steps.circuit.outputs.ready == 'false'
        run: |
          printf 'Claude capacity remains paused; the durable capsule will be retried by the scheduled sweep.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  capacity-probe:
    name: Probe shared Claude capacity once
    needs:
      - select
      - capacity-check
    if: >-
      needs.select.outputs.eligible == 'true' &&
      needs.select.outputs.direct == 'true' &&
      needs.capacity-check.outputs.probe_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    concurrency:
      group: quick-skin-claude-capacity-probe
      cancel-in-progress: false
    outputs:
      fresh_ready: ${{ steps.resolve.outputs.fresh_ready }}
      ready: ${{ steps.resolve.outputs.ready }}

    steps:
      - name: Check out the protected capacity probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Recheck capacity after acquiring the global probe slot
        id: circuit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/claude_capacity_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --implementation-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Node for the locked capacity probe
        if: steps.circuit.outputs.probe_required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked Claude Code outside the repository
        if: steps.circuit.outputs.probe_required == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-capacity-cli"
          cp .github/claude/package.json .github/claude/package-lock.json \
            "$RUNNER_TEMP/claude-capacity-cli/"
          (
            cd "$RUNNER_TEMP/claude-capacity-cli"
            npm ci --ignore-scripts
            node node_modules/@anthropic-ai/claude-code/install.cjs
            node_modules/.bin/claude --version
          )

      - name: Probe once without tools before parallel review fan-out
        id: probe
        if: steps.circuit.outputs.probe_required == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          python3 scripts/ci/claude_capacity_probe.py \
            --claude \
              "$RUNNER_TEMP/claude-capacity-cli/node_modules/.bin/claude" \
            --model claude-haiku-4-5 \
            --work-root "$RUNNER_TEMP/claude-capacity-probe" \
            --marker "$RUNNER_TEMP/claude-capacity-marker.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish only the sanitized shared capacity marker
        if: steps.circuit.outputs.probe_required == 'true' && steps.probe.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.probe.outputs.marker_name }}
          path: ${{ runner.temp }}/claude-capacity-marker.json
          if-no-files-found: error
          retention-days: 1

      - name: Resolve whether model sessions may start
        id: resolve
        if: always() && steps.circuit.outcome == 'success' && steps.probe.outcome != 'failure'
        shell: bash
        env:
          CACHED_READY: ${{ steps.circuit.outputs.ready }}
          PROBE_READY: ${{ steps.probe.outputs.ready }}
          PROBE_REQUIRED: ${{ steps.circuit.outputs.probe_required }}
        run: |
          set -euo pipefail
          [[ "$CACHED_READY" == true || "$CACHED_READY" == false ]]
          [[ "$PROBE_REQUIRED" == true || "$PROBE_REQUIRED" == false ]]
          if [[ "$PROBE_REQUIRED" == true ]]; then
            [[ "$PROBE_READY" == true || "$PROBE_READY" == false ]]
            ready="$PROBE_READY"
            fresh_ready="$PROBE_READY"
          else
            ready="$CACHED_READY"
            fresh_ready=false
          fi
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          printf 'fresh_ready=%s\n' "$fresh_ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            printf 'Claude capacity is paused; the durable capsule remains queued.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  resume-capacity-queue:
    name: Wake every capsule after capacity returns
    needs:
      - select
      - capacity-probe
    if: >-
      always() && needs.capacity-probe.result == 'success' &&
      needs.capacity-probe.outputs.fresh_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the protected queue fan-out policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Dispatch every authenticated pending capsule independently
        shell: bash
        env:
          CURRENT_ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$CURRENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          pending="$RUNNER_TEMP/visual-review-capacity-pending.json"
          selector_status=0
          if python3 scripts/ci/visual_review_queue.py \
              --repository "$GITHUB_REPOSITORY" \
              --list-pending-json "$pending"; then
            selector_status=0
          else
            selector_status=$?
          fi
          if [[ "$selector_status" -eq 75 ]]; then
            echo "::warning::GitHub API quota exhausted; capacity fan-out deferred"
            exit 0
          fi
          [[ "$selector_status" -eq 0 ]]
          jq -e \
            'type == "array" and length <= 256 and all(.[];
              (keys | sort) == (["artifact_id", "artifact_name",
                "generation_sha"] | sort) and
              (.artifact_id | type == "number" and . > 0) and
              (.artifact_name | type == "string" and
                test("^visual-review-input-[1-9][0-9]*(-[0-9a-f]{40})?$")) and
              (.generation_sha | type == "string" and
                test("^[0-9a-f]{40}$")))' "$pending" > /dev/null
          while IFS= read -r entry; do
            artifact_id="$(jq -er '.artifact_id | tostring' <<< "$entry")"
            if [[ "$artifact_id" == "$CURRENT_ARTIFACT_ID" ]]; then
              continue
            fi
            artifact_name="$(jq -er .artifact_name <<< "$entry")"
            generation_sha="$(jq -er .generation_sha <<< "$entry")"
            payload="$RUNNER_TEMP/visual-review-capacity-$artifact_id.json"
            jq -n \
              --arg artifact_id "$artifact_id" \
              --arg artifact_name "$artifact_name" \
              --arg generation_sha "$generation_sha" \
              '{event_type:"visual-review-drain-requested",client_payload:{
                artifact_id:$artifact_id,artifact_name:$artifact_name,
                generation_sha:$generation_sha}}' > "$payload"
            dispatch_error="$RUNNER_TEMP/visual-review-capacity-$artifact_id.error"
            if ! github_api_retry --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
                > /dev/null 2> "$dispatch_error"; then
              if grep -Fq 'API rate limit exceeded' "$dispatch_error"; then
                cat "$dispatch_error" >&2
                echo "::warning::GitHub API quota exhausted; remaining capacity wakes deferred"
                exit 0
              fi
              cat "$dispatch_error" >&2
              exit 1
            fi
          done < <(jq -c '.[]' "$pending")

  review:
    name: Review one queued capsule
    needs:
      - select
      - capacity-check
      - capacity-probe
    if: >-
      always() &&
      needs.select.outputs.eligible == 'true' &&
      needs.select.outputs.direct == 'true' &&
      needs.capacity-check.result == 'success' &&
      (needs.capacity-check.outputs.ready == 'true' ||
       (needs.capacity-probe.result == 'success' &&
        needs.capacity-probe.outputs.ready == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    outputs:
      already_reviewed: ${{ steps.guard.outputs.already_reviewed }}
      capsule_missing: ${{ steps.capsule.outputs.missing }}
      certificate_artifact_id: ${{ steps.anchor-certificate.outputs.artifact-id }}
      certificate_artifact_name: ${{ steps.certify.outputs.artifact_name }}
      certificate_anchor_source_sha: ${{ steps.certify.outputs.anchor_source_sha }}
      certificate_anchor_target_sha: ${{ steps.certify.outputs.anchor_target_sha }}
      certificate_master_sha: ${{ steps.certify.outputs.master_source_sha }}
      cooling: ${{ steps.guard.outputs.cooling }}
      failure_category: ${{ steps.classify.outputs.failure_category }}
      failure_transient: ${{ steps.classify.outputs.failure_transient }}
      compatibility_eligible: ${{ steps.compatibility-release.outputs.eligible }}
      compatibility_source_branch: ${{ steps.compatibility-release.outputs.source_branch }}
      compatibility_source_run_id: ${{ steps.compatibility-release.outputs.source_run_id }}
      compatibility_source_sha: ${{ steps.compatibility-release.outputs.source_sha }}
      normalized_report_artifact_id: ${{ steps.normalized-report.outputs.artifact-id }}
      review_complete: ${{ steps.check.outputs.review_complete }}
      wave_blocked: ${{ (steps.wave-block.outputs.blocked == 'true' || steps.guard.outputs.wave_blocked == 'true') && 'true' || 'false' }}

    steps:
      - name: Revalidate the artifact-scoped queue entry
        id: guard
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.select.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.select.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ needs.select.outputs.artifact_run_id }}
          ARTIFACT_SIZE: ${{ needs.select.outputs.artifact_size }}
          GENERATION_SHA: ${{ needs.select.outputs.generation_sha }}
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ needs.select.outputs.implementation_sha }}
          SOURCE_RUN_ID: ${{ needs.select.outputs.source_run_id }}
        run: |
          set -euo pipefail
          protected_gh_api_retry() {
            local api_status attempt delay now output reset_at skew wait_seconds
            delay=5
            for attempt in {1..4}; do
              output=''
              api_status=0
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                api_status=$?
              fi
              if ! grep -Eqi \
                  'API rate limit exceeded|secondary rate limit|HTTP (408|429|5[0-9][0-9])|connection (reset|refused)|timed out|timeout|temporary failure|TLS handshake|unexpected EOF' \
                  <<< "$output" || (( attempt == 4 )); then
                printf '%s\n' "$output" >&2
                return "$api_status"
              fi
              wait_seconds="$delay"
              if grep -Fqi 'API rate limit exceeded' <<< "$output"; then
                reset_at="$(gh api rate_limit --jq .resources.core.reset \
                  2>/dev/null || true)"
                if [[ "$reset_at" =~ ^[1-9][0-9]*$ ]]; then
                  now="$(date +%s)"
                  skew=$(( (GITHUB_RUN_ID + attempt) % 5 ))
                  wait_seconds=$(( reset_at - now + 2 + skew ))
                  (( wait_seconds > 0 )) || wait_seconds=1
                  if (( wait_seconds > 3700 )); then
                    printf '%s\n' "$output" >&2
                    return "$api_status"
                  fi
                else
                  wait_seconds=60
                fi
              elif grep -Eqi 'secondary rate limit|HTTP 429' <<< "$output"; then
                (( wait_seconds >= 60 )) || wait_seconds=60
              fi
              printf 'GitHub API review guard attempt %s/4 failed transiently; waiting %ss.\n' \
                "$attempt" "$wait_seconds" >&2
              sleep "$wait_seconds"
              delay=$(( delay < 60 ? delay * 2 : 60 ))
              (( delay <= 60 )) || delay=60
            done
          }
          printf 'already_reviewed=false\n' >> "$GITHUB_OUTPUT"
          printf 'cooling=false\n' >> "$GITHUB_OUTPUT"
          printf 'reviewable=true\n' >> "$GITHUB_OUTPUT"
          printf 'wave_blocked=false\n' >> "$GITHUB_OUTPUT"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_NAME" == "visual-review-input-$SOURCE_RUN_ID" \
            || "$ARTIFACT_NAME" == \
              "visual-review-input-$SOURCE_RUN_ID-$GENERATION_SHA" ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( ARTIFACT_SIZE <= 536870912 ))
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          # An Opus-confirmed defect in one automatic port stops every sibling review from the same
          # exact propagated generation. The marker's protected implementation is reauthenticated
          # from its owner; a name alone, or an artifact from another workflow, cannot suppress work.
          block_name="visual-review-wave-block-$GENERATION_SHA"
          blocks="$(protected_gh_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$block_name&per_page=100")"
          jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
            <<< "$blocks" > /dev/null
          while IFS=$'\t' read -r block_run_id expired size head_sha; do
            [[ -n "$block_run_id" && "$expired" == false ]] || continue
            [[ "$size" =~ ^[1-9][0-9]*$ ]] || continue
            (( size <= 1048576 )) || continue
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            block_run="$(protected_gh_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$block_run_id" 2>/dev/null || true)"
            if [[ -n "$block_run" ]] && jq -e \
                --arg implementation_sha "$head_sha" \
                --arg repository "$GITHUB_REPOSITORY" \
                '((.status == "completed" and .conclusion == "failure") or
                  (.status == "in_progress" and .conclusion == null)) and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and .head_sha == $implementation_sha and
                 .path == ".github/workflows/visual-review-drain.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$block_run" > /dev/null; then
              block_id="$(jq -er --argjson run_id "$block_run_id" \
                --arg name "$block_name" \
                '[.[].artifacts[] | select(.name == $name and
                  .workflow_run.id == $run_id and .expired == false)] |
                 if length == 1 then .[0].id else empty end' <<< "$blocks")"
              [[ "$block_id" =~ ^[1-9][0-9]*$ ]]
              block_archive="$RUNNER_TEMP/visual-review-wave-block-$block_id.zip"
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$block_id/zip" \
                > "$block_archive"
              block_root="$RUNNER_TEMP/visual-review-wave-block-$block_id"
              python3 scripts/ci/bounded_zip.py "$block_archive" "$block_root" \
                --max-archive-bytes 1048576 \
                --max-entries 1 \
                --max-total-bytes 1048576 \
                --max-file-bytes 1048576 \
                --max-compression-ratio 100 \
                > "$RUNNER_TEMP/visual-review-wave-block-extraction-$block_id.json"
              block_file="$block_root/visual-review-wave-block.json"
              [[ -f "$block_file" && ! -L "$block_file" ]]
              jq -e \
                --arg generation_sha "$GENERATION_SHA" \
                --arg implementation_sha "$head_sha" \
                '(keys | sort) == (["generation_sha", "implementation_sha", "kind",
                  "report_sha256", "schema_version", "source_run_id", "source_sha"] |
                  sort) and .schema_version == 1 and
                 .kind == "quick-skin-visual-review-wave-block" and
                 .generation_sha == $generation_sha and
                 .implementation_sha == $implementation_sha and
                 (.source_run_id | type == "number" and . > 0) and
                 (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and
                 (.report_sha256 | type == "string" and test("^[0-9a-f]{64}$"))' \
                "$block_file" > /dev/null
              printf 'wave_blocked=true\n' >> "$GITHUB_OUTPUT"
              printf 'reviewable=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r --arg name "$block_name" \
            '.[].artifacts[] | select(.name == $name) |
             [.workflow_run.id, .expired, .size_in_bytes,
              .workflow_run.head_sha] | @tsv' <<< "$blocks")

          report_name="visual-review-$SOURCE_RUN_ID"
          reports="$(protected_gh_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$report_name&per_page=100")"
          jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
            <<< "$reports" > /dev/null
          while IFS=$'\t' read -r report_run_id expired; do
            [[ -n "$report_run_id" && "$expired" == false ]] || continue
            report_run="$(protected_gh_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$report_run_id" 2>/dev/null || true)"
            if [[ -n "$report_run" ]] && jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                '((.status == "completed" and
                   (.conclusion == "success" or .conclusion == "failure")) or
                  (.status == "in_progress" and .conclusion == null)) and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and
                 .path == ".github/workflows/visual-review-drain.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$report_run" > /dev/null; then
              printf 'already_reviewed=true\n' >> "$GITHUB_OUTPUT"
              printf 'reviewable=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r --arg name "$report_name" \
            '.[].artifacts[] | select(.name == $name) |
             [.workflow_run.id, .expired] | @tsv' <<< "$reports")

          # A wake may have selected this capsule while an older run still held the model group.
          # Re-check the exact source's fixed-name marker after entering that group so a recent
          # provider failure cannot be retried by an already-pending duplicate drain.
          attempt_name="visual-review-attempt-$SOURCE_RUN_ID"
          attempts="$(protected_gh_api_retry --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$attempt_name&per_page=100")"
          jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
            <<< "$attempts" > /dev/null
          while IFS=$'\t' read -r attempt_run_id expired created_at; do
            [[ -n "$attempt_run_id" && "$expired" == false ]] || continue
            if ! jq -ne --arg created_at "$created_at" \
                '($created_at | fromdateiso8601) + 1800 > now'; then
              continue
            fi
            attempt_run="$(protected_gh_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$attempt_run_id" 2>/dev/null || true)"
            if [[ -n "$attempt_run" ]] && jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                '((.status == "completed" and .conclusion == "failure") or
                  (.status == "in_progress" and .conclusion == null)) and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and
                 .path == ".github/workflows/visual-review-drain.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$attempt_run" > /dev/null; then
              printf 'cooling=true\n' >> "$GITHUB_OUTPUT"
              printf 'reviewable=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r --arg name "$attempt_name" \
            '.[].artifacts[] | select(.name == $name) |
             [.workflow_run.id, .expired, .created_at] | @tsv' <<< "$attempts")

          metadata="$(protected_gh_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --arg name "$ARTIFACT_NAME" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson artifact_run_id "$ARTIFACT_RUN_ID" \
            --argjson size "$ARTIFACT_SIZE" \
            '.id == $artifact_id and .name == $name and .digest == $digest and
             .size_in_bytes == $size and .expired == false and
             .workflow_run.id == $artifact_run_id and
             .workflow_run.head_branch == "master" and
             .workflow_run.head_sha == $implementation_sha' \
            <<< "$metadata" > /dev/null
          owner="$(protected_gh_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          jq -e \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            '.id == $run_id and .status == "completed" and
             (.conclusion == "success" or .conclusion == "failure") and
             (.event == "repository_dispatch" or .event == "workflow_run") and
             .head_branch == "master" and .head_sha == $implementation_sha and
             .path == ".github/workflows/visual-review.yml" and
             .head_repository.full_name == $repository' \
            <<< "$owner" > /dev/null

      - name: Check out the exact protected reviewer
        if: steps.guard.outputs.reviewable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.implementation_sha }}
          persist-credentials: false

      - name: Install Python
        if: steps.guard.outputs.reviewable == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked image decoder
        if: steps.guard.outputs.reviewable == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            --requirement scripts/pages/requirements.txt

      - name: Fetch and verify the exact curated capsule
        id: capsule
        if: steps.guard.outputs.reviewable == 'true'
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.select.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.select.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ needs.select.outputs.artifact_run_id }}
          ARTIFACT_SIZE: ${{ needs.select.outputs.artifact_size }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ needs.select.outputs.implementation_sha }}
          SOURCE_RUN_ID: ${{ needs.select.outputs.source_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          archive="$RUNNER_TEMP/curated-review-input.zip"
          download_error="$(mktemp "$RUNNER_TEMP/curated-review-download.XXXXXX")"
          if ! github_api_retry_to_file "$archive" \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              2> "$download_error"; then
            # The exact capsule can be retired after the guard authenticates it but before the
            # download starts. This wake is then already settled; every other failure stays red.
            if grep -Fq '(HTTP 404)' "$download_error"; then
              printf 'missing=true\n' >> "$GITHUB_OUTPUT"
              printf 'The authenticated queue capsule disappeared before download; no model session started.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$download_error" >&2
            exit 1
          fi
          rm -f -- "$download_error"
          printf 'missing=false\n' >> "$GITHUB_OUTPUT"
          [[ "$(stat -c %s "$archive")" == "$ARTIFACT_SIZE" ]]
          [[ "$(sha256sum "$archive" | cut -d ' ' -f 1)" == "$ARTIFACT_DIGEST" ]]
          capsule="$RUNNER_TEMP/visual-review-capsule"
          test ! -e "$capsule"
          mkdir -p "$capsule"
          python3 scripts/ci/bounded_zip.py \
            "$archive" "$capsule/handoff" \
            --max-archive-bytes 536870912 \
            --max-entries 520 \
            --max-total-bytes 536870912 \
            --max-file-bytes 33554432 \
            --max-compression-ratio 200 \
            > "$RUNNER_TEMP/curated-extraction.json"
          rm -f -- "$archive"
          mv -- "$capsule/handoff/curation-proof.json" \
            "$capsule/curation-proof.json"
          mv -- "$capsule/handoff/review-input" "$capsule/review-input"
          rmdir "$capsule/handoff"

          mapfile -d '' top_level < <(
            find "$capsule" -mindepth 1 -maxdepth 1 -print0
          )
          [[ "${#top_level[@]}" -eq 2 ]]
          [[ -f "$capsule/curation-proof.json" && ! -L "$capsule/curation-proof.json" ]]
          [[ -f "$capsule/review-input/visual-review-manifest.json" ]]
          [[ -d "$capsule/review-input/images" ]]
          [[ -z "$(find "$capsule/review-input/images" -mindepth 2 -print -quit)" ]]

          image_count=0
          image_bytes=0
          while IFS= read -r -d '' frame; do
            frame_name="$(basename "$frame")"
            [[ -f "$frame" && ! -L "$frame" ]]
            [[ "$frame_name" =~ ^[0-9a-f]{64}\.png$ ]]
            [[ "$(sha256sum "$frame" | cut -d ' ' -f 1).png" == "$frame_name" ]]
            image_count=$((image_count + 1))
            image_bytes=$((image_bytes + $(stat -c %s "$frame")))
          done < <(
            find "$capsule/review-input/images" -mindepth 1 -maxdepth 1 -print0
          )
          (( image_count > 0 && image_count <= 512 ))

          proof="$capsule/curation-proof.json"
          manifest="$capsule/review-input/visual-review-manifest.json"
          manifest_sha256="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          frame_count="$(jq length "$manifest")"
          source_sha="$(jq -er .source_sha "$proof")"
          proof_source_run_id="$(jq -er .source_run_id "$proof")"
          [[ "$proof_source_run_id" == "$SOURCE_RUN_ID" ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          source_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$source_sha" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and .status == "completed" and .conclusion == "success" and
             (.event == "pull_request" or .event == "schedule" or
              .event == "workflow_dispatch") and .head_sha == $sha and
             .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$source_run" > /dev/null

          review_mode="$(jq -er \
            '.review_mode | select(. == "anchor-semantic" or
              . == "reference-comparison")' "$proof")"
          source_branch="$(jq -er .source_branch "$proof")"
          [[ "$(jq -r .head_branch <<< "$source_run")" == "$source_branch" ]]
          scenario_contract_sha256="$(sha256sum e2e/scenario-contract.json | cut -d ' ' -f 1)"
          jq -e \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg review_mode "$review_mode" \
            --arg scenario_contract_sha256 "$scenario_contract_sha256" \
            --arg source_branch "$source_branch" \
            --arg source_sha "$source_sha" \
            --argjson frame_count "$frame_count" \
            --argjson image_bytes "$image_bytes" \
            --argjson image_count "$image_count" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '. as $proof |
             (keys | sort) == (["artifact_inventory", "compatibility_impact",
              "frame_count", "image_bytes",
              "image_count", "implementation_sha", "job_graph", "manifest_sha256",
              "master_source_sha", "matrix_kind", "review_mode",
              "scenario_contract_sha256", "schema_version", "source_branch",
              "source_run_id", "source_sha", "visual_reference"] | sort) and
             .schema_version == 5 and .source_run_id == $source_run_id and
             .source_branch == $source_branch and .source_sha == $source_sha and
             (.master_source_sha == null or
               (.master_source_sha | type == "string" and test("^[0-9a-f]{40}$"))) and
             .implementation_sha == $implementation_sha and .review_mode == $review_mode and
             (.matrix_kind == "pr-anchors" or .matrix_kind == "native-anchors") and
             .scenario_contract_sha256 == $scenario_contract_sha256 and
             (.compatibility_impact | type == "object" and
               (keys | sort) == (["compatibility_required", "impact_paths", "paths",
                 "schema_version"] | sort) and
               .schema_version == 1 and
               (.compatibility_required | type == "boolean") and
               (.paths | type == "array" and length <= 200 and
                 . == (sort | unique) and
                 all(.[]; type == "string" and length > 0 and length <= 512)) and
               (.impact_paths | type == "array" and length <= 200 and
                 . == (sort | unique) and
                 all(.[]; type == "string" and
                   (. as $path | ($proof.compatibility_impact.paths |
                     index($path)) != null))) and
               (if .compatibility_required then true else .impact_paths == [] end)) and
             (.artifact_inventory | type == "array" and length > 0 and length <= 8) and
             ([.artifact_inventory[].id] | length == (unique | length)) and
             ([.artifact_inventory[].name] | length == (unique | length)) and
             ([.artifact_inventory[] |
               (.id | type == "number" and . > 0) and
               (.name | type == "string" and
                 test("^packaged-e2e-[A-Za-z0-9._-]+$")) and
               (.size_in_bytes | type == "number" and . > 0 and . <= 67108864) and
               (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
               (.expired == false) and (.workflow_run | type == "object") and
               (.workflow_run.id == $source_run_id)] | all) and
             ([.artifact_inventory[].size_in_bytes] | add // 0) <= 268435456 and
             (.job_graph | type == "object" and .runtime_policy == "full") and
             .manifest_sha256 == $manifest_sha256 and .frame_count == $frame_count and
             .image_count == $image_count and .image_bytes == $image_bytes and
             (if $review_mode == "anchor-semantic" then
                .visual_reference == null
              else
                (.visual_reference | type == "object")
              end)' \
            "$proof" > /dev/null

          validation_arguments=(
            --manifest "$manifest"
            --input-root "$capsule/review-input"
            --validate-input-only
          )
          if [[ "$review_mode" == reference-comparison ]]; then
            reference_identity="$(python3 e2e/visual_review.py \
              --matrix release/release-matrix.json --reference-identity)"
            reference_branch="$(jq -er .release_branch <<< "$reference_identity")"
            reference_artifact_node="$(jq -er .artifact_node <<< "$reference_identity")"
            reference_version="$(jq -er .version <<< "$reference_identity")"
            reference_loader="$(jq -er .loader <<< "$reference_identity")"
            reference_id="$(jq -er .visual_reference.artifact_id "$proof")"
            reference_name="$(jq -er .visual_reference.artifact_name "$proof")"
            reference_run_id="$(jq -er .visual_reference.artifact_run_id "$proof")"
            reference_sha="$(jq -er .visual_reference.sha "$proof")"
            reference_digest="$(jq -er .visual_reference.artifact_digest "$proof")"
            reference_size="$(jq -er .visual_reference.artifact_size_in_bytes "$proof")"
            [[ "$reference_name" == "pages-e2e-$reference_branch" ]]
            reference_metadata="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$reference_id")"
            jq -e \
              --arg digest "$reference_digest" \
              --arg name "$reference_name" \
              --arg sha "$reference_sha" \
              --argjson artifact_id "$reference_id" \
              --argjson run_id "$reference_run_id" \
              --argjson size "$reference_size" \
              '.id == $artifact_id and .name == $name and .size_in_bytes == $size and
               .digest == $digest and .expired == false and
               .workflow_run.id == $run_id and .workflow_run.head_sha == $sha' \
              <<< "$reference_metadata" > /dev/null
            reference_run="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$reference_run_id")"
            jq -e \
              --arg branch "$reference_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$reference_sha" \
              '.status == "completed" and .conclusion == "success" and
               .event == "workflow_dispatch" and .head_branch == $branch and
               .head_sha == $sha and .path == ".github/workflows/on-demand-e2e.yml" and
               .head_repository.full_name == $repository' \
              <<< "$reference_run" > /dev/null
            [[ "$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/branches/$reference_branch" \
              --jq .commit.sha)" == "$reference_sha" ]]
            jq -e \
              --arg reference_artifact_node "$reference_artifact_node" \
              --arg reference_branch "$reference_branch" \
              --arg reference_digest "$reference_digest" \
              --arg reference_loader "$reference_loader" \
              --arg reference_name "$reference_name" \
              --arg reference_sha "$reference_sha" \
              --arg reference_version "$reference_version" \
              --argjson reference_id "$reference_id" \
              --argjson reference_run_id "$reference_run_id" \
              --argjson reference_size "$reference_size" \
              '(.visual_reference | (keys | sort) == (["artifact_digest", "artifact_id",
                "artifact_name", "artifact_node", "artifact_run_id",
                "artifact_size_in_bytes", "branch", "evidence_kind", "loader",
                "manifest_sha256", "sha", "version"] | sort)) and
               .visual_reference.artifact_id == $reference_id and
               .visual_reference.artifact_name == $reference_name and
               .visual_reference.artifact_run_id == $reference_run_id and
               .visual_reference.artifact_size_in_bytes == $reference_size and
               .visual_reference.artifact_digest == $reference_digest and
               .visual_reference.branch == $reference_branch and
               .visual_reference.sha == $reference_sha and
               .visual_reference.artifact_node == $reference_artifact_node and
               .visual_reference.version == $reference_version and
               .visual_reference.loader == $reference_loader and
               .visual_reference.evidence_kind == "raw-png" and
               (.visual_reference.manifest_sha256 | type == "string" and
                 test("^[0-9a-f]{64}$"))' \
              "$proof" > /dev/null
            validation_arguments+=(--require-paired)
          fi
          python3 e2e/check_visual_review.py "${validation_arguments[@]}"
          sha256sum "$manifest" > "$RUNNER_TEMP/visual-review-manifest.sha256"
          mkdir -p "$RUNNER_TEMP/protected-reviewer"
          cp e2e/check_visual_review.py "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_similarity.py "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_cache.py "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_runner.py "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_prompt.md "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_verify_prompt.md "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_semantic_prompt.md "$RUNNER_TEMP/protected-reviewer/"
          cp e2e/visual_review_semantic_verify_prompt.md \
            "$RUNNER_TEMP/protected-reviewer/"
          sha256sum "$RUNNER_TEMP/protected-reviewer/"* \
            > "$RUNNER_TEMP/protected-reviewer.sha256"

      - name: Restore only the authenticated exact-policy verdict cache
        id: verdict-cache
        if: >-
          steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/visual-review-capsule
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/ci/github_api_retry.sh"
          printf 'restored=false\n' >> "$GITHUB_OUTPUT"
          printf 'artifact_ids=\n' >> "$GITHUB_OUTPUT"
          printf 'policy_sha256=\n' >> "$GITHUB_OUTPUT"
          review_mode="$(jq -er \
            '.review_mode | select(. == "anchor-semantic" or
              . == "reference-comparison")' curation-proof.json)"
          if [[ "$review_mode" != reference-comparison ]]; then
            exit 0
          fi
          triage_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_prompt.md"
          verify_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_verify_prompt.md"
          policy_sha256="$(python3 \
            "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" policy \
            --runner "$RUNNER_TEMP/protected-reviewer/visual_review_runner.py" \
            --checker "$RUNNER_TEMP/protected-reviewer/check_visual_review.py" \
            --cache-codec "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" \
            --similarity-codec "$RUNNER_TEMP/protected-reviewer/visual_similarity.py" \
            --scenario-contract "$GITHUB_WORKSPACE/e2e/scenario-contract.json" \
            --release-matrix "$GITHUB_WORKSPACE/release/release-matrix.json" \
            --provider-lock "$GITHUB_WORKSPACE/.github/claude/package-lock.json" \
            --triage-prompt "$triage_prompt" \
            --verify-prompt "$verify_prompt" \
            --triage-model claude-haiku-4-5 \
            --verify-model claude-opus-5 \
            --review-mode "$review_mode" \
            --triage-chunk-size 8 \
            --verify-chunk-size 4)"
          [[ "$policy_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'policy_sha256=%s\n' "$policy_sha256" >> "$GITHUB_OUTPUT"
          cache_name="visual-review-verdict-cache-$policy_sha256"
          if ! artifacts="$(github_api_retry --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$cache_name&per_page=100")"; then
            exit 0
          fi
          if ! jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
              <<< "$artifacts" > /dev/null; then
            exit 0
          fi
          cache_arguments=()
          cache_ids=()
          cache_paths=()
          while IFS=$'\t' read -r candidate_id candidate_run_id; do
            [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]
            candidate_run="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" \
              2>/dev/null || true)"
            if [[ -n "$candidate_run" ]] && jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --argjson run_id "$candidate_run_id" \
                '.id == $run_id and .status == "completed" and
                 (.conclusion == "success" or .conclusion == "failure") and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and
                 (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
                 .path == ".github/workflows/visual-review-drain.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$candidate_run" > /dev/null; then
              cache_owner_sha="$(jq -er .head_sha <<< "$candidate_run")"
              if ! git -C "$GITHUB_WORKSPACE" cat-file -e \
                  "$cache_owner_sha^{commit}" 2>/dev/null; then
                if ! git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
                    "$cache_owner_sha"; then
                  continue
                fi
              fi
              # Historical protected caches may survive an unrelated master merge. Reuse them
              # only from an ancestor whose cache-producing workflow is byte-identical; the
              # current codec subsequently revalidates the complete exact policy and every key.
              if ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
                  "$cache_owner_sha" "$GITHUB_SHA"; then
                continue
              fi
              owner_producer="$(git -C "$GITHUB_WORKSPACE" rev-parse \
                "$cache_owner_sha:.github/workflows/visual-review-drain.yml" \
                2>/dev/null || true)"
              current_producer="$(git -C "$GITHUB_WORKSPACE" rev-parse \
                "$GITHUB_SHA:.github/workflows/visual-review-drain.yml")"
              if [[ -z "$owner_producer" \
                  || "$owner_producer" != "$current_producer" ]]; then
                continue
              fi
              cache_metadata="$(jq -c --argjson id "$candidate_id" \
                '[.[].artifacts[] | select(.id == $id)] |
                 if length == 1 then .[0] else empty end' <<< "$artifacts")"
              if [[ -z "$cache_metadata" ]]; then
                continue
              fi
              if ! cache_size="$(jq -er .size_in_bytes <<< "$cache_metadata")" || \
                  ! cache_digest="$(jq -er \
                    '.digest | select(type == "string" and
                      test("^sha256:[0-9a-f]{64}$"))' <<< "$cache_metadata")"; then
                continue
              fi
              cache_archive="$RUNNER_TEMP/visual-review-verdict-cache-$candidate_id.zip"
              if ! github_api_retry_to_file "$cache_archive" \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/$GITHUB_REPOSITORY/actions/artifacts/$candidate_id/zip"; then
                continue
              fi
              if [[ "$(stat -c %s "$cache_archive")" != "$cache_size" ]] || \
                  [[ "sha256:$(sha256sum "$cache_archive" | cut -d ' ' -f 1)" != \
                    "$cache_digest" ]]; then
                rm -f -- "$cache_archive"
                continue
              fi
              cache_root="$RUNNER_TEMP/restored-verdict-cache-$candidate_id"
              if ! python3 "$GITHUB_WORKSPACE/scripts/ci/bounded_zip.py" \
                  "$cache_archive" "$cache_root" \
                  --max-archive-bytes 4194304 \
                  --max-entries 1 \
                  --max-total-bytes 4194304 \
                  --max-file-bytes 4194304 \
                  --max-compression-ratio 200 \
                    > "$RUNNER_TEMP/verdict-cache-extraction-$candidate_id.json"; then
                rm -f -- "$cache_archive"
                continue
              fi
              rm -f -- "$cache_archive"
              restored="$cache_root/visual-review-verdict-cache.json"
              normalized="$RUNNER_TEMP/visual-review-verdict-cache-$candidate_id.json"
              if [[ ! -f "$restored" || -L "$restored" ]] || \
                  ! python3 \
                    "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" validate \
                    --cache "$restored" \
                    --policy-sha256 "$policy_sha256" \
                    --normalized-output "$normalized"; then
                continue
              fi
              cache_arguments+=(--cache "$normalized")
              cache_ids+=("$candidate_id")
              cache_paths+=("$normalized")
              if (( ${#cache_ids[@]} == 32 )); then
                break
              fi
            fi
          done < <(jq -r --arg name "$cache_name" \
            '[.[].artifacts[] |
              select(.name == $name and .expired == false and
                (.size_in_bytes | type == "number" and . > 0 and . <= 4194304) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                (.id | type == "number" and . > 0) and
                (.workflow_run.id | type == "number" and . > 0))] |
             sort_by(.created_at, .id) | reverse | .[] |
             [.id, .workflow_run.id] | @tsv' <<< "$artifacts" || true)
          if (( ${#cache_ids[@]} == 0 )); then
            exit 0
          fi
          if python3 "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" \
              combine --help > /dev/null 2>&1; then
            python3 "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" combine \
              "${cache_arguments[@]}" \
              --policy-sha256 "$policy_sha256" \
              --output visual-review-verdict-cache.input.json
          else
            # Capsules queued by the immediately preceding implementation have no combine command.
            # Preserve its original newest-cache behavior and retire only the shard actually used.
            cp -- "${cache_paths[0]}" visual-review-verdict-cache.input.json
            cache_ids=("${cache_ids[0]}")
          fi
          cache_id_list="$(IFS=,; printf '%s' "${cache_ids[*]}")"
          [[ "$cache_id_list" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          printf 'artifact_ids=%s\n' "$cache_id_list" >> "$GITHUB_OUTPUT"
          printf 'restored=true\n' >> "$GITHUB_OUTPUT"

      - name: Install Node for the locked Claude CLI
        if: >-
          steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked Claude Code outside the repository
        if: >-
          steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-cli"
          cp .github/claude/package.json .github/claude/package-lock.json \
            "$RUNNER_TEMP/claude-cli/"
          (
            cd "$RUNNER_TEMP/claude-cli"
            npm ci --ignore-scripts
            node node_modules/@anthropic-ai/claude-code/install.cjs
            node_modules/.bin/claude --version
          )

      - name: Review bounded chunks with selective escalation
        id: model
        if: >-
          steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          sha256sum --check "$RUNNER_TEMP/protected-reviewer.sha256"
          review_mode="$(jq -er \
            '.review_mode | select(. == "anchor-semantic" or
              . == "reference-comparison")' curation-proof.json)"
          if [[ "$review_mode" == anchor-semantic ]]; then
            triage_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_semantic_prompt.md"
            verify_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_semantic_verify_prompt.md"
          else
            triage_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_prompt.md"
            verify_prompt="$RUNNER_TEMP/protected-reviewer/visual_review_verify_prompt.md"
          fi
          cache_arguments=()
          if [[ "${{ steps.verdict-cache.outputs.restored }}" == true ]]; then
            cache_arguments=(
              --cache visual-review-verdict-cache.input.json
              --cache-policy-sha256 \
                "${{ steps.verdict-cache.outputs.policy_sha256 }}"
            )
          fi
          model_status=0
          python3 "$RUNNER_TEMP/protected-reviewer/visual_review_runner.py" \
            --capsule . \
            --manifest review-input/visual-review-manifest.json \
            --input-root review-input \
            --review-mode "$review_mode" \
            --claude "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" \
            --triage-prompt "$triage_prompt" \
            --verify-prompt "$verify_prompt" \
            --triage-model claude-haiku-4-5 \
            --verify-model claude-opus-5 \
            --triage-chunk-size 8 \
            --verify-chunk-size 4 \
            --max-parallel-calls 32 \
            --model-attempts 3 \
            --call-spacing-seconds 0 \
            "${cache_arguments[@]}" \
            --output visual-review-report.staged.json \
            --completion-state visual-review-completion.json \
            --failure-report visual-review-failure.json \
            || model_status=$?
          printf 'model_status=%s\n' "$model_status" >> "$GITHUB_OUTPUT"

      - name: Independently validate the normalized result
        id: check
        if: >-
          steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        shell: bash
        env:
          MODEL_STATUS: ${{ steps.model.outputs.model_status }}
        run: |
          set -euo pipefail
          [[ "$MODEL_STATUS" =~ ^[0-9]{1,3}$ ]]
          if (( MODEL_STATUS != 0 )); then
            exit "$MODEL_STATUS"
          fi
          sha256sum --check "$RUNNER_TEMP/visual-review-manifest.sha256"
          sha256sum --check "$RUNNER_TEMP/protected-reviewer.sha256"
          review_mode="$(jq -er \
            '.review_mode | select(. == "anchor-semantic" or
              . == "reference-comparison")' curation-proof.json)"
          validation_arguments=(
            --manifest review-input/visual-review-manifest.json
            --input-root review-input
            --validate-input-only
          )
          report_arguments=(
            --report visual-review-report.staged.json
            --normalized-report visual-review-report.json
            --manifest review-input/visual-review-manifest.json
          )
          jq -e \
            --argjson manifest_frames "$(jq length review-input/visual-review-manifest.json)" \
            --argjson report_verdicts "$(jq length visual-review-report.staged.json)" \
            '(keys | sort) == (["manifest_frames", "report_verdicts",
              "schema_version", "state"] | sort) and
             (.schema_version == 1) and
             (.manifest_frames | type == "number") and
             (.report_verdicts | type == "number") and
             (.state == "complete" or .state == "blocking-partial") and
             .manifest_frames == $manifest_frames and
             .report_verdicts == $report_verdicts and
             (if .state == "complete" then
                .report_verdicts == .manifest_frames
              else
                .report_verdicts > 0 and .report_verdicts <= .manifest_frames
              end)' visual-review-completion.json > /dev/null
          if [[ "$(jq -er .state visual-review-completion.json)" == blocking-partial ]]; then
            jq -e 'length > 0 and all(.[]; .defect == true)' \
              visual-review-report.staged.json > /dev/null
            report_arguments+=(--allow-blocking-partial)
          fi
          if [[ "$review_mode" == reference-comparison ]]; then
            validation_arguments+=(--require-paired)
            report_arguments+=(--require-paired)
          fi
          python3 "$RUNNER_TEMP/protected-reviewer/check_visual_review.py" \
            "${validation_arguments[@]}"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          review_status=0
          python3 "$RUNNER_TEMP/protected-reviewer/check_visual_review.py" \
            "${report_arguments[@]}" \
            || review_status=$?
          test -s visual-review-report.json
          printf 'review_complete=true\n' >> "$GITHUB_OUTPUT"
          exit "$review_status"

      - name: Create a sanitized generation block after a confirmed defect
        id: wave-block
        if: >-
          always() && steps.guard.outputs.reviewable == 'true' &&
          steps.check.outputs.review_complete == 'true'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        shell: bash
        env:
          GENERATION_SHA: ${{ needs.select.outputs.generation_sha }}
          IMPLEMENTATION_SHA: ${{ needs.select.outputs.implementation_sha }}
          SOURCE_RUN_ID: ${{ needs.select.outputs.source_run_id }}
        run: |
          set -euo pipefail
          printf 'blocked=false\n' >> "$GITHUB_OUTPUT"
          if [[ "$(jq -er .state visual-review-completion.json)" != blocking-partial ]]; then
            exit 0
          fi
          source_branch="$(jq -er .source_branch curation-proof.json)"
          # Advisory PRs must never suppress reviews for the protected automatic version wave.
          if [[ "$source_branch" != automation/sync/* ]]; then
            exit 0
          fi
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          proof_generation="$(jq -er \
            '.master_source_sha // .implementation_sha |
             select(type == "string" and test("^[0-9a-f]{40}$"))' \
            curation-proof.json)"
          [[ "$proof_generation" == "$GENERATION_SHA" ]]
          jq -e \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '.implementation_sha == $implementation_sha and
             .source_run_id == $source_run_id and
             (.source_branch | startswith("automation/sync/"))' \
            curation-proof.json > /dev/null
          jq -e 'length > 0 and all(.[]; .defect == true)' \
            visual-review-report.json > /dev/null
          report_sha256="$(sha256sum visual-review-report.json | cut -d ' ' -f 1)"
          source_sha="$(jq -er \
            '.source_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            curation-proof.json)"
          jq -n \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --arg generation_sha "$GENERATION_SHA" \
            --arg report_sha256 "$report_sha256" \
            --arg source_sha "$source_sha" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '{schema_version:1,kind:"quick-skin-visual-review-wave-block",
              generation_sha:$generation_sha,implementation_sha:$implementation_sha,
              source_run_id:$source_run_id,
              source_sha:$source_sha,report_sha256:$report_sha256}' \
            > visual-review-wave-block.json
          printf 'artifact_name=visual-review-wave-block-%s\n' "$GENERATION_SHA" \
            >> "$GITHUB_OUTPUT"
          printf 'blocked=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload the sanitized generation block marker
        id: wave-block-artifact
        if: always() && steps.wave-block.outputs.blocked == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.wave-block.outputs.artifact_name }}
          path: ${{ runner.temp }}/visual-review-capsule/visual-review-wave-block.json
          if-no-files-found: error
          retention-days: 7

      - name: Cancel sibling drains after the durable block exists
        if: >-
          always() && steps.wave-block-artifact.outputs.artifact-id != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ needs.select.outputs.implementation_sha }}
        run: |
          set -euo pipefail
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          workflow_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/visual-review-drain.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          for status in queued in_progress; do
            runs="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=master&status=$status&per_page=100")"
            jq -e \
              '(type == "array") and ([.[] | (.workflow_runs | type == "array")] | all) and
               ([.[].workflow_runs[]] | length <= 1000)' <<< "$runs" > /dev/null
            while IFS= read -r sibling_id; do
              [[ "$sibling_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$sibling_id" != "$GITHUB_RUN_ID" ]]
              sibling="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$sibling_id" 2>/dev/null || true)"
              if [[ -z "$sibling" ]] || ! jq -e \
                  --arg implementation_sha "$IMPLEMENTATION_SHA" \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --argjson run_id "$sibling_id" \
                  '.id == $run_id and
                   (.status == "queued" or .status == "in_progress") and
                   (.event == "repository_dispatch" or .event == "schedule" or
                    .event == "workflow_dispatch") and
                   .head_branch == "master" and .head_sha == $implementation_sha and
                   .path == ".github/workflows/visual-review-drain.yml" and
                   .head_repository.full_name == $repository' \
                  <<< "$sibling" > /dev/null; then
                continue
              fi
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$sibling_id/cancel" \
                2>/dev/null || true
            done < <(jq -r \
              --arg implementation_sha "$IMPLEMENTATION_SHA" \
              --argjson current_run_id "$GITHUB_RUN_ID" \
              '.[].workflow_runs[] |
               select(.id != $current_run_id and .head_sha == $implementation_sha) |
               .id' <<< "$runs")
          done

      - name: Publish the protected exact-policy verdict cache
        id: publish-verdict-cache
        if: >-
          always() && steps.guard.outputs.reviewable == 'true' &&
          steps.check.outputs.review_complete == 'true' &&
          steps.verdict-cache.outputs.policy_sha256 != '' &&
          steps.model.outputs.model_status == '0'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -er .review_mode curation-proof.json)" == reference-comparison ]]
          update_arguments=()
          if [[ -f visual-review-verdict-cache.input.json ]]; then
            update_arguments=(--existing-cache visual-review-verdict-cache.input.json)
          fi
          python3 "$RUNNER_TEMP/protected-reviewer/visual_review_cache.py" update \
            "${update_arguments[@]}" \
            --manifest review-input/visual-review-manifest.json \
            --report visual-review-report.json \
            --policy-sha256 "${{ steps.verdict-cache.outputs.policy_sha256 }}" \
            --output visual-review-verdict-cache.json
          printf 'artifact_name=visual-review-verdict-cache-%s\n' \
            "${{ steps.verdict-cache.outputs.policy_sha256 }}" >> "$GITHUB_OUTPUT"

      - name: Upload the protected exact-policy verdict cache
        id: verdict-cache-artifact
        if: always() && steps.publish-verdict-cache.outputs.artifact_name != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish-verdict-cache.outputs.artifact_name }}
          path: ${{ runner.temp }}/visual-review-capsule/visual-review-verdict-cache.json
          if-no-files-found: error
          retention-days: 7

      - name: Retire the consumed exact-policy verdict cache shards
        if: >-
          always() && steps.verdict-cache.outputs.restored == 'true' &&
          steps.verdict-cache-artifact.outputs.artifact-id != ''
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_id_list="${{ steps.verdict-cache.outputs.artifact_ids }}"
          new_id="${{ steps.verdict-cache-artifact.outputs.artifact-id }}"
          [[ "$old_id_list" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          [[ "$new_id" =~ ^[1-9][0-9]*$ ]]
          IFS=, read -r -a old_ids <<< "$old_id_list"
          for old_id in "${old_ids[@]}"; do
            [[ "$old_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$old_id" != "$new_id" ]]
            metadata_error="$(mktemp "$RUNNER_TEMP/verdict-cache-metadata.XXXXXX")"
            if ! metadata="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$old_id" \
                2>"$metadata_error")"; then
              if grep -Fq '(HTTP 404)' "$metadata_error"; then
                continue
              fi
              cat "$metadata_error" >&2
              exit 1
            fi
            jq -e \
              --arg name "visual-review-verdict-cache-${{ steps.verdict-cache.outputs.policy_sha256 }}" \
              --argjson artifact_id "$old_id" \
              '.id == $artifact_id and .name == $name and .expired == false' \
              <<< "$metadata" > /dev/null
            delete_error="$(mktemp "$RUNNER_TEMP/verdict-cache-delete.XXXXXX")"
            if ! gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$old_id" \
                2>"$delete_error"; then
              if grep -Fq '(HTTP 404)' "$delete_error"; then
                continue
              fi
              cat "$delete_error" >&2
              exit 1
            fi
          done

      - name: Retire superseded caches for obsolete review policies
        if: >-
          always() && steps.verdict-cache-artifact.outputs.artifact-id != ''
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_id="${{ steps.verdict-cache-artifact.outputs.artifact-id }}"
          current_name="${{ steps.publish-verdict-cache.outputs.artifact_name }}"
          [[ "$current_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$current_name" =~ ^visual-review-verdict-cache-[0-9a-f]{64}$ ]]
          # This is best-effort hygiene for seven-day cache shards. Only inspect the newest
          # bounded page; walking the repository-wide artifact history makes cleanup slower and
          # eventually impossible as ordinary E2E evidence grows.
          inventory="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
          jq -e \
            'type == "object" and (.artifacts | type == "array") and
             (.artifacts | length <= 100)' \
            <<< "$inventory" > /dev/null
          while IFS=$'\t' read -r stale_id stale_name stale_run_id; do
            [[ "$stale_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$stale_name" =~ ^visual-review-verdict-cache-[0-9a-f]{64}$ ]]
            [[ "$stale_run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$stale_id" != "$current_id" ]]
            stale_run="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$stale_run_id" \
              2>/dev/null || true)"
            if [[ -z "$stale_run" ]] || ! jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --argjson run_id "$stale_run_id" \
                '.id == $run_id and .status == "completed" and
                 (.conclusion == "success" or .conclusion == "failure") and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and
                 .path == ".github/workflows/visual-review-drain.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$stale_run" > /dev/null; then
              continue
            fi
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$stale_id"
          done < <(jq -r --arg current_name "$current_name" \
            '.artifacts[] |
             select(.expired == false and .name != $current_name and
               (.name | test("^visual-review-verdict-cache-[0-9a-f]{64}$"))) |
             [.id, .name, .workflow_run.id] | @tsv' <<< "$inventory")

      - name: Certify a clean synchronized 1.20.1 anchor
        id: certify
        if: steps.check.outcome == 'success'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/ci/github_api_retry.sh"
          printf 'certified=false\n' >> "$GITHUB_OUTPUT"
          proof=curation-proof.json
          if [[ "$(jq -er .review_mode "$proof")" != anchor-semantic ]]; then
            exit 0
          fi
          if ! jq -e \
              '(.master_source_sha | type == "string" and
                test("^[0-9a-f]{40}$")) and
               (.source_branch | type == "string" and
                test("^automation/sync/[A-Za-z0-9._/-]+$"))' \
              "$proof" > /dev/null; then
            # Pull-request and scheduled 1.20.1 reviews are semantic too, but only an exact
            # workflow-owned version port can release a cross-version synchronization wave.
            exit 0
          fi
          master_source_sha="$(jq -er \
            '.master_source_sha | select(type == "string" and
              test("^[0-9a-f]{40}$"))' "$proof")"
          anchor_source_sha="$(jq -er .source_sha "$proof")"
          source_branch="$(jq -er .source_branch "$proof")"
          source_run_id="$(jq -er .source_run_id "$proof")"
          implementation_sha="$(jq -er .implementation_sha "$proof")"
          [[ "$anchor_source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_branch" =~ ^automation/sync/[A-Za-z0-9._/-]+$ ]]
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$implementation_sha" =~ ^[0-9a-f]{40}$ ]]

          reference_identity="$(python3 "$GITHUB_WORKSPACE/e2e/visual_review.py" \
            --matrix "$GITHUB_WORKSPACE/release/release-matrix.json" \
            --reference-identity)"
          anchor_branch="$(jq -er .release_branch <<< "$reference_identity")"

          # The ordinary gate handler may still be completing the merge when model review ends.
          # Admit only the unique bot-owned anchor PR after GitHub records its merge commit.
          merged_pr=''
          for attempt in {1..60}; do
            associated="$(github_api_retry \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$anchor_source_sha/pulls?per_page=20")"
            merged_pr="$(jq -c \
              --arg anchor_branch "$anchor_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_branch "$source_branch" \
              --arg source_sha "$anchor_source_sha" \
              '[.[] | select(
                .base.ref == $anchor_branch and
                .base.repo.full_name == $repository and
                .head.ref == $source_branch and .head.sha == $source_sha and
                .head.repo.full_name == $repository and
                .user.login == "github-actions[bot]" and
                ([.labels[].name] | index("automated-version-sync")) != null and
                .merged_at != null and
                (.merge_commit_sha | type == "string" and
                  test("^[0-9a-f]{40}$")))] |
               if length == 1 then .[0] else empty end' <<< "$associated")"
            if [[ -n "$merged_pr" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$merged_pr"
          anchor_target_sha="$(jq -er .merge_commit_sha <<< "$merged_pr")"
          [[ "$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/$anchor_branch" \
            --jq .commit.sha)" == "$anchor_target_sha" ]]

          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "$master_source_sha" "$anchor_source_sha" "$anchor_target_sha"
          read -r -a source_commit <<< "$(git -C "$GITHUB_WORKSPACE" \
            rev-list --parents -n 1 "$anchor_source_sha")"
          [[ "${#source_commit[@]}" -eq 3 ]]
          [[ "${source_commit[2]}" == "$master_source_sha" ]]
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$master_source_sha" "$implementation_sha"
          read -r -a target_commit <<< "$(git -C "$GITHUB_WORKSPACE" \
            rev-list --parents -n 1 "$anchor_target_sha")"
          [[ "${#target_commit[@]}" -eq 3 ]]
          [[ "${target_commit[1]}" == "$anchor_source_sha" \
            || "${target_commit[2]}" == "$anchor_source_sha" ]]
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse \
            "$anchor_source_sha^{tree}")" == \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse "$anchor_target_sha^{tree}")" ]]

          certificate=visual-anchor-certification.json
          python3 "$GITHUB_WORKSPACE/scripts/ci/visual_anchor_certification.py" create \
            --proof "$proof" \
            --manifest review-input/visual-review-manifest.json \
            --report visual-review-report.json \
            --anchor-branch "$anchor_branch" \
            --anchor-target-sha "$anchor_target_sha" \
            --output "$certificate" \
            > "$RUNNER_TEMP/visual-anchor-certificate-summary.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/visual_anchor_certification.py" verify \
            --certificate "$certificate" \
            --expected-master-sha "$master_source_sha" \
            --expected-anchor-branch "$anchor_branch" \
            > /dev/null
          artifact_name="visual-anchor-certification-$master_source_sha"
          printf 'anchor_source_sha=%s\n' "$anchor_source_sha" >> "$GITHUB_OUTPUT"
          printf 'anchor_target_sha=%s\n' "$anchor_target_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'master_source_sha=%s\n' "$master_source_sha" >> "$GITHUB_OUTPUT"
          printf 'certified=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload the exact semantic anchor certificate
        id: anchor-certificate
        if: steps.certify.outputs.certified == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.certify.outputs.artifact_name }}
          path: ${{ runner.temp }}/visual-review-capsule/visual-anchor-certification.json
          if-no-files-found: error
          retention-days: 90

      - name: Classify a failed attempt without provider text
        id: classify
        if: >-
          always() && steps.guard.outputs.reviewable == 'true' &&
          steps.capsule.outputs.missing != 'true'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.check.outputs.review_complete }}" == true ]]; then
            printf 'failure_category=\n' >> "$GITHUB_OUTPUT"
            printf 'failure_transient=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          capsule="$RUNNER_TEMP/visual-review-capsule"
          mkdir -p "$capsule"
          failure="$capsule/visual-review-failure.json"
          if [[ ! -f "$failure" ]]; then
            jq -n \
              '{schema_version:1,category:"protected_validation",
                stage:"drain",transient:false}' \
              > "$failure"
          fi
          category="$(jq -er \
            'select(.schema_version == 1 and
              (.category | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
              (.stage | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
              (.transient | type == "boolean")) | .category' \
            "$failure")"
          transient="$(jq -er '.transient | if . then "true" else "false" end' \
            "$failure")"
          printf 'failure_category=%s\n' "$category" >> "$GITHUB_OUTPUT"
          printf 'failure_transient=%s\n' "$transient" >> "$GITHUB_OUTPUT"

      - name: Bind a clean automatic release identity for compatibility testing
        id: compatibility-release
        if: >-
          steps.check.outcome == 'success' &&
          steps.check.outputs.review_complete == 'true'
        working-directory: ${{ runner.temp }}/visual-review-capsule
        shell: bash
        run: |
          set -euo pipefail
          printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
          proof=curation-proof.json
          report=visual-review-report.json
          test -s "$proof" -a -s "$report"
          jq -e 'length > 0 and all(.[];
            .semantic_valid == true and .defect == false and
            (.matches_reference == null or .matches_reference == true))' \
            "$report" > /dev/null
          compatibility_required="$(jq -er \
            '.compatibility_impact.compatibility_required |
              if . then "true" else "false" end' "$proof")"
          if [[ "$compatibility_required" != true ]]; then
            printf 'The authenticated release diff cannot affect product/mod compatibility; compatibility wave skipped.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source_branch="$(jq -er \
            '.source_branch | select(type == "string" and
              test("^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$"))' "$proof")"
          if [[ ! "$source_branch" =~ ^automation/sync/[A-Za-z0-9._/-]+$ ]]; then
            printf 'A clean advisory or scheduled anchor has no automatic release identity.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source_run_id="$(jq -er \
            '.source_run_id | select(type == "number" and . > 0)' "$proof")"
          source_sha="$(jq -er \
            '.source_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$proof")"
          printf 'source_branch=%s\n' "$source_branch" >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'eligible=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload the source-bound normalized report
        id: normalized-report
        if: always() && steps.check.outputs.review_complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-${{ needs.select.outputs.source_run_id }}
          path: |
            ${{ runner.temp }}/visual-review-capsule/curation-proof.json
            ${{ runner.temp }}/visual-review-capsule/review-input/visual-review-manifest.json
            ${{ runner.temp }}/visual-review-capsule/visual-review-report.json
            ${{ runner.temp }}/visual-review-capsule/visual-review-completion.json
          if-no-files-found: error
          # Match the durable input's recovery window. If GitHub rate-limits the exact cleanup,
          # this authenticated marker must outlive that input so it can never become eligible again.
          retention-days: 7

      - name: Upload only a sanitized attempt marker
        if: >-
          always() && steps.guard.outputs.reviewable == 'true' &&
          steps.check.outputs.review_complete != 'true' &&
          steps.classify.outputs.failure_category != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-attempt-${{ needs.select.outputs.source_run_id }}
          path: ${{ runner.temp }}/visual-review-capsule/visual-review-failure.json
          if-no-files-found: error
          retention-days: 1

      - name: Open the shared Claude circuit after a quota rejection
        if: >-
          always() && steps.classify.outputs.failure_category ==
          'quota_or_rate_limit'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-capacity-pause
          path: ${{ runner.temp }}/visual-review-capsule/visual-review-failure.json
          if-no-files-found: error
          retention-days: 1

  cleanup:
    name: Delete one settled queue entry
    needs:
      - select
      - review
    if: >-
      always() && needs.select.outputs.eligible == 'true' &&
      (needs.review.outputs.review_complete == 'true' ||
       needs.review.outputs.already_reviewed == 'true' ||
       needs.review.outputs.capsule_missing == 'true' ||
       (needs.review.outputs.failure_category != '' &&
        needs.review.outputs.failure_transient == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Reauthenticate and delete only the selected queue artifact
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.select.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.select.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ needs.select.outputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_NAME" =~ \
            ^visual-review-input-[1-9][0-9]*(-[0-9a-f]{40})?$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata_error="$(mktemp "$RUNNER_TEMP/visual-review-metadata.XXXXXX")"
          metadata=""
          for attempt in 1 2 3; do
            : > "$metadata_error"
            if metadata="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
                2>"$metadata_error")"; then
              break
            fi
            if grep -Fq '(HTTP 404)' "$metadata_error"; then
              exit 0
            fi
            # The normalized report already makes this source ineligible. Retaining its bounded
            # input until Actions retention expires is safe when GitHub's installation quota is
            # exhausted; cleanup is housekeeping, not review correctness.
            if grep -Fq 'API rate limit exceeded' "$metadata_error"; then
              echo "::warning::GitHub API quota exhausted; queue cleanup deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$metadata_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$metadata_error" >&2
            exit 1
          done
          [[ -n "$metadata" ]]
          jq -e \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            --arg name "$ARTIFACT_NAME" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$ARTIFACT_RUN_ID" \
            '.id == $artifact_id and .name == $name and .digest == $digest and
             .expired == false and .workflow_run.id == $run_id' \
            <<< "$metadata" > /dev/null
          delete_error="$(mktemp "$RUNNER_TEMP/visual-review-delete.XXXXXX")"
          for attempt in 1 2 3; do
            : > "$delete_error"
            if gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
                2>"$delete_error"; then
              exit 0
            fi
            # Another authenticated cleanup may have settled the exact same immutable artifact
            # after the metadata read. Missing is the desired postcondition.
            if grep -Fq '(HTTP 404)' "$delete_error"; then
              exit 0
            fi
            if grep -Fq 'API rate limit exceeded' "$delete_error"; then
              echo "::warning::GitHub API quota exhausted; queue cleanup deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$delete_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$delete_error" >&2
            exit 1
          done

  release-mod-compatibility:
    name: Release the authenticated mod compatibility wave
    needs:
      - select
      - review
      - cleanup
    if: >-
      always() && needs.cleanup.result == 'success' &&
      needs.review.outputs.compatibility_eligible == 'true' &&
      needs.review.outputs.normalized_report_artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the protected compatibility release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate the merge, normalized report, and exact release tree
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          REVIEW_ARTIFACT_ID: ${{ needs.review.outputs.normalized_report_artifact_id }}
          SOURCE_BRANCH: ${{ needs.review.outputs.compatibility_source_branch }}
          SOURCE_RUN_ID: ${{ needs.review.outputs.compatibility_source_run_id }}
          SOURCE_SHA: ${{ needs.review.outputs.compatibility_source_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$REVIEW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^automation/sync/[A-Za-z0-9._/-]+$ ]]

          source_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg branch "$SOURCE_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and .status == "completed" and .conclusion == "success" and
             .event == "workflow_dispatch" and .head_branch == $branch and
             .head_sha == $sha and .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$source_run" > /dev/null

          associated=''
          for attempt in {1..60}; do
            associated="$(github_api_retry \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls?per_page=20")"
            if jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg source_branch "$SOURCE_BRANCH" \
                --arg source_sha "$SOURCE_SHA" \
                '[.[] | select(
                  .head.ref == $source_branch and .head.sha == $source_sha and
                  .head.repo.full_name == $repository and
                  .base.repo.full_name == $repository and
                  .user.login == "github-actions[bot]" and
                  ([.labels[].name] | index("automated-version-sync")) != null and
                  .merged_at != null and
                  (.merge_commit_sha | type == "string" and
                    test("^[0-9a-f]{40}$")))] | length == 1' \
                <<< "$associated" > /dev/null; then
              break
            fi
            sleep 5
          done
          merged_pr="$(jq -cer \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            '[.[] | select(
              .head.ref == $source_branch and .head.sha == $source_sha and
              .head.repo.full_name == $repository and
              .base.repo.full_name == $repository and
              .user.login == "github-actions[bot]" and
              ([.labels[].name] | index("automated-version-sync")) != null and
              .merged_at != null and
              (.merge_commit_sha | type == "string" and
                test("^[0-9a-f]{40}$")))] |
             select(length == 1) | .[0]' <<< "$associated")"
          target_branch="$(jq -er .base.ref <<< "$merged_pr")"
          target_sha="$(jq -er .merge_commit_sha <<< "$merged_pr")"
          python3 scripts/release/version_branches.py \
            --target "$target_branch" > /dev/null

          # Never launch expensive compatibility sessions for an already superseded release.
          current_target_sha="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/$target_branch" --jq .commit.sha)"
          if [[ "$current_target_sha" != "$target_sha" ]]; then
            printf 'Release `%s` advanced from `%s` to `%s`; compatibility wave skipped.\n' \
              "$target_branch" "$target_sha" "$current_target_sha" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags origin "$SOURCE_SHA" "$target_sha"
          git merge-base --is-ancestor "$SOURCE_SHA" "$target_sha"
          [[ "$(git rev-parse "$SOURCE_SHA^{tree}")" == \
             "$(git rev-parse "$target_sha^{tree}")" ]]

          report_name="visual-review-$SOURCE_RUN_ID"
          report_metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT_ID")"
          report_digest="$(jq -er \
            '.digest | select(type == "string" and
              test("^sha256:[0-9a-f]{64}$"))' <<< "$report_metadata")"
          report_size="$(jq -er \
            '.size_in_bytes | select(type == "number" and . > 0 and . <= 16777216)' \
            <<< "$report_metadata")"
          jq -e \
            --arg name "$report_name" \
            --arg sha "$GITHUB_SHA" \
            --argjson artifact_id "$REVIEW_ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $artifact_id and .name == $name and .expired == false and
             .workflow_run.id == $run_id and .workflow_run.head_branch == "master" and
             .workflow_run.head_sha == $sha' \
            <<< "$report_metadata" > /dev/null

          payload="$RUNNER_TEMP/mod-compatibility-dispatch.json"
          jq -n \
            --arg review_artifact_digest "$report_digest" \
            --arg review_artifact_id "$REVIEW_ARTIFACT_ID" \
            --arg review_artifact_name "$report_name" \
            --arg review_artifact_run_id "$GITHUB_RUN_ID" \
            --arg review_artifact_size "$report_size" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target_branch "$target_branch" \
            --arg target_sha "$target_sha" \
            '{event_type:"mod-compatibility-requested",client_payload:{
              source_run_id:$source_run_id,source_branch:$source_branch,
              source_sha:$source_sha,target_branch:$target_branch,target_sha:$target_sha,
              review_artifact_id:$review_artifact_id,
              review_artifact_name:$review_artifact_name,
              review_artifact_run_id:$review_artifact_run_id,
              review_artifact_size:$review_artifact_size,
              review_artifact_digest:$review_artifact_digest}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
          printf 'Released compatibility wave for `%s` at `%s`.\n' \
            "$target_branch" "$target_sha" >> "$GITHUB_STEP_SUMMARY"

  release-anchor:
    name: Release the certified cross-version wave
    needs:
      - review
      - cleanup
    if: >-
      always() && needs.cleanup.result == 'success' &&
      needs.review.outputs.certificate_artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write

    steps:
      - name: Authenticate and publish the semantic certificate identity
        shell: bash
        env:
          ANCHOR_SOURCE_SHA: ${{ needs.review.outputs.certificate_anchor_source_sha }}
          ANCHOR_TARGET_SHA: ${{ needs.review.outputs.certificate_anchor_target_sha }}
          ARTIFACT_ID: ${{ needs.review.outputs.certificate_artifact_id }}
          ARTIFACT_NAME: ${{ needs.review.outputs.certificate_artifact_name }}
          GH_TOKEN: ${{ github.token }}
          MASTER_SOURCE_SHA: ${{ needs.review.outputs.certificate_master_sha }}
        run: |
          set -euo pipefail
          github_api_retry() {
            local api_status attempt delay now output reset_at skew wait_seconds
            delay=5
            for attempt in {1..4}; do
              output=''
              api_status=0
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                api_status=$?
              fi
              if ! grep -Eqi \
                  'API rate limit exceeded|secondary rate limit|HTTP (408|429|5[0-9][0-9])|connection (reset|refused)|timed out|timeout|temporary failure|TLS handshake|unexpected EOF' \
                  <<< "$output" || (( attempt == 4 )); then
                printf '%s\n' "$output" >&2
                return "$api_status"
              fi
              wait_seconds="$delay"
              if grep -Fqi 'API rate limit exceeded' <<< "$output"; then
                reset_at="$(gh api rate_limit --jq .resources.core.reset \
                  2>/dev/null || true)"
                if [[ "$reset_at" =~ ^[1-9][0-9]*$ ]]; then
                  now="$(date +%s)"
                  skew=$(( (GITHUB_RUN_ID + attempt) % 5 ))
                  wait_seconds=$(( reset_at - now + 2 + skew ))
                  (( wait_seconds > 0 )) || wait_seconds=1
                  if (( wait_seconds > 3700 )); then
                    printf '%s\n' "$output" >&2
                    return "$api_status"
                  fi
                else
                  wait_seconds=60
                fi
              elif grep -Eqi 'secondary rate limit|HTTP 429' <<< "$output"; then
                (( wait_seconds >= 60 )) || wait_seconds=60
              fi
              sleep "$wait_seconds"
              delay=$(( delay < 60 ? delay * 2 : 60 ))
              (( delay <= 60 )) || delay=60
            done
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MASTER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ANCHOR_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ANCHOR_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_NAME" == "visual-anchor-certification-$MASTER_SOURCE_SHA" ]]
          metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          digest="$(jq -er \
            '.digest | select(type == "string" and
              test("^sha256:[0-9a-f]{64}$"))' <<< "$metadata")"
          size="$(jq -er .size_in_bytes <<< "$metadata")"
          jq -e \
            --arg name "$ARTIFACT_NAME" \
            --arg sha "$GITHUB_SHA" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $artifact_id and .name == $name and .expired == false and
             (.size_in_bytes | type == "number" and . > 0 and . <= 1048576) and
             .workflow_run.id == $run_id and .workflow_run.head_branch == "master" and
             .workflow_run.head_sha == $sha' \
            <<< "$metadata" > /dev/null
          payload="$RUNNER_TEMP/visual-anchor-certified.json"
          jq -n \
            --arg anchor_source_sha "$ANCHOR_SOURCE_SHA" \
            --arg anchor_target_sha "$ANCHOR_TARGET_SHA" \
            --arg artifact_digest "$digest" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_run_id "$GITHUB_RUN_ID" \
            --arg artifact_size "$size" \
            --arg master_source_sha "$MASTER_SOURCE_SHA" \
            '{event_type:"visual-anchor-certified",client_payload:{
              master_source_sha:$master_source_sha,
              anchor_source_sha:$anchor_source_sha,
              anchor_target_sha:$anchor_target_sha,
              artifact_id:$artifact_id,artifact_name:$artifact_name,
              artifact_run_id:$artifact_run_id,
              artifact_size:$artifact_size,artifact_digest:$artifact_digest}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null

  continue:
    name: Wake the next queued review
    needs:
      - select
      - review
      - cleanup
    if: >-
      always() && needs.select.outputs.eligible == 'true' &&
      ((needs.cleanup.result == 'success' &&
        (needs.review.outputs.review_complete == 'true' ||
         needs.review.outputs.already_reviewed == 'true' ||
         (needs.review.outputs.failure_category != '' &&
          needs.review.outputs.failure_transient == 'false'))) ||
       needs.review.outputs.failure_category != '' ||
       needs.review.outputs.cooling == 'true') &&
      needs.review.outputs.wave_blocked != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch another independently selected drain unless this wave is blocked
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.select.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.select.outputs.artifact_name }}
          GENERATION_SHA: ${{ needs.select.outputs.generation_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_NAME" =~ ^visual-review-input-[1-9][0-9]*$ \
            || "$ARTIFACT_NAME" =~ \
              ^visual-review-input-[1-9][0-9]*-$GENERATION_SHA$ ]]
          payload="$(mktemp "$RUNNER_TEMP/visual-review-continuation.XXXXXX")"
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg generation_sha "$GENERATION_SHA" \
            '{event_type:"visual-review-drain-requested",client_payload:{
              artifact_id:$artifact_id,artifact_name:$artifact_name,
              generation_sha:$generation_sha}}' \
            > "$payload"
          dispatch_error="$(mktemp "$RUNNER_TEMP/visual-review-dispatch.XXXXXX")"
          for attempt in 1 2 3; do
            : > "$dispatch_error"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
                --input "$payload" 2>"$dispatch_error"; then
              exit 0
            fi
            # Every curated capsule receives an exact wake when it is enqueued, and the scheduled
            # sweep can recover a coalesced wake. This continuation is deliberately redundant, so
            # an exhausted installation quota must not turn a completed clean review red.
            if grep -Fq 'API rate limit exceeded' "$dispatch_error"; then
              echo "::warning::GitHub API quota exhausted; queue continuation deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$dispatch_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$dispatch_error" >&2
            exit 1
          done
