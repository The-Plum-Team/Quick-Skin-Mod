name: Mod compatibility E2E

# A clean, normalized base visual review requests this second wave. The protected admission job
# reauthenticates that report, the tested source bytes, and the exact merged release tree before any
# external mod is downloaded. Preparation fetches each clean baseline once with reset-aware retries;
# every applicable mod/loader lane then starts in parallel from that authenticated local copy. The
# run explicitly wakes its separate AI reviewer because GITHUB_TOKEN-created runs do not emit a
# reliable recursive workflow_run event.
on:
  repository_dispatch:
    types:
      - mod-compatibility-requested

permissions: {}

concurrency:
  group: mod-compatibility-${{ github.event.client_payload.target_sha || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa

jobs:
  admit:
    name: Authenticate the clean base release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      base_matrix_kind: ${{ steps.admit.outputs.base_matrix_kind }}
      source_branch: ${{ steps.admit.outputs.source_branch }}
      source_run_id: ${{ steps.admit.outputs.source_run_id }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      target_branch: ${{ steps.admit.outputs.target_branch }}
      target_sha: ${{ steps.admit.outputs.target_sha }}

    steps:
      - name: Check out the protected admission policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Authenticate the normalized report and exact merged tree
        id: admit
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          REVIEW_ARTIFACT_DIGEST: ${{ github.event.client_payload.review_artifact_digest }}
          REVIEW_ARTIFACT_ID: ${{ github.event.client_payload.review_artifact_id }}
          REVIEW_ARTIFACT_NAME: ${{ github.event.client_payload.review_artifact_name }}
          REVIEW_ARTIFACT_RUN_ID: ${{ github.event.client_payload.review_artifact_run_id }}
          REVIEW_ARTIFACT_SIZE: ${{ github.event.client_payload.review_artifact_size }}
          SOURCE_BRANCH: ${{ github.event.client_payload.source_branch }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
          TARGET_SHA: ${{ github.event.client_payload.target_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$ ]]
          [[ "$REVIEW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( REVIEW_ARTIFACT_SIZE <= 16777216 ))
          [[ "$REVIEW_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVIEW_ARTIFACT_NAME" == "visual-review-$SOURCE_RUN_ID" ]]
          python3 scripts/release/version_branches.py --target "$TARGET_BRANCH" > /dev/null

          source_run="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg branch "$SOURCE_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and .status == "completed" and .conclusion == "success" and
             (.event == "pull_request" or .event == "schedule" or
              .event == "workflow_dispatch") and .head_branch == $branch and
             .head_sha == $sha and .path == ".github/workflows/on-demand-e2e.yml" and
             .head_repository.full_name == $repository' \
            <<< "$source_run" > /dev/null
          case "$(jq -r .event <<< "$source_run")" in
            schedule) base_matrix_kind=native-anchors ;;
            pull_request|workflow_dispatch) base_matrix_kind=pr-anchors ;;
            *) exit 1 ;;
          esac

          [[ "$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" \
            --jq .commit.sha)" == "$TARGET_SHA" ]]
          git fetch --no-tags origin "$SOURCE_SHA" "$TARGET_SHA"
          [[ "$(git rev-parse "$SOURCE_SHA^{tree}")" == \
             "$(git rev-parse "$TARGET_SHA^{tree}")" ]]
          if [[ "$SOURCE_SHA" != "$TARGET_SHA" ]]; then
            [[ "$SOURCE_BRANCH" == automation/sync/* ]]
            associated="$(github_api_retry \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls?per_page=20")"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_branch "$SOURCE_BRANCH" \
              --arg source_sha "$SOURCE_SHA" \
              --arg target_branch "$TARGET_BRANCH" \
              --arg target_sha "$TARGET_SHA" \
              '[.[] | select(
                .base.ref == $target_branch and .base.repo.full_name == $repository and
                .head.ref == $source_branch and .head.sha == $source_sha and
                .head.repo.full_name == $repository and
                .user.login == "github-actions[bot]" and
                ([.labels[].name] | index("automated-version-sync")) != null and
                .merged_at != null and .merge_commit_sha == $target_sha)] | length == 1' \
              <<< "$associated" > /dev/null
          else
            [[ "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]
          fi

          review_metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT_ID")"
          jq -e \
            --arg digest "$REVIEW_ARTIFACT_DIGEST" \
            --arg name "$REVIEW_ARTIFACT_NAME" \
            --argjson artifact_id "$REVIEW_ARTIFACT_ID" \
            --argjson run_id "$REVIEW_ARTIFACT_RUN_ID" \
            --argjson size "$REVIEW_ARTIFACT_SIZE" \
            '.id == $artifact_id and .name == $name and .digest == $digest and
             .size_in_bytes == $size and .expired == false and
             .workflow_run.id == $run_id' \
            <<< "$review_metadata" > /dev/null
          review_owner=''
          for attempt in {1..120}; do
            review_owner="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_ARTIFACT_RUN_ID")"
            if [[ "$(jq -r .status <<< "$review_owner")" == completed ]]; then
              break
            fi
            sleep 5
          done
          review_owner_sha="$(jq -er \
            '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<< "$review_owner")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$REVIEW_ARTIFACT_RUN_ID" \
            '.id == $run_id and .status == "completed" and .conclusion == "success" and
             (.event == "repository_dispatch" or .event == "schedule" or
              .event == "workflow_dispatch") and .head_branch == "master" and
             .path == ".github/workflows/visual-review-drain.yml" and
             .head_repository.full_name == $repository' \
            <<< "$review_owner" > /dev/null
          git merge-base --is-ancestor "$review_owner_sha" "$GITHUB_SHA"

          archive="$RUNNER_TEMP/base-visual-review.zip"
          github_api_retry_to_file "$archive" \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT_ID/zip"
          [[ "$(stat -c %s "$archive")" == "$REVIEW_ARTIFACT_SIZE" ]]
          [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" == \
             "$REVIEW_ARTIFACT_DIGEST" ]]
          review_root="$RUNNER_TEMP/base-visual-review"
          python3 scripts/ci/bounded_zip.py "$archive" "$review_root" \
            --max-archive-bytes 16777216 \
            --max-entries 4 \
            --max-total-bytes 16777216 \
            --max-file-bytes 10485760 \
            --max-compression-ratio 200 > /dev/null
          rm -f -- "$archive"
          proof="$review_root/curation-proof.json"
          # upload-artifact preserves the curated directory because the handoff also
          # contains the root-level proof. Keep this consumer aligned with that exact
          # four-file producer layout.
          manifest="$review_root/review-input/visual-review-manifest.json"
          report="$review_root/visual-review-report.json"
          completion="$review_root/visual-review-completion.json"
          test -f "$proof" -a -f "$manifest" -a -f "$report" -a -f "$completion"
          jq -e \
            --arg branch "$SOURCE_BRANCH" \
            --arg sha "$SOURCE_SHA" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.source_run_id == $run_id and .source_branch == $branch and
             .source_sha == $sha and
             (.review_mode == "anchor-semantic" or
              .review_mode == "reference-comparison")' \
            "$proof" > /dev/null
          jq -e \
            --argjson frames "$(jq length "$manifest")" \
            '(keys | sort) == (["manifest_frames", "report_verdicts",
              "schema_version", "state"] | sort) and .schema_version == 1 and
             .state == "complete" and .manifest_frames == $frames and
             .report_verdicts == $frames' "$completion" > /dev/null
          report_arguments=(
            --manifest "$manifest"
            --report "$report"
          )
          if [[ "$(jq -er .review_mode "$proof")" == reference-comparison ]]; then
            report_arguments+=(--require-paired)
          fi
          python3 e2e/check_visual_review.py "${report_arguments[@]}"
          jq -e 'length > 0 and all(.[];
            .semantic_valid == true and .defect == false and
            (.matches_reference == null or .matches_reference == true))' \
            "$report" > /dev/null

          bundle_metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?name=e2e-input-bundle&per_page=100")"
          jq -e \
            --argjson run_id "$SOURCE_RUN_ID" \
            '[.artifacts[] | select(.name == "e2e-input-bundle" and
              .expired == false and .workflow_run.id == $run_id and
              (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              ((.size_in_bytes | type) == "number" and .size_in_bytes > 0))] |
             length == 1' <<< "$bundle_metadata" > /dev/null

          printf 'base_matrix_kind=%s\n' "$base_matrix_kind" >> "$GITHUB_OUTPUT"
          printf 'source_branch=%s\n' "$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'target_branch=%s\n' "$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  prepare:
    name: Resolve immutable mod lanes
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_name: ${{ steps.plan.outputs.bundle_name }}
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Check out the exact tested source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reverify the source-bound bundle and resolve every applicable lane
        id: plan
        shell: bash
        env:
          BASE_MATRIX_KIND: ${{ needs.admit.outputs.base_matrix_kind }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.admit.outputs.source_branch }}
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          TARGET_BRANCH: ${{ needs.admit.outputs.target_branch }}
          TARGET_SHA: ${{ needs.admit.outputs.target_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$BASE_MATRIX_KIND" == pr-anchors || \
             "$BASE_MATRIX_KIND" == native-anchors ]]

          source_artifacts="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          bundle="$(jq -cer \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '[.artifacts[] | select(
              .name == "e2e-input-bundle" and .expired == false and
              .workflow_run.id == $source_run_id and
              ((.id | type) == "number" and .id > 0) and
              (.digest | type == "string" and
                test("^sha256:[0-9a-f]{64}$")) and
              ((.size_in_bytes | type) == "number" and
                .size_in_bytes > 0 and .size_in_bytes <= 536870912))] |
             if length == 1 then .[0]
             else error("production bundle identity is not unique") end' \
            <<< "$source_artifacts")"
          IFS=$'\t' read -r bundle_id bundle_size bundle_digest < <(
            jq -r '[.id,.size_in_bytes,.digest] | @tsv' <<< "$bundle"
          )
          [[ "$bundle_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$bundle_size" =~ ^[1-9][0-9]*$ ]]
          (( bundle_size <= 536870912 ))
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bundle_metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$bundle_id")"
          jq -e \
            --arg digest "$bundle_digest" \
            --argjson artifact_id "$bundle_id" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --argjson size "$bundle_size" \
            '.id == $artifact_id and .name == "e2e-input-bundle" and
             .digest == $digest and .size_in_bytes == $size and
             .expired == false and .workflow_run.id == $run_id' \
            <<< "$bundle_metadata" > /dev/null
          bundle_archive="$RUNNER_TEMP/e2e-input-bundle.zip"
          github_api_retry_to_file "$bundle_archive" \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$bundle_id/zip"
          [[ "$(stat -c %s "$bundle_archive")" == "$bundle_size" ]]
          [[ "sha256:$(sha256sum "$bundle_archive" | cut -d ' ' -f 1)" == \
             "$bundle_digest" ]]
          mkdir -p build
          python3 scripts/ci/bounded_zip.py \
            "$bundle_archive" build/release \
            --max-archive-bytes 536870912 \
            --max-entries 512 \
            --max-total-bytes 536870912 \
            --max-file-bytes 67108864 \
            --max-compression-ratio 200 > /dev/null
          rm -f -- "$bundle_archive"
          GITHUB_SHA="$SOURCE_SHA" \
            python3 scripts/release/verify_release.py --verify-staged
          python3 e2e/mod_compatibility.py --plan \
            --base-matrix-kind "$BASE_MATRIX_KIND" \
            > "$RUNNER_TEMP/compatibility-plan.raw.json"
          jq \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg target_sha "$TARGET_SHA" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '. + {source_run_id:$source_run_id,source_branch:$source_branch,
              source_sha:$source_sha,target_branch:$target_branch,target_sha:$target_sha}' \
            "$RUNNER_TEMP/compatibility-plan.raw.json" \
            > "$RUNNER_TEMP/mod-compatibility-plan.json"
          jq -e \
            --arg base_matrix_kind "$BASE_MATRIX_KIND" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg target_sha "$TARGET_SHA" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '.schema_version == 1 and .release_branch == $target_branch and
             .base_matrix_kind == $base_matrix_kind and
             .source_run_id == $source_run_id and .source_branch == $source_branch and
             .source_sha == $source_sha and .target_branch == $target_branch and
             .target_sha == $target_sha and
             (.compatibility_contract_sha256 | type == "string" and
              test("^[0-9a-f]{64}$")) and
             (.runnable | type == "array" and length <= 64) and
             (.not_applicable | type == "array" and length <= 64) and
             (.compatibility_contract_sha256 as $lock |
              all(.runnable[];
                (.id | type == "string" and test("^[a-z0-9][a-z0-9_-]{0,255}$")) and
                (.artifact_node | type == "string" and
                  test("^[a-z0-9][a-z0-9.-]{0,127}$")) and
                (.runtime_version | type == "string" and
                  test("^[0-9]+([.][0-9]+)+$")) and
                (.loader == "fabric" or .loader == "forge" or
                  .loader == "neoforge") and
                (.compatibility_mod | type == "string" and
                  test("^[a-z][a-z0-9-]{1,63}$")) and
                (.compatibility_name | type == "string" and
                  test("^[A-Za-z0-9][A-Za-z0-9 ._+-]{0,127}$")) and
                (.base_evidence_name | type == "string" and
                  test("^packaged-e2e-[a-z0-9_-]{1,255}$") and
                  (if $base_matrix_kind == "pr-anchors" then
                     endswith("--pr-behavior")
                   else endswith("--scheduled-behavior") end)) and
                .compatibility_contract_sha256 == $lock))' \
             "$RUNNER_TEMP/mod-compatibility-plan.json" > /dev/null
          baseline_artifacts="$(jq -cer \
            --argjson artifacts "$source_artifacts" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '([.runnable[].base_evidence_name] | unique) as $names |
             [$names[] as $name |
               ([$artifacts.artifacts[] | select(
                 .name == $name and .expired == false and
                 .workflow_run.id == $source_run_id and
                 ((.id | type) == "number" and .id > 0) and
                 (.digest | type == "string" and
                  test("^sha256:[0-9a-f]{64}$")) and
                 ((.size_in_bytes | type) == "number" and
                  .size_in_bytes > 0 and .size_in_bytes <= 536870912))] |
                if length == 1 then .[0] |
                  {id,name,size_in_bytes,digest,expired,
                   workflow_run:{id:.workflow_run.id}}
                else error("baseline artifact identity is not unique") end)]' \
            "$RUNNER_TEMP/mod-compatibility-plan.json")"
          # Keep the original authenticated ZIP bytes inside the shared input bundle. This avoids
          # one cross-run REST download per mod lane without weakening digest or extraction checks.
          baseline_root=build/release/compatibility-baselines
          mkdir -p "$baseline_root"
          jq -n \
            --argjson artifacts "$baseline_artifacts" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '{schema_version:1,source_run_id:$source_run_id,artifacts:$artifacts}' \
            > "$baseline_root/inventory.json"
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size artifact_digest; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_name" =~ ^packaged-e2e-[a-z0-9_-]{1,255}$ ]]
            [[ "$artifact_size" =~ ^[1-9][0-9]*$ ]]
            (( artifact_size <= 536870912 ))
            [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            metadata="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            jq -e \
              --arg digest "$artifact_digest" \
              --arg name "$artifact_name" \
              --argjson artifact_id "$artifact_id" \
              --argjson run_id "$SOURCE_RUN_ID" \
              --argjson size "$artifact_size" \
              '.id == $artifact_id and .name == $name and .digest == $digest and
               .size_in_bytes == $size and .expired == false and
               .workflow_run.id == $run_id' <<< "$metadata" > /dev/null
            archive="$baseline_root/$artifact_id.zip"
            github_api_retry_to_file "$archive" \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            [[ "$(stat -c %s "$archive")" == "$artifact_size" ]]
            [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" == \
               "$artifact_digest" ]]
          done < <(
            jq -r '.[] | [.id,.name,.size_in_bytes,.digest] | @tsv' \
              <<< "$baseline_artifacts"
          )
          matrix="$(jq -c \
            --argjson artifacts "$baseline_artifacts" \
            '{include:[.runnable[] as $lane |
              ($artifacts[] | select(.name == $lane.base_evidence_name)) as $artifact |
              $lane + {base_artifact:{id:$artifact.id,name:$artifact.name,
                size_in_bytes:$artifact.size_in_bytes,digest:$artifact.digest,
                run_id:$artifact.workflow_run.id}}]}' \
            "$RUNNER_TEMP/mod-compatibility-plan.json")"
          count="$(jq '.runnable | length' "$RUNNER_TEMP/mod-compatibility-plan.json")"
          [[ "$count" =~ ^[0-9]+$ ]]
          bundle_name="mod-compatibility-input-$SOURCE_RUN_ID"
          printf 'bundle_name=%s\n' "$bundle_name" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          {
            printf '## Mod compatibility plan\n\n'
            printf '%s runnable lanes; %s explicit N/A lanes.\n\n' \
              "$count" "$(jq '.not_applicable | length' \
                "$RUNNER_TEMP/mod-compatibility-plan.json")"
            jq -r '.not_applicable[]? | "- N/A `\(.artifact_node)` / `\(.mod)`: \(.reason)"' \
              "$RUNNER_TEMP/mod-compatibility-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the authenticated compatibility plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-plan
          path: ${{ runner.temp }}/mod-compatibility-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Re-publish the exact source bundle for parallel consumers
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.bundle_name }}
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compatibility-e2e:
    name: ${{ matrix.artifact_node }} / ${{ matrix.compatibility_name }}
    needs:
      - admit
      - prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out exact tested runtime code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          persist-credentials: false

      - name: Install Python for the protected CPM fixture
        if: matrix.compatibility_mod == 'cpm'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Materialize the protected CPM fixture
        if: matrix.compatibility_mod == 'cpm'
        shell: bash
        env:
          QSM_E2E_CPM_FIXTURE_GZIP_B64_1: ${{ secrets.QSM_E2E_CPM_FIXTURE_GZIP_B64_1 }}
          QSM_E2E_CPM_FIXTURE_GZIP_B64_2: ${{ secrets.QSM_E2E_CPM_FIXTURE_GZIP_B64_2 }}
          QSM_E2E_CPM_FIXTURE_GZIP_B64_3: ${{ secrets.QSM_E2E_CPM_FIXTURE_GZIP_B64_3 }}
          QSM_E2E_CPM_FIXTURE_GZIP_B64_4: ${{ secrets.QSM_E2E_CPM_FIXTURE_GZIP_B64_4 }}
        run: |
          set -euo pipefail
          python3 scripts/ci/cpm_fixture_secret.py materialize \
            --output "$RUNNER_TEMP/qsm-protected-cpm-fixture/complex-model.bin"

      - name: Run the activation probe and complete packaged suite
        uses: ./.github/actions/run-packaged-e2e
        with:
          bundle-name: ${{ needs.prepare.outputs.bundle_name }}
          row-json: ${{ toJSON(matrix) }}
          source-sha: ${{ needs.admit.outputs.source_sha }}
          scenarios: ${{ matrix.scenarios }}
          compatibility-mod: ${{ matrix.compatibility_mod }}
          cpm-model-path: ${{ matrix.compatibility_mod == 'cpm' && format('{0}/qsm-protected-cpm-fixture/complex-model.bin', runner.temp) || '' }}
          evidence-name: mod-compatibility-e2e-${{ matrix.id }}
          evidence-retention-days: "7"

      - name: Install the hash-locked evidence decoder
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      - name: Extract the centrally authenticated same-version baseline
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ matrix.base_artifact.digest }}
          ARTIFACT_ID: ${{ matrix.base_artifact.id }}
          ARTIFACT_NAME: ${{ matrix.base_artifact.name }}
          ARTIFACT_RUN_ID: ${{ matrix.base_artifact.run_id }}
          ARTIFACT_SIZE: ${{ matrix.base_artifact.size_in_bytes }}
          BASE_NAME: ${{ matrix.base_evidence_name }}
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( ARTIFACT_SIZE <= 536870912 ))
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_NAME" == "$BASE_NAME" ]]
          [[ "$ARTIFACT_RUN_ID" == "$SOURCE_RUN_ID" ]]
          inventory=build/release/compatibility-baselines/inventory.json
          jq -e \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg name "$BASE_NAME" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --argjson size "$ARTIFACT_SIZE" \
            '.schema_version == 1 and .source_run_id == $run_id and
             ([.artifacts[] | select(
               .id == $artifact_id and .name == $name and .digest == $digest and
               .size_in_bytes == $size and .expired == false and
               .workflow_run.id == $run_id)] | length == 1)' \
            "$inventory" > /dev/null
          archive="build/release/compatibility-baselines/$ARTIFACT_ID.zip"
          test -f "$archive" -a ! -L "$archive"
          [[ "$(stat -c %s "$archive")" == "$ARTIFACT_SIZE" ]]
          [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" == \
             "$ARTIFACT_DIGEST" ]]
          python3 scripts/ci/bounded_zip.py "$archive" base-evidence \
            --max-archive-bytes 536870912 \
            --max-entries 512 \
            --max-total-bytes 536870912 \
            --max-file-bytes 33554432 \
            --max-compression-ratio 200 > /dev/null

      - name: Snapshot artifact provenance and curate only inert PNG pairs
        shell: bash
        env:
          BASE_NAME: ${{ matrix.base_evidence_name }}
          CANDIDATE_NAME: mod-compatibility-e2e-${{ matrix.id }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          inventory="$RUNNER_TEMP/compatibility-artifact-inventory.json"
          current=""
          for attempt in {1..12}; do
            current="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
            if jq -e --arg name "$CANDIDATE_NAME" --argjson run_id "$GITHUB_RUN_ID" \
                '[.artifacts[] | select(.name == $name and .expired == false and
                  .workflow_run.id == $run_id)] | length == 1' \
                <<< "$current" > /dev/null; then
              break
            fi
            sleep 5
          done
          base=build/release/compatibility-baselines/inventory.json
          base_json="$(<"$base")"
          jq -n \
            --arg base_name "$BASE_NAME" \
            --arg candidate_name "$CANDIDATE_NAME" \
            --argjson base "$base_json" \
            --argjson candidate "$current" \
            --argjson base_run_id "$SOURCE_RUN_ID" \
            --argjson candidate_run_id "$GITHUB_RUN_ID" \
            'def record($inventory;$name;$run_id):
               [$inventory.artifacts[] | select(.name == $name and .expired == false and
                 .workflow_run.id == $run_id and
                 (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                 ((.size_in_bytes | type) == "number" and .size_in_bytes > 0 and
                  .size_in_bytes <= 536870912))] |
               if length == 1 then .[0] |
                 {id,name,size_in_bytes,digest,run_id:$run_id}
               else error("artifact identity is not unique") end;
             {base:record($base;$base_name;$base_run_id),
              candidate:record($candidate;$candidate_name;$candidate_run_id)}' \
            > "$inventory"
          capsule="$RUNNER_TEMP/mod-compatibility-capsule"
          mkdir -p "$capsule"
          python3 e2e/mod_compatibility_visual.py \
            --candidate-root e2e-out/current \
            --base-root base-evidence \
            --scenario-contract e2e/scenario-contract.json \
            --compatibility-contract e2e/mod-compatibility-contract.json \
            --artifact-node "${{ matrix.artifact_node }}" \
            --mod "${{ matrix.compatibility_mod }}" \
            --output "$capsule/review-input" \
            --proof "$capsule/curation-proof.json" \
            --artifact-inventory "$inventory" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "${{ needs.admit.outputs.source_sha }}" \
            --target-branch "${{ needs.admit.outputs.target_branch }}" \
            --target-sha "${{ needs.admit.outputs.target_sha }}" \
            --compatibility-run-id "$GITHUB_RUN_ID" \
            --implementation-sha "$GITHUB_SHA"

      - name: Upload the bounded credential-free review capsule
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-review-input-${{ github.run_id }}-${{ matrix.id }}
          path: ${{ runner.temp }}/mod-compatibility-capsule/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  gate:
    name: Mod compatibility E2E gate
    needs:
      - admit
      - prepare
      - compatibility-e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every applicable lane and preserve explicit N/A
        shell: bash
        env:
          ADMIT_RESULT: ${{ needs.admit.result }}
          COUNT: ${{ needs.prepare.outputs.count }}
          E2E_RESULT: ${{ needs.compatibility-e2e.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          set -euo pipefail
          [[ "$ADMIT_RESULT" == success ]]
          [[ "$PREPARE_RESULT" == success ]]
          [[ "$COUNT" =~ ^[0-9]+$ ]]
          if [[ "$COUNT" == 0 ]]; then
            [[ "$E2E_RESULT" == skipped ]]
            printf 'Every compatibility tuple is explicitly N/A for this release.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$E2E_RESULT" == success ]]
            printf 'All %s applicable compatibility lanes passed and were curated.\n' \
              "$COUNT" >> "$GITHUB_STEP_SUMMARY"
          fi

  request-review:
    name: Request the independent AI compatibility review
    needs:
      - gate
    if: >-
      always() &&
      (needs.gate.result == 'success' || needs.gate.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Check out the protected notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Dispatch the exact settled compatibility source
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_master="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$current_master" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            printf 'Compatibility source %s is superseded by master %s; skipping its AI wake.\n' \
              "$GITHUB_SHA" "$current_master" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload="$RUNNER_TEMP/mod-compatibility-review-request.json"
          jq -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            '{event_type:"mod-compatibility-review-requested",
              client_payload:{source_repository:$source_repository,
                source_run_id:$source_run_id,source_sha:$source_sha}}' \
            > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" --input "$payload" \
            > /dev/null
