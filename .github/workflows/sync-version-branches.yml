name: Sync version branches

# Shared changes land on master. Every automatic generation first ports only the matrix-derived
# Minecraft 1.20.1 anchor. A protected semantic certificate releases the remaining discovered
# branches. Each target keeps its own matrix authoritative; no workflow stores a version list.
on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - visual-anchor-certified
  workflow_dispatch:
    inputs:
      target:
        description: Optional exact recovery target; empty starts the certified anchor wave
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-version-branches
  cancel-in-progress: false

jobs:
  discover:
    name: Discover release branches
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - name: Require master as the synchronization source
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == refs/heads/master ]]

      - name: Check out trusted synchronization code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve targets from GitHub
        id: targets
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ANCHOR_SOURCE_SHA: ${{ github.event.client_payload.anchor_source_sha }}
          PAYLOAD_ANCHOR_TARGET_SHA: ${{ github.event.client_payload.anchor_target_sha }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ github.event.client_payload.artifact_digest }}
          PAYLOAD_ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
          PAYLOAD_ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
          PAYLOAD_ARTIFACT_RUN_ID: ${{ github.event.client_payload.artifact_run_id }}
          PAYLOAD_ARTIFACT_SIZE: ${{ github.event.client_payload.artifact_size }}
          PAYLOAD_MASTER_SOURCE_SHA: ${{ github.event.client_payload.master_source_sha }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          reference_identity="$(python3 e2e/visual_review.py \
            --matrix release/release-matrix.json --reference-identity)"
          anchor_branch="$(jq -er .release_branch <<< "$reference_identity")"
          [[ "$(jq -er .version <<< "$reference_identity")" == 1.20.1 ]]
          branches="$RUNNER_TEMP/release-branches.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name' > "$branches"
          grep -Fxq "$anchor_branch" "$branches"
          python3 scripts/release/version_branches.py \
            --exclude master --target "$anchor_branch" < "$branches" > /dev/null

          if [[ -n "$REQUESTED_TARGET" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            value="$(python3 scripts/release/version_branches.py \
              --exclude master --target "$REQUESTED_TARGET")"
          elif [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            [[ "$EVENT_ACTION" == visual-anchor-certified ]]
            [[ "$PAYLOAD_MASTER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            # A certificate for an older master generation is expected during rapid updates. It
            # cannot release any work for the new generation and is safely ignored.
            if [[ "$PAYLOAD_MASTER_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
              printf 'Ignoring stale anchor certificate for %s; current master is %s\n' \
                "$PAYLOAD_MASTER_SOURCE_SHA" "$GITHUB_SHA"
              printf 'value=[]\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/master" \
              --jq .commit.sha)" == "$GITHUB_SHA" ]]
            [[ "$PAYLOAD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PAYLOAD_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PAYLOAD_ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
            (( PAYLOAD_ARTIFACT_SIZE <= 1048576 ))
            [[ "$PAYLOAD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$PAYLOAD_ANCHOR_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PAYLOAD_ANCHOR_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PAYLOAD_ARTIFACT_NAME" == \
              "visual-anchor-certification-$GITHUB_SHA" ]]

            metadata="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAYLOAD_ARTIFACT_ID")"
            jq -e \
              --arg digest "$PAYLOAD_ARTIFACT_DIGEST" \
              --arg name "$PAYLOAD_ARTIFACT_NAME" \
              --arg sha "$GITHUB_SHA" \
              --argjson artifact_id "$PAYLOAD_ARTIFACT_ID" \
              --argjson run_id "$PAYLOAD_ARTIFACT_RUN_ID" \
              --argjson size "$PAYLOAD_ARTIFACT_SIZE" \
              '.id == $artifact_id and .name == $name and .digest == $digest and
               .size_in_bytes == $size and .expired == false and
               .workflow_run.id == $run_id and .workflow_run.head_branch == "master" and
               .workflow_run.head_sha == $sha' <<< "$metadata" > /dev/null
            owner=''
            for attempt in {1..60}; do
              owner="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$PAYLOAD_ARTIFACT_RUN_ID")"
              if [[ "$(jq -r .status <<< "$owner")" == completed ]]; then
                break
              fi
              sleep 2
            done
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$GITHUB_SHA" \
              --argjson run_id "$PAYLOAD_ARTIFACT_RUN_ID" \
              '.id == $run_id and .status == "completed" and .conclusion == "success" and
               (.event == "repository_dispatch" or .event == "schedule" or
                .event == "workflow_dispatch") and .head_branch == "master" and
               .head_sha == $sha and
               .path == ".github/workflows/visual-review-drain.yml" and
               .head_repository.full_name == $repository' <<< "$owner" > /dev/null

            archive="$RUNNER_TEMP/visual-anchor-certification.zip"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAYLOAD_ARTIFACT_ID/zip" \
              > "$archive"
            [[ "$(stat -c %s "$archive")" == "$PAYLOAD_ARTIFACT_SIZE" ]]
            [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" == \
              "$PAYLOAD_ARTIFACT_DIGEST" ]]
            extracted="$RUNNER_TEMP/visual-anchor-certification"
            python3 scripts/ci/bounded_zip.py \
              "$archive" "$extracted" \
              --max-archive-bytes 1048576 \
              --max-entries 1 \
              --max-total-bytes 1048576 \
              --max-file-bytes 1048576 \
              --max-compression-ratio 20 \
              > "$RUNNER_TEMP/visual-anchor-certification-extraction.json"
            rm -f -- "$archive"
            mapfile -d '' certificate_files < <(
              find "$extracted" -mindepth 1 -maxdepth 1 -print0
            )
            [[ "${#certificate_files[@]}" -eq 1 ]]
            certificate="${certificate_files[0]}"
            [[ -f "$certificate" && ! -L "$certificate" ]]
            [[ "$(basename "$certificate")" == visual-anchor-certification.json ]]
            python3 scripts/ci/visual_anchor_certification.py verify \
              --certificate "$certificate" \
              --expected-master-sha "$GITHUB_SHA" \
              --expected-anchor-branch "$anchor_branch" \
              > "$RUNNER_TEMP/verified-anchor-certificate.json"
            jq -e \
              --arg anchor_source_sha "$PAYLOAD_ANCHOR_SOURCE_SHA" \
              --arg anchor_target_sha "$PAYLOAD_ANCHOR_TARGET_SHA" \
              --arg implementation_sha "$(jq -r .head_sha <<< "$owner")" \
              --arg scenario_contract_sha256 \
                "$(sha256sum e2e/scenario-contract.json | cut -d ' ' -f 1)" \
              '.anchor_source_sha == $anchor_source_sha and
               .anchor_target_sha == $anchor_target_sha and
               .implementation_sha == $implementation_sha and
               .scenario_contract_sha256 == $scenario_contract_sha256' \
              "$certificate" > /dev/null

            [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/$anchor_branch" \
              --jq .commit.sha)" == "$PAYLOAD_ANCHOR_TARGET_SHA" ]]
            git fetch --no-tags origin \
              "$PAYLOAD_ANCHOR_SOURCE_SHA" "$PAYLOAD_ANCHOR_TARGET_SHA"
            read -r -a source_commit <<< "$(git rev-list --parents -n 1 \
              "$PAYLOAD_ANCHOR_SOURCE_SHA")"
            [[ "${#source_commit[@]}" -eq 3 ]]
            [[ "${source_commit[2]}" == "$GITHUB_SHA" ]]
            read -r -a target_commit <<< "$(git rev-list --parents -n 1 \
              "$PAYLOAD_ANCHOR_TARGET_SHA")"
            [[ "${#target_commit[@]}" -eq 3 ]]
            [[ "${target_commit[1]}" == "$PAYLOAD_ANCHOR_SOURCE_SHA" \
              || "${target_commit[2]}" == "$PAYLOAD_ANCHOR_SOURCE_SHA" ]]
            [[ "$(git rev-parse "$PAYLOAD_ANCHOR_SOURCE_SHA^{tree}")" == \
              "$(git rev-parse "$PAYLOAD_ANCHOR_TARGET_SHA^{tree}")" ]]

            source_run_id="$(jq -er .source_run_id "$certificate")"
            source_branch="$(jq -er .source_branch "$certificate")"
            source_run="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
            jq -e \
              --arg branch "$source_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$PAYLOAD_ANCHOR_SOURCE_SHA" \
              --argjson run_id "$source_run_id" \
              '.id == $run_id and .status == "completed" and .conclusion == "success" and
               .event == "workflow_dispatch" and .head_branch == $branch and
               .head_sha == $sha and .path == ".github/workflows/on-demand-e2e.yml" and
               .head_repository.full_name == $repository' <<< "$source_run" > /dev/null
            value="$(python3 scripts/release/version_branches.py \
              --exclude master --exclude "$anchor_branch" < "$branches")"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Always certify the complete current master generation. Classifying only the latest
            # push range is unsafe: a documentation-only tip can still contain an older runtime
            # change whose anchor review is pending or failed.
            value="$(python3 scripts/release/version_branches.py \
              --exclude master --target "$anchor_branch")"
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            value="$(python3 scripts/release/version_branches.py \
              --exclude master --target "$anchor_branch")"
          fi
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Ensure the automation PR label exists
        if: steps.targets.outputs.value != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Created once per propagation instead of once per publish leg; the writer legs only
          # attach the already existing label.
          gh label create automated-version-sync \
            --color 1D76DB \
            --description 'Trusted master-to-version synchronization' \
            --force

  propose:
    name: Prepare read-only port to ${{ matrix.target }}
    needs: discover
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}

    steps:
      - name: Check out the exact target branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the deterministic merge
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$GITHUB_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          source_sha="$GITHUB_SHA"
          controller="$RUNNER_TEMP/version-port-controller"
          test ! -e "$controller"
          mkdir -p "$controller"
          git archive "$source_sha" | tar -x -C "$controller"
          python3 "$controller/scripts/release/version_branches.py" \
            --target "$TARGET_BRANCH" > /dev/null
          target_slug="${TARGET_BRANCH//[^A-Za-z0-9._-]/-}"
          target_head_sha="$(git rev-parse HEAD)"
          open_ports="$(gh pr list --state open --base "$TARGET_BRANCH" --limit 100 \
            --json number,baseRefName,baseRefOid,headRefName,headRefOid,isCrossRepository,labels,state \
            --jq '[.[] | select(.headRefName | startswith("automation/sync/")) | select([.labels[].name] | index("automated-version-sync"))]')"
          [[ "$(jq length <<< "$open_ports")" -le 1 ]]
          if [[ "$(jq length <<< "$open_ports")" -eq 1 ]]; then
            jq -e \
              --arg base "$TARGET_BRANCH" \
              --arg head_prefix "automation/sync/$target_slug/" \
              --arg target_head "$target_head_sha" \
              '.[0].state == "OPEN" and .[0].baseRefName == $base and .[0].baseRefOid == $target_head and (.[0].headRefName | startswith($head_prefix)) and (.[0].headRefOid | test("^[0-9a-f]{40}$")) and (.[0].isCrossRepository | not) and ([.[0].labels[].name] | index("automated-version-sync")) != null' \
              <<< "$open_ports" > /dev/null
            sync_branch="$(jq -r '.[0].headRefName' <<< "$open_ports")"
            expected_port_sha="$(jq -r '.[0].headRefOid' <<< "$open_ports")"
            git fetch --no-tags origin "$sync_branch"
            [[ "$(git rev-parse FETCH_HEAD)" == "$expected_port_sha" ]]
            git switch --detach FETCH_HEAD
            existing=true
          else
            sync_branch="automation/sync/${target_slug}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            existing=false
          fi
          work_head_sha="$(git rev-parse HEAD)"

          printf 'branch=%s\n' "$sync_branch" >> "$GITHUB_OUTPUT"
          printf 'existing=%s\n' "$existing" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'target_head_sha=%s\n' "$target_head_sha" >> "$GITHUB_OUTPUT"
          printf 'work_head_sha=%s\n' "$work_head_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$source_sha" "$work_head_sha"; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
            printf 'conflicted=false\n' >> "$GITHUB_OUTPUT"
            printf 'conflicts=[]\n' >> "$GITHUB_OUTPUT"
            printf 'ai_conflicted=false\n' >> "$GITHUB_OUTPUT"
            printf 'ai_conflicts=[]\n' >> "$GITHUB_OUTPUT"
            printf 'merge_evidence={}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          merge_evidence_file="$RUNNER_TEMP/version-port-merge-evidence.json"
          python3 "$controller/scripts/ci/version_port_merge.py" \
            --repository . \
            --work-head "$work_head_sha" \
            --source "$source_sha" \
            --mode prepare \
            > "$merge_evidence_file"
          jq -e \
            --arg source "$source_sha" \
            --arg work_head "$work_head_sha" \
            '(keys | sort) == (["ai_conflicts", "conflicted", "conflicts",
              "mechanical_index", "merge_bases", "protected_resolutions",
              "schema_version", "source_sha", "target_matrix",
              "work_head_sha"] | sort) and
             .schema_version == 1 and
             .source_sha == $source and .work_head_sha == $work_head and
             (.conflicted | type == "boolean") and
             (.conflicts | type == "array") and
             (.ai_conflicts | type == "array") and
             (.conflicts == (.conflicts | sort | unique)) and
             (.ai_conflicts == (.ai_conflicts | sort | unique)) and
             ((.ai_conflicts - .conflicts) | length == 0) and
             (if .conflicted then (.conflicts | length > 0)
              else (.conflicts == [] and .ai_conflicts == []) end) and
             (.merge_bases | type == "array" and length > 0) and
             (.protected_resolutions | type == "array") and
             (.mechanical_index.entry_count | type == "number") and
             (.mechanical_index.sha256 | test("^[0-9a-f]{64}$")) and
             (.target_matrix.active_loaders | type == "array" and length > 0)' \
            "$merge_evidence_file" > /dev/null
          merge_evidence="$(jq -c . "$merge_evidence_file")"
          conflicts="$(jq -c .conflicts "$merge_evidence_file")"
          ai_conflicts="$(jq -c .ai_conflicts "$merge_evidence_file")"
          conflicted="$(jq -r .conflicted "$merge_evidence_file")"
          ai_conflicted="$(jq -r '.ai_conflicts | length > 0' \
            "$merge_evidence_file")"
          index_sha="$(jq -r .mechanical_index.sha256 "$merge_evidence_file")"
          printf 'merge_evidence=%s\n' "$merge_evidence" >> "$GITHUB_OUTPUT"
          printf 'conflicted=%s\n' "$conflicted" >> "$GITHUB_OUTPUT"
          printf 'conflicts=%s\n' "$conflicts" >> "$GITHUB_OUTPUT"
          printf 'ai_conflicted=%s\n' "$ai_conflicted" >> "$GITHUB_OUTPUT"
          printf 'ai_conflicts=%s\n' "$ai_conflicts" >> "$GITHUB_OUTPUT"
          printf 'index_sha=%s\n' "$index_sha" >> "$GITHUB_OUTPUT"

      - name: Install all supported JDKs for conflict analysis
        if: steps.merge.outputs.ai_conflicted == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Node for the locked Claude CLI
        if: steps.merge.outputs.ai_conflicted == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked Claude Code from protected master
        if: steps.merge.outputs.ai_conflicted == 'true'
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$TRUSTED_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$TRUSTED_SHA" ]]
          mkdir -p "$RUNNER_TEMP/claude-cli"
          git show "${TRUSTED_SHA}:.github/claude/package.json" \
            > "$RUNNER_TEMP/claude-cli/package.json"
          git show "${TRUSTED_SHA}:.github/claude/package-lock.json" \
            > "$RUNNER_TEMP/claude-cli/package-lock.json"
          (
            cd "$RUNNER_TEMP/claude-cli"
            npm ci --ignore-scripts
            node node_modules/@anthropic-ai/claude-code/install.cjs
            node_modules/.bin/claude --version
          )

      - name: Resolve conflict contents without repository credentials
        if: steps.merge.outputs.ai_conflicted == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
          TARGET_BRANCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" --print \
            "Resolve only the currently unmerged file contents while porting master into release \
            branch $TARGET_BRANCH. Open AGENTS.md and read every imported Markdown file completely. \
            Preserve the branch's Minecraft version, loader pair, release matrix, overlays, metadata \
            and Java level. If README.md conflicts, retain either no branch-profile markers or one \
            complete marker pair; a deterministic post-merge step will render the target profile. \
            Do not run git add, git commit, git push or gh; do not edit any path that was not already \
            conflicted. Do not alter workflows, tests, matrices, guardrails or build configuration. \
            Leave the resolved tracked files in the worktree for the deterministic patch packager." \
            --model claude-opus-5 \
            --safe-mode \
            --no-session-persistence \
            --tools "Read,Edit,Write" \
            --allowedTools "Read(./**)" "Edit(./**)" "Write(./**)" \
            --permission-mode dontAsk

      - name: Enforce the AI conflict boundary
        if: steps.merge.outputs.ai_conflicted == 'true'
        shell: bash
        env:
          CONFLICTS: ${{ steps.merge.outputs.ai_conflicts }}
          EXPECTED_INDEX_SHA: ${{ steps.merge.outputs.index_sha }}
          WORK_HEAD_SHA: ${{ steps.merge.outputs.work_head_sha }}
          SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WORK_HEAD_SHA" ]]
          [[ "$(git rev-parse MERGE_HEAD)" == "$SOURCE_SHA" ]]
          jq -r '.[]' <<< "$CONFLICTS" > "$RUNNER_TEMP/conflicted-paths.txt"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/current-conflicts.txt"
          diff -u "$RUNNER_TEMP/conflicted-paths.txt" "$RUNNER_TEMP/current-conflicts.txt"
          actual_index_sha="$(git ls-files --stage -z \
              | sha256sum | cut -d ' ' -f 1)"
          [[ "$actual_index_sha" == "$EXPECTED_INDEX_SHA" ]]
          python3 "$RUNNER_TEMP/version-port-controller/scripts/ci/ai_patch_policy.py" worktree \
            --mode conflict \
            --allowed-paths "$RUNNER_TEMP/conflicted-paths.txt"
          mapfile -t conflict_paths < "$RUNNER_TEMP/conflicted-paths.txt"
          git add -- "${conflict_paths[@]}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Package the proposed port
        shell: bash
        env:
          AI_CONFLICTS: ${{ steps.merge.outputs.ai_conflicts || '[]' }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts || '[]' }}
          EXISTING: ${{ steps.merge.outputs.existing }}
          MERGE_EVIDENCE: ${{ steps.merge.outputs.merge_evidence || '{}' }}
          NEEDED: ${{ steps.merge.outputs.needed }}
          SOURCE_SHA: ${{ steps.merge.outputs.source_sha }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
          TARGET_BRANCH: ${{ matrix.target }}
          TARGET_HEAD_SHA: ${{ steps.merge.outputs.target_head_sha }}
          WORK_HEAD_SHA: ${{ steps.merge.outputs.work_head_sha }}
        run: |
          set -euo pipefail
          proposal_dir="$RUNNER_TEMP/version-port-proposal"
          test ! -e "$proposal_dir"
          mkdir -p "$proposal_dir"
          tree=''
          if [[ "$NEEDED" == true ]]; then
            # The scenario contract is the sole coverage policy. Normalize legacy target matrices
            # deterministically before README rendering so old branches migrate in the same port.
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/matrix.py" \
              --matrix release/release-matrix.json \
              --normalize-e2e-policy \
              --retire-player-armor-stands \
              --write > /dev/null
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/branch_readme.py" \
              --matrix release/release-matrix.json \
              --readme README.md \
              --profile-branch "$TARGET_BRANCH" \
              --bootstrap \
              --write
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/e2e_readme.py" \
              --matrix release/release-matrix.json \
              --contract e2e/scenario-contract.json \
              --readme e2e/README.md \
              --profile-branch "$TARGET_BRANCH" \
              --write
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/workflow_guidance.py" \
              --matrix release/release-matrix.json \
              --guidance docs/ai/WORKFLOW.md \
              --profile-branch "$TARGET_BRANCH" \
              --write
            git add -- README.md docs/ai/WORKFLOW.md e2e/README.md \
              release/release-matrix.json
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/branch_readme.py" \
              --matrix release/release-matrix.json \
              --readme README.md \
              --profile-branch "$TARGET_BRANCH" \
              --check
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/e2e_readme.py" \
              --matrix release/release-matrix.json \
              --contract e2e/scenario-contract.json \
              --readme e2e/README.md \
              --profile-branch "$TARGET_BRANCH" \
              --check
            python3 "$RUNNER_TEMP/version-port-controller/scripts/release/workflow_guidance.py" \
              --matrix release/release-matrix.json \
              --guidance docs/ai/WORKFLOW.md \
              --profile-branch "$TARGET_BRANCH" \
              --check
            python3 "$RUNNER_TEMP/version-port-controller/scripts/ci/ai_patch_policy.py" staged \
              --mode port --write-patch "$proposal_dir/version-port.patch"

            # Classify the exact tree and parent topology that the writer will reproduce. The
            # classifier itself comes from the protected synchronization source, never the target.
            # Both commit dates are pinned to the source commit so validate, publish and any
            # re-run reproduce one byte-identical port commit.
            tree="$(git write-tree)"
            port_commit_date="$(git show -s --format=%cI "$SOURCE_SHA")"
            candidate_commit="$(printf 'classify port to %s\n' "$TARGET_BRANCH" \
              | GIT_AUTHOR_DATE="$port_commit_date" GIT_COMMITTER_DATE="$port_commit_date" \
                git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$tree" -p "$WORK_HEAD_SHA" -p "$SOURCE_SHA")"
            # The classification base is the target head the plan was built on, so the policy
            # covers the full pull-request diff. A new port's base equals the work head; an
            # updated open port is classified over everything it will merge, not the increment.
            impact_output="$RUNNER_TEMP/e2e-impact-output"
            : > "$impact_output"
            python3 "$RUNNER_TEMP/version-port-controller/scripts/ci/e2e_impact.py" \
              --repository . \
              --base "$TARGET_HEAD_SHA" \
              --head "$candidate_commit" \
              --github-output "$impact_output"
            runtime_required="$(sed -n 's/^runtime_required=//p' "$impact_output")"
            runtime_manifest="$(sed -n 's/^manifest=//p' "$impact_output")"
            jq -e \
              '.schema_version == 1 and (.runtime_required | type == "boolean") and (.paths | type == "array" and length > 0) and (.runtime_paths | type == "array")' \
              <<< "$runtime_manifest" > /dev/null
            anchor_branch="$(jq -er '
              .unit_test_version as $version |
              select($version == "1.20.1") |
              select(([.artifacts[] |
                select(.artifact_version == $version) | .loader] |
                sort | unique) == ["fabric", "forge"]) |
              .project.release_branch |
              select(type == "string" and length > 0)
            ' "$RUNNER_TEMP/version-port-controller/release/release-matrix.json")"
            runtime_policy=full
            if [[ "$runtime_required" == false \
                && "$TARGET_BRANCH" != "$anchor_branch" ]]; then
              runtime_policy=not-applicable
            fi
          else
            runtime_policy=full
            runtime_manifest='{}'
          fi
          jq -n \
            --arg target "$TARGET_BRANCH" \
            --arg branch "$SYNC_BRANCH" \
            --arg work_head_sha "$WORK_HEAD_SHA" \
            --arg source_sha "$SOURCE_SHA" \
            --arg target_head_sha "$TARGET_HEAD_SHA" \
            --arg tree "$tree" \
            --arg runtime_policy "$runtime_policy" \
            --argjson ai_conflicts "$AI_CONFLICTS" \
            --argjson conflicts "$CONFLICTS" \
            --argjson merge_evidence "$MERGE_EVIDENCE" \
            --argjson needed "$NEEDED" \
            --argjson conflicted "$CONFLICTED" \
            --argjson existing "$EXISTING" \
            --argjson runtime_manifest "$runtime_manifest" \
            '{target:$target,branch:$branch,work_head_sha:$work_head_sha,source_sha:$source_sha,target_head_sha:$target_head_sha,tree:$tree,needed:$needed,conflicted:$conflicted,conflicts:$conflicts,ai_conflicts:$ai_conflicts,merge_evidence:$merge_evidence,existing:$existing,runtime_policy:$runtime_policy,runtime_manifest:$runtime_manifest}' \
            > "$proposal_dir/version-port-plan.json"

      - name: Upload the read-only port proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-port-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/version-port-proposal/version-port-plan.json
            ${{ runner.temp }}/version-port-proposal/version-port.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate port to ${{ matrix.target }} without credentials
    needs:
      - discover
      - propose
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.propose.result != 'cancelled' &&
      needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}

    steps:
      - name: Download the matching port proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-port-${{ matrix.target }}
          path: proposal

      - name: Validate proposal identity
        id: plan
        shell: bash
        env:
          TARGET_BRANCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          jq -e \
            --arg target "$TARGET_BRANCH" \
            --arg source "$GITHUB_SHA" \
            'def sha: type == "string" and test("^[0-9a-f]{40}$");
             def merge_evidence:
               (keys | sort) == (["ai_conflicts", "conflicted", "conflicts",
                 "mechanical_index", "merge_bases", "protected_resolutions",
                 "schema_version", "source_sha", "target_matrix",
                 "work_head_sha"] | sort) and
               .schema_version == 1 and
               (.work_head_sha | sha) and (.source_sha | sha) and
               (.conflicted | type == "boolean") and
               (.conflicts | type == "array") and
               (.ai_conflicts | type == "array") and
               (.conflicts == (.conflicts | sort | unique)) and
               (.ai_conflicts == (.ai_conflicts | sort | unique)) and
               ((.ai_conflicts - .conflicts) | length == 0) and
               (.merge_bases | type == "array" and length > 0) and
               (.protected_resolutions | type == "array") and
               (.mechanical_index |
                 (keys | sort) == ["entry_count", "sha256"] and
                 (.entry_count | type == "number" and . >= 0 and floor == .) and
                 (.sha256 | test("^[0-9a-f]{64}$"))) and
               (.target_matrix |
                 (keys | sort) == ["active_loaders", "mode", "oid"] and
                 (.active_loaders | type == "array" and length > 0) and
                 (.mode | test("^100(644|755)$")) and (.oid | sha));
             (keys | sort) == (["ai_conflicts", "branch", "conflicted",
               "conflicts", "existing", "merge_evidence", "needed",
               "runtime_manifest", "runtime_policy", "source_sha", "target",
               "target_head_sha", "tree", "work_head_sha"] | sort) and
             .target == $target and .source_sha == $source and
             (.work_head_sha | sha) and (.target_head_sha | sha) and
             (if .existing then true
              else .target_head_sha == .work_head_sha end) and
             (.branch | type == "string" and length <= 240 and
               test("^automation/sync/[A-Za-z0-9._/-]+$") and
               startswith("automation/sync/" + $target + "/")) and
             (.conflicted | type == "boolean") and
             (.conflicts | type == "array") and
             (.ai_conflicts | type == "array") and
             (.conflicts == (.conflicts | sort | unique)) and
             (.ai_conflicts == (.ai_conflicts | sort | unique)) and
             ((.ai_conflicts - .conflicts) | length == 0) and
             (if .conflicted then (.conflicts | length > 0)
              else (.conflicts == [] and .ai_conflicts == []) end) and
             (.existing | type == "boolean") and (.needed | type == "boolean") and
             (.runtime_policy == "full" or .runtime_policy == "not-applicable") and
             (.runtime_manifest | type == "object") and
             (if .needed then
                (.tree | sha) and .runtime_manifest.schema_version == 1 and
                (.runtime_manifest.runtime_required | type == "boolean") and
                (.runtime_manifest.paths | type == "array" and length > 0) and
                (.runtime_manifest.runtime_paths | type == "array") and
                (.merge_evidence | merge_evidence) and
                .merge_evidence.work_head_sha == .work_head_sha and
                .merge_evidence.source_sha == .source_sha and
                .merge_evidence.conflicted == .conflicted and
                .merge_evidence.conflicts == .conflicts and
                .merge_evidence.ai_conflicts == .ai_conflicts
              else
                .tree == "" and .runtime_policy == "full" and
                .runtime_manifest == {} and .merge_evidence == {}
              end)' \
            proposal/version-port-plan.json > /dev/null
          for key in branch conflicted existing needed runtime_policy source_sha target_head_sha tree work_head_sha; do
            printf '%s=%s\n' "$key" "$(jq -r ".$key" proposal/version-port-plan.json)" \
              >> "$GITHUB_OUTPUT"
          done
          printf 'runtime_manifest=%s\n' \
            "$(jq -c .runtime_manifest proposal/version-port-plan.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Check out trusted controller policy
        if: steps.plan.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: controller
          persist-credentials: false

      - name: Check out exact port base without credentials
        if: steps.plan.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.work_head_sha }}
          fetch-depth: 0
          path: port
          persist-credentials: false

      - name: Install Python
        if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked Pages image dependency
        if: steps.plan.outputs.needed == 'true'
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement controller/scripts/pages/requirements.txt

      - name: Reconstruct and deterministically validate the proposal
        if: steps.plan.outputs.needed == 'true'
        working-directory: port
        shell: bash
        env:
          EXPECTED_RUNTIME_MANIFEST: ${{ steps.plan.outputs.runtime_manifest }}
          EXPECTED_RUNTIME_POLICY: ${{ steps.plan.outputs.runtime_policy }}
          EXPECTED_TREE: ${{ steps.plan.outputs.tree }}
          HEAD_BRANCH: ${{ steps.plan.outputs.branch }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          TARGET_HEAD_SHA: ${{ steps.plan.outputs.target_head_sha }}
          WORK_HEAD_SHA: ${{ steps.plan.outputs.work_head_sha }}
        run: |
          set -euo pipefail
          if git fetch --no-tags origin "$HEAD_BRANCH"; then
            [[ "$(git rev-parse FETCH_HEAD)" == "$WORK_HEAD_SHA" ]]
          elif git ls-remote --exit-code origin "refs/heads/$HEAD_BRANCH" \
              > /dev/null 2>&1; then
            # The ref exists but could not be fetched; a transient failure must never skip
            # the head-consistency assertion.
            echo "Failed to fetch existing synchronization branch $HEAD_BRANCH" >&2
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$WORK_HEAD_SHA" ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git fetch --no-tags origin "$TARGET_HEAD_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$TARGET_HEAD_SHA" ]]
          git cat-file -e "${TARGET_HEAD_SHA}^{commit}"
          python3 ../controller/scripts/ci/ai_patch_policy.py patch \
            --mode port --patch ../proposal/version-port.patch
          candidate_index="$RUNNER_TEMP/version-port-candidate.index"
          test ! -e "$candidate_index"
          GIT_INDEX_FILE="$candidate_index" git read-tree "$WORK_HEAD_SHA"
          GIT_INDEX_FILE="$candidate_index" git apply --cached --check \
            ../proposal/version-port.patch
          GIT_INDEX_FILE="$candidate_index" git apply --cached \
            ../proposal/version-port.patch
          candidate_tree="$(GIT_INDEX_FILE="$candidate_index" git write-tree)"
          [[ "$candidate_tree" == "$EXPECTED_TREE" ]]

          ai_paths_file="$RUNNER_TEMP/ai-conflicted-paths.txt"
          jq -r '.ai_conflicts[]' ../proposal/version-port-plan.json \
            > "$ai_paths_file"
          merge_command=(
            python3 ../controller/scripts/ci/version_port_merge.py
            --repository .
            --work-head "$WORK_HEAD_SHA"
            --source "$SOURCE_SHA"
            --mode prepare
          )
          if [[ -s "$ai_paths_file" ]]; then
            python3 ../controller/scripts/ci/ai_patch_policy.py paths \
              --mode conflict --paths-file "$ai_paths_file"
            merge_command+=(
              --candidate-index "$candidate_index"
              --candidate-tree "$candidate_tree"
            )
          fi
          recomputed_evidence="$RUNNER_TEMP/recomputed-merge-evidence.json"
          "${merge_command[@]}" > "$recomputed_evidence"
          [[ "$(jq -S -c . "$recomputed_evidence")" \
            == "$(jq -S -c .merge_evidence \
              ../proposal/version-port-plan.json)" ]]

          python3 ../controller/scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --normalize-e2e-policy \
            --retire-player-armor-stands \
            --write > /dev/null
          python3 ../controller/scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$TARGET_BRANCH" \
            --bootstrap \
            --write
          python3 ../controller/scripts/release/e2e_readme.py \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --readme e2e/README.md \
            --profile-branch "$TARGET_BRANCH" \
            --write
          python3 ../controller/scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$TARGET_BRANCH" \
            --write
          git add -- README.md docs/ai/WORKFLOW.md e2e/README.md \
            release/release-matrix.json
          python3 ../controller/scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/release/e2e_readme.py \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --readme e2e/README.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/ci/ai_patch_policy.py staged --mode port
          git diff --cached --check
          validated_tree="$(git write-tree)"
          [[ "$validated_tree" == "$candidate_tree" ]]
          python3 -m compileall -q e2e scripts
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/release/tests -p 'test_*.py' -v
          python3 scripts/release/matrix.py \
            --matrix release/release-matrix.json > /dev/null
          git diff --exit-code
          [[ "$(git write-tree)" == "$validated_tree" ]]
          [[ "$validated_tree" == "$EXPECTED_TREE" ]]
          python3 ../controller/scripts/ci/ai_patch_policy.py staged --mode port
          tree="$(git write-tree)"
          # Pin both commit dates to the source commit so validate, publish and any re-run
          # reproduce one byte-identical port commit.
          port_commit_date="$(git show -s --format=%cI "$SOURCE_SHA")"
          commit="$(printf 'chore: sync master into %s\n' "$TARGET_BRANCH" \
            | GIT_AUTHOR_DATE="$port_commit_date" GIT_COMMITTER_DATE="$port_commit_date" \
              git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree "$tree" -p "$WORK_HEAD_SHA" -p "$SOURCE_SHA")"
          [[ "$(git rev-parse "${commit}^{tree}")" == "$tree" ]]
          [[ "$(git rev-parse "${commit}^1")" == "$WORK_HEAD_SHA" ]]
          [[ "$(git rev-parse "${commit}^2")" == "$SOURCE_SHA" ]]

          # Recompute the manifest from the actual commit before granting a skip. A mismatch with
          # the read-only proposal is a hard failure, never an implicit not-applicable decision.
          impact_output="$RUNNER_TEMP/published-e2e-impact-output"
          : > "$impact_output"
          python3 ../controller/scripts/ci/e2e_impact.py \
            --repository . \
            --base "$TARGET_HEAD_SHA" \
            --head "$commit" \
            --github-output "$impact_output"
          runtime_required="$(sed -n 's/^runtime_required=//p' "$impact_output")"
          runtime_manifest="$(sed -n 's/^manifest=//p' "$impact_output")"
          [[ "$(jq -S -c . <<< "$runtime_manifest")" \
            == "$(jq -S -c . <<< "$EXPECTED_RUNTIME_MANIFEST")" ]]
          anchor_branch="$(jq -er '
            .unit_test_version as $version |
            select($version == "1.20.1") |
            select(([.artifacts[] |
              select(.artifact_version == $version) | .loader] |
              sort | unique) == ["fabric", "forge"]) |
            .project.release_branch |
            select(type == "string" and length > 0)
          ' ../controller/release/release-matrix.json)"
          runtime_policy=full
          if [[ "$runtime_required" == false \
              && "$TARGET_BRANCH" != "$anchor_branch" ]]; then
            runtime_policy=not-applicable
          fi
          [[ "$runtime_policy" == "$EXPECTED_RUNTIME_POLICY" ]]

  authorize:
    name: Authorize settled version-port validations
    needs:
      - discover
      - propose
      - validate
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.propose.result != 'cancelled' &&
      needs.validate.result != 'cancelled' &&
      needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      validation_index: ${{ steps.validation-index.outputs.value }}

    steps:
      - name: Build one immutable settled validation index
        id: validation-index
        shell: bash
        env:
          EXPECTED_TARGETS: ${{ needs.discover.outputs.targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string" and length > 0 and length <= 240 and
              test("^[A-Za-z0-9._-]+-and-[A-Za-z0-9._-]+-[0-9]+(\\.[0-9]+)+$")) and
            . == (sort | unique)
          ' <<< "$EXPECTED_TARGETS" > /dev/null
          jobs_file="$(mktemp "$RUNNER_TEMP/version-port-jobs.XXXXXX")"
          # One settled inventory read replaces up to twelve polls in every parallel writer.
          if ! gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              > "$jobs_file"; then
            # A settled matrix remains safe to retry: no writer can start without this index.
            # Retry only the single centralized inventory read, never once per target.
            sleep 5
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              > "$jobs_file"
          fi
          index_dir="$(mktemp -d \
            "$RUNNER_TEMP/version-port-validation-index.XXXXXX")"
          index="$index_dir/index.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson expected_targets "$EXPECTED_TARGETS" \
            --slurpfile pages "$jobs_file" '
              def job_name($target):
                "Validate port to " + $target + " without credentials";
              ($expected_targets | map(job_name(.))) as $expected_names |
              ([$pages[0][]?.jobs[]? |
                select(.name as $name | $expected_names | index($name))]) as $jobs |
              if ($jobs | length) != ($expected_targets | length) or
                 ($jobs | map(.name) | sort | unique) != ($expected_names | sort) or
                 (all($jobs[];
                   .status == "completed" and
                   (.conclusion | type == "string" and length > 0) and
                   .run_id == ($run_id | tonumber) and
                   .head_sha == $source_sha and
                   (.run_attempt | type == "number" and . > 0 and floor == . and
                     . <= ($run_attempt | tonumber))) | not)
              then error("settled validate matrix does not match discovered targets")
              else
                ([$expected_targets[] as $target |
                  select(any($jobs[];
                    .name == job_name($target) and .conclusion == "success")) |
                  $target]) as $successful_targets |
                {schema_version:1,run_id:$run_id,
                 authorization_attempt:$run_attempt,
                 source_sha:$source_sha,expected_targets:$expected_targets,
                 successful_targets:$successful_targets}
              end
            ' > "$index"
          jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson expected_targets "$EXPECTED_TARGETS" '
              (keys | sort) == (["authorization_attempt", "expected_targets",
                "run_id", "schema_version", "source_sha",
                "successful_targets"] | sort) and
              .schema_version == 1 and .run_id == $run_id and
              .authorization_attempt == $run_attempt and
              .source_sha == $source_sha and
              .expected_targets == $expected_targets and
              (.successful_targets | type == "array" and
                . == (sort | unique) and
                all(.[]; . as $target |
                  $expected_targets | index($target) != null))
            ' "$index" > /dev/null
          printf 'value=%s\n' "$(jq -c . "$index")" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish validated port to ${{ matrix.target }}
    needs:
      - discover
      - propose
      - validate
      - authorize
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.propose.result != 'cancelled' &&
      needs.validate.result != 'cancelled' &&
      needs.authorize.result == 'success' &&
      needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}

    steps:
      - name: Require this target's centrally authorized validation
        shell: bash
        env:
          EXPECTED_TARGETS: ${{ needs.discover.outputs.targets }}
          TARGET_BRANCH: ${{ matrix.target }}
          VALIDATION_INDEX: ${{ needs.authorize.outputs.validation_index }}
        run: |
          set -euo pipefail
          [[ "${#VALIDATION_INDEX}" -le 8192 ]]
          jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg max_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha "$GITHUB_SHA" \
            --arg target "$TARGET_BRANCH" \
            --argjson expected_targets "$EXPECTED_TARGETS" \
            '(keys | sort) == (["authorization_attempt", "expected_targets",
              "run_id", "schema_version", "source_sha",
              "successful_targets"] | sort) and
             .schema_version == 1 and .run_id == $run_id and
             (.authorization_attempt | test("^[1-9][0-9]*$") and
               (tonumber <= ($max_attempt | tonumber))) and
             .source_sha == $source_sha and
             .expected_targets == $expected_targets and
             (.successful_targets | type == "array" and
               . == (sort | unique) and index($target) != null and
               all(.[]; . as $entry_target |
                 $expected_targets | index($entry_target) != null))' \
            <<< "$VALIDATION_INDEX" > /dev/null

      - name: Download the immutable validated proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-port-${{ matrix.target }}
          path: proposal

      - name: Authenticate proposal identity
        id: plan
        shell: bash
        env:
          TARGET_BRANCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          jq -e \
            --arg target "$TARGET_BRANCH" \
            --arg source "$GITHUB_SHA" \
            'def sha: type == "string" and test("^[0-9a-f]{40}$");
             def merge_evidence:
               (keys | sort) == (["ai_conflicts", "conflicted", "conflicts",
                 "mechanical_index", "merge_bases", "protected_resolutions",
                 "schema_version", "source_sha", "target_matrix",
                 "work_head_sha"] | sort) and
               .schema_version == 1 and
               (.work_head_sha | sha) and (.source_sha | sha) and
               (.conflicted | type == "boolean") and
               (.conflicts | type == "array") and
               (.ai_conflicts | type == "array") and
               (.conflicts == (.conflicts | sort | unique)) and
               (.ai_conflicts == (.ai_conflicts | sort | unique)) and
               ((.ai_conflicts - .conflicts) | length == 0) and
               (.merge_bases | type == "array" and length > 0) and
               (.protected_resolutions | type == "array") and
               (.mechanical_index |
                 (keys | sort) == ["entry_count", "sha256"] and
                 (.entry_count | type == "number" and . >= 0 and floor == .) and
                 (.sha256 | test("^[0-9a-f]{64}$"))) and
               (.target_matrix |
                 (keys | sort) == ["active_loaders", "mode", "oid"] and
                 (.active_loaders | type == "array" and length > 0) and
                 (.mode | test("^100(644|755)$")) and (.oid | sha));
             (keys | sort) == (["ai_conflicts", "branch", "conflicted",
               "conflicts", "existing", "merge_evidence", "needed",
               "runtime_manifest", "runtime_policy", "source_sha", "target",
               "target_head_sha", "tree", "work_head_sha"] | sort) and
             .target == $target and .source_sha == $source and
             (.work_head_sha | sha) and (.target_head_sha | sha) and
             (if .existing then true
              else .target_head_sha == .work_head_sha end) and
             (.branch | type == "string" and length <= 240 and
               test("^automation/sync/[A-Za-z0-9._/-]+$") and
               startswith("automation/sync/" + $target + "/")) and
             (.conflicted | type == "boolean") and
             (.conflicts | type == "array") and
             (.ai_conflicts | type == "array") and
             (.conflicts == (.conflicts | sort | unique)) and
             (.ai_conflicts == (.ai_conflicts | sort | unique)) and
             ((.ai_conflicts - .conflicts) | length == 0) and
             (if .conflicted then (.conflicts | length > 0)
              else (.conflicts == [] and .ai_conflicts == []) end) and
             (.existing | type == "boolean") and (.needed | type == "boolean") and
             (.runtime_policy == "full" or .runtime_policy == "not-applicable") and
             (.runtime_manifest | type == "object") and
             (if .needed then
                (.tree | sha) and .runtime_manifest.schema_version == 1 and
                (.runtime_manifest.runtime_required | type == "boolean") and
                (.runtime_manifest.paths | type == "array" and length > 0) and
                (.runtime_manifest.runtime_paths | type == "array") and
                (.merge_evidence | merge_evidence) and
                .merge_evidence.work_head_sha == .work_head_sha and
                .merge_evidence.source_sha == .source_sha and
                .merge_evidence.conflicted == .conflicted and
                .merge_evidence.conflicts == .conflicts and
                .merge_evidence.ai_conflicts == .ai_conflicts
              else
                .tree == "" and .runtime_policy == "full" and
                .runtime_manifest == {} and .merge_evidence == {}
              end)' \
            proposal/version-port-plan.json > /dev/null
          for key in branch existing needed runtime_policy source_sha target_head_sha tree work_head_sha; do
            printf '%s=%s\n' "$key" "$(jq -r ".$key" proposal/version-port-plan.json)" \
              >> "$GITHUB_OUTPUT"
          done
          printf 'runtime_manifest=%s\n' \
            "$(jq -c .runtime_manifest proposal/version-port-plan.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Check out protected controller policy
        if: steps.plan.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: controller
          persist-credentials: false

      - name: Check out exact port base without persisted credentials
        if: steps.plan.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.work_head_sha }}
          fetch-depth: 0
          path: port
          persist-credentials: false

      - name: Reproduce only the protected validated tree
        if: steps.plan.outputs.needed == 'true'
        id: reproduced
        working-directory: port
        shell: bash
        env:
          EXPECTED_RUNTIME_MANIFEST: ${{ steps.plan.outputs.runtime_manifest }}
          EXPECTED_RUNTIME_POLICY: ${{ steps.plan.outputs.runtime_policy }}
          EXPECTED_TREE: ${{ steps.plan.outputs.tree }}
          HEAD_BRANCH: ${{ steps.plan.outputs.branch }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          TARGET_BRANCH: ${{ matrix.target }}
          TARGET_HEAD_SHA: ${{ steps.plan.outputs.target_head_sha }}
          WORK_HEAD_SHA: ${{ steps.plan.outputs.work_head_sha }}
        run: |
          set -euo pipefail
          if git fetch --no-tags origin "$HEAD_BRANCH"; then
            fetched_head="$(git rev-parse FETCH_HEAD)"
            if [[ "$fetched_head" != "$WORK_HEAD_SHA" ]]; then
              # A previously interrupted publish attempt may already have pushed this port.
              # Accept only the exact validated tree on the exact validated parents so that a
              # re-run of a failed leg is a bounded recovery, never an overwrite.
              [[ "$(git rev-parse "${fetched_head}^{tree}")" == "$EXPECTED_TREE" ]]
              [[ "$(git rev-list --parents -n 1 "$fetched_head")" \
                == "$fetched_head $WORK_HEAD_SHA $SOURCE_SHA" ]]
            fi
          elif git ls-remote --exit-code origin "refs/heads/$HEAD_BRANCH" \
              > /dev/null 2>&1; then
            # The ref exists but could not be fetched; a transient failure must never skip
            # the head-consistency assertion.
            echo "Failed to fetch existing synchronization branch $HEAD_BRANCH" >&2
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$WORK_HEAD_SHA" ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git fetch --no-tags origin "$TARGET_HEAD_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$TARGET_HEAD_SHA" ]]
          git cat-file -e "${TARGET_HEAD_SHA}^{commit}"
          python3 ../controller/scripts/ci/ai_patch_policy.py patch \
            --mode port --patch ../proposal/version-port.patch
          candidate_index="$RUNNER_TEMP/version-port-candidate.index"
          test ! -e "$candidate_index"
          GIT_INDEX_FILE="$candidate_index" git read-tree "$WORK_HEAD_SHA"
          GIT_INDEX_FILE="$candidate_index" git apply --cached --check \
            ../proposal/version-port.patch
          GIT_INDEX_FILE="$candidate_index" git apply --cached \
            ../proposal/version-port.patch
          candidate_tree="$(GIT_INDEX_FILE="$candidate_index" git write-tree)"
          [[ "$candidate_tree" == "$EXPECTED_TREE" ]]

          ai_paths_file="$RUNNER_TEMP/ai-conflicted-paths.txt"
          jq -r '.ai_conflicts[]' ../proposal/version-port-plan.json \
            > "$ai_paths_file"
          merge_command=(
            python3 ../controller/scripts/ci/version_port_merge.py
            --repository .
            --work-head "$WORK_HEAD_SHA"
            --source "$SOURCE_SHA"
            --mode prepare
          )
          if [[ -s "$ai_paths_file" ]]; then
            python3 ../controller/scripts/ci/ai_patch_policy.py paths \
              --mode conflict --paths-file "$ai_paths_file"
            merge_command+=(
              --candidate-index "$candidate_index"
              --candidate-tree "$candidate_tree"
            )
          fi
          recomputed_evidence="$RUNNER_TEMP/recomputed-merge-evidence.json"
          "${merge_command[@]}" > "$recomputed_evidence"
          [[ "$(jq -S -c . "$recomputed_evidence")" \
            == "$(jq -S -c .merge_evidence \
              ../proposal/version-port-plan.json)" ]]

          python3 ../controller/scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --normalize-e2e-policy \
            --retire-player-armor-stands \
            --write > /dev/null
          python3 ../controller/scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$TARGET_BRANCH" \
            --bootstrap \
            --write
          python3 ../controller/scripts/release/e2e_readme.py \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --readme e2e/README.md \
            --profile-branch "$TARGET_BRANCH" \
            --write
          python3 ../controller/scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$TARGET_BRANCH" \
            --write
          git add -- README.md docs/ai/WORKFLOW.md e2e/README.md \
            release/release-matrix.json
          python3 ../controller/scripts/release/branch_readme.py \
            --matrix release/release-matrix.json \
            --readme README.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/release/e2e_readme.py \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --readme e2e/README.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/release/workflow_guidance.py \
            --matrix release/release-matrix.json \
            --guidance docs/ai/WORKFLOW.md \
            --profile-branch "$TARGET_BRANCH" \
            --check
          python3 ../controller/scripts/ci/ai_patch_policy.py staged --mode port
          git diff --cached --check
          tree="$(git write-tree)"
          [[ "$tree" == "$candidate_tree" ]]
          [[ "$tree" == "$EXPECTED_TREE" ]]
          # Pin both commit dates to the source commit so validate, publish and any re-run
          # reproduce one byte-identical port commit.
          port_commit_date="$(git show -s --format=%cI "$SOURCE_SHA")"
          commit="$(printf 'chore: sync master into %s\n' "$TARGET_BRANCH" \
            | GIT_AUTHOR_DATE="$port_commit_date" GIT_COMMITTER_DATE="$port_commit_date" \
              git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree "$tree" -p "$WORK_HEAD_SHA" -p "$SOURCE_SHA")"
          [[ "$(git rev-parse "${commit}^{tree}")" == "$EXPECTED_TREE" ]]
          [[ "$(git rev-parse "${commit}^1")" == "$WORK_HEAD_SHA" ]]
          [[ "$(git rev-parse "${commit}^2")" == "$SOURCE_SHA" ]]

          impact_output="$RUNNER_TEMP/writer-e2e-impact-output"
          : > "$impact_output"
          python3 ../controller/scripts/ci/e2e_impact.py \
            --repository . \
            --base "$TARGET_HEAD_SHA" \
            --head "$commit" \
            --github-output "$impact_output"
          runtime_required="$(sed -n 's/^runtime_required=//p' "$impact_output")"
          runtime_manifest="$(sed -n 's/^manifest=//p' "$impact_output")"
          [[ "$(jq -S -c . <<< "$runtime_manifest")" \
            == "$(jq -S -c . <<< "$EXPECTED_RUNTIME_MANIFEST")" ]]
          anchor_branch="$(jq -er '
            .unit_test_version as $version |
            select($version == "1.20.1") |
            select(([.artifacts[] |
              select(.artifact_version == $version) | .loader] |
              sort | unique) == ["fabric", "forge"]) |
            .project.release_branch |
            select(type == "string" and length > 0)
          ' ../controller/release/release-matrix.json)"
          runtime_policy=full
          if [[ "$runtime_required" == false \
              && "$TARGET_BRANCH" != "$anchor_branch" ]]; then
            runtime_policy=not-applicable
          fi
          [[ "$runtime_policy" == "$EXPECTED_RUNTIME_POLICY" ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'runtime_policy=%s\n' "$runtime_policy" >> "$GITHUB_OUTPUT"

      - name: Push the reproduced tree and open or update its PR
        if: steps.plan.outputs.needed == 'true'
        working-directory: port
        shell: bash
        env:
          EXISTING_PORT: ${{ steps.plan.outputs.existing }}
          EXPECTED_TREE: ${{ steps.plan.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
          PORT_COMMIT: ${{ steps.reproduced.outputs.commit }}
          RUNTIME_POLICY: ${{ steps.reproduced.outputs.runtime_policy }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          SYNC_BRANCH: ${{ steps.plan.outputs.branch }}
          TARGET_BRANCH: ${{ matrix.target }}
          WORK_HEAD_SHA: ${{ steps.plan.outputs.work_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PORT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "${PORT_COMMIT}^1")" == "$WORK_HEAD_SHA" ]]
          published_sha="$PORT_COMMIT"
          push_needed=true
          if [[ "$EXISTING_PORT" == true ]]; then
            remote_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$SYNC_BRANCH" \
              --jq .object.sha)"
            if [[ "$remote_sha" != "$WORK_HEAD_SHA" ]]; then
              # A previously interrupted attempt already pushed this port. Accept only the
              # exact validated tree on the exact validated parents and finish publishing it
              # instead of failing the recovery re-run.
              [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags origin "$remote_sha"
              [[ "$(git rev-parse FETCH_HEAD)" == "$remote_sha" ]]
              [[ "$(git rev-parse "${remote_sha}^{tree}")" == "$EXPECTED_TREE" ]]
              [[ "$(git rev-list --parents -n 1 "$remote_sha")" \
                == "$remote_sha $WORK_HEAD_SHA $SOURCE_SHA" ]]
              published_sha="$remote_sha"
              push_needed=false
            fi
          else
            if remote_sha="$(gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/$SYNC_BRANCH" \
                --jq .object.sha 2> /dev/null)"; then
              # The branch this attempt would create already exists. Accept it only as this
              # leg's own interrupted publication of the exact validated plan.
              [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags origin "$remote_sha"
              [[ "$(git rev-parse FETCH_HEAD)" == "$remote_sha" ]]
              if [[ "$(git rev-parse "${remote_sha}^{tree}")" != "$EXPECTED_TREE" \
                  || "$(git rev-list --parents -n 1 "$remote_sha")" \
                    != "$remote_sha $WORK_HEAD_SHA $SOURCE_SHA" ]]; then
                echo "Refusing to overwrite an unexpected synchronization branch" >&2
                exit 1
              fi
              published_sha="$remote_sha"
              push_needed=false
            fi
          fi
          git remote set-url origin \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if [[ "$push_needed" == true ]]; then
            git push --no-verify origin "$PORT_COMMIT:refs/heads/$SYNC_BRANCH"
          fi
          if [[ "$EXISTING_PORT" == true ]]; then
            # GitHub publishes the pull request head asynchronously, so the commit pushed
            # above can still be invisible for a moment. Poll the same exact identity
            # instead of deciding on one read, which previously aborted the port before it
            # could dispatch its gates. The predicate is unchanged: only the pushed head on
            # the expected branch, base, repository and label is ever accepted.
            pr_converged=false
            for attempt in $(seq 1 30); do
              pr_json="$(gh pr list --state open --head "$SYNC_BRANCH" --limit 2 \
                --json url,baseRefName,headRefName,headRefOid,isCrossRepository,labels,state)"
              if jq -e \
                  --arg branch "$SYNC_BRANCH" \
                  --arg head "$published_sha" \
                  --arg target "$TARGET_BRANCH" \
                  'length == 1 and .[0].state == "OPEN" and .[0].baseRefName == $target and .[0].headRefName == $branch and .[0].headRefOid == $head and (.[0].isCrossRepository | not) and ([.[0].labels[].name] | index("automated-version-sync")) != null' \
                  <<< "$pr_json" > /dev/null; then
                pr_converged=true
                break
              fi
              sleep 2
            done
            if [[ "$pr_converged" != true ]]; then
              echo "Open port never converged on the pushed head $published_sha" >&2
              jq -r '.[0].headRefOid // "no open port"' <<< "$pr_json" >&2
              exit 1
            fi
            pr_url="$(jq -r '.[0].url' <<< "$pr_json")"
            gh pr comment "$pr_url" --body \
              "Updated this open port with the latest \`master\`; redispatching both exact-head gates."
          else
            # GitHub publishes a just-pushed ref asynchronously, and a previously interrupted
            # attempt may already have opened this PR. Retry a bounded number of times, adopting
            # only the exact open PR for the published head as an already-created success.
            pr_url=''
            for attempt in $(seq 1 5); do
              pr_json="$(gh pr list --state open --head "$SYNC_BRANCH" --limit 2 \
                --json url,baseRefName,headRefName,headRefOid,isCrossRepository,labels,state)"
              if jq -e \
                  --arg branch "$SYNC_BRANCH" \
                  --arg head "$published_sha" \
                  --arg target "$TARGET_BRANCH" \
                  'length == 1 and .[0].state == "OPEN" and .[0].baseRefName == $target and .[0].headRefName == $branch and .[0].headRefOid == $head and (.[0].isCrossRepository | not) and ([.[0].labels[].name] | index("automated-version-sync")) != null' \
                  <<< "$pr_json" > /dev/null; then
                pr_url="$(jq -r '.[0].url' <<< "$pr_json")"
                break
              fi
              if pr_url="$(gh pr create \
                  --base "$TARGET_BRANCH" \
                  --head "$SYNC_BRANCH" \
                  --title "chore: sync master into $TARGET_BRANCH" \
                  --label automated-version-sync \
                  --body "Automated semantic port of master into \`$TARGET_BRANCH\`. The branch's own release matrix selects every build and packaged E2E lane. Build gate and Packaged E2E are dispatched explicitly; the PR merges only after both pass.")"; then
                break
              fi
              pr_url=''
              sleep 3
            done
            if [[ -z "$pr_url" ]]; then
              echo "Failed to create or adopt the synchronization pull request" >&2
              exit 1
            fi
          fi
          # Both gate dispatches are idempotent: the result handler accepts only the latest
          # exact-head run of each gate, so a recovery re-run may safely dispatch duplicates.
          build_gate_dispatched=false
          for attempt in $(seq 1 5); do
            if gh workflow run build-gate.yml --ref "$SYNC_BRANCH"; then
              build_gate_dispatched=true
              break
            fi
            sleep 3
          done
          [[ "$build_gate_dispatched" == true ]]
          e2e_gate_dispatched=false
          for attempt in $(seq 1 5); do
            if gh workflow run on-demand-e2e.yml --ref "$SYNC_BRANCH" \
                -f runtime_policy="$RUNTIME_POLICY"; then
              e2e_gate_dispatched=true
              break
            fi
            sleep 3
          done
          [[ "$e2e_gate_dispatched" == true ]]
          printf 'Prepared %s\n' "$pr_url"
