name: Recover complete feature coverage requests

on:
  workflow_run:
    workflows:
      - AI visual review drain
      - Project site
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional exact complete runtime source; empty rediscovers current master
        required: false
        type: string

permissions: {}

jobs:
  request:
    name: Recover one current baseline readiness request
    # Successful producers already run the serialized request tail. A lost tail recovers
    # hourly; do not replace every avoided collector with another successful-owner job.
    # Generic drain sweeps and Pages repository wakes cannot own report/image evidence.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'cancelled' ||
         github.event.workflow_run.conclusion == 'timed_out') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_sha == github.sha &&
        ((github.event.workflow_run.path == '.github/workflows/visual-review-drain.yml' &&
          github.event.workflow_run.event == 'repository_dispatch') ||
         (github.event.workflow_run.path == '.github/workflows/pages.yml' &&
          github.event.workflow_run.event != 'repository_dispatch'))))
    concurrency:
      group: quick-skin-feature-baseline-request-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact protected readiness policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reconcile durable readiness without running a model or assembling reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/master || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            exit 1
          fi
          if [[ "$(python3 scripts/release/release_sources.py --kind mode)" != shared ]]; then
            exit 0
          fi
          identity=(--recover)
          if [[ -n "$PRODUCER_RUN_ID" ]]; then
            identity=(--producer-run-id "$PRODUCER_RUN_ID")
          elif [[ -n "$SOURCE_RUN_ID" ]]; then
            identity=(--source-run-id "$SOURCE_RUN_ID")
          fi
          python3 scripts/ci/feature_coverage_request.py "${identity[@]}" \
            --github-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
