name: Prune bounded Actions caches

# Cache entries scoped to deleted work branches cannot help a future build. Live branches keep the
# newest successful setup-gradle home generation while older recognized generations are bounded.
# Reconcile after a branch deletion and once per day; every invocation rediscovers repository state.
on:
  schedule:
    - cron: "29 9 * * *"
  delete:

permissions: {}

concurrency:
  group: quick-skin-actions-cache-pruning
  cancel-in-progress: false

jobs:
  prune:
    name: Delete unusable and superseded caches
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-24.04
    # Authentication may need to wait for the installation's primary API window to reset. Cache
    # cleanup is isolated from every build/review concurrency group, so that bounded wait cannot
    # delay release work.
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read

    steps:
      # schedule and delete load this workflow from the default branch. Authenticate the live run
      # before checking out or executing any repository file, then pin that checkout to the current
      # protected master SHA rather than trusting mutable event fields.
      - name: Authenticate protected cleanup implementation
        id: trusted
        shell: bash
        env:
          DELETED_REF: ${{ github.event.ref }}
          DELETED_REF_TYPE: ${{ github.event.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected_gh_api_retry() {
            local api_status attempt delay now output reset_at skew wait_seconds
            delay=5
            for attempt in {1..4}; do
              output=''
              api_status=0
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                api_status=$?
              fi
              if ! grep -Eqi \
                  'API rate limit exceeded|secondary rate limit|HTTP (408|429|5[0-9][0-9])|connection (reset|refused)|timed out|timeout|temporary failure|TLS handshake|unexpected EOF' \
                  <<< "$output" || (( attempt == 4 )); then
                printf '%s\n' "$output" >&2
                return "$api_status"
              fi

              wait_seconds="$delay"
              if grep -Fqi 'API rate limit exceeded' <<< "$output"; then
                # GET /rate_limit does not consume primary quota. Respect the installation's
                # declared reset instead of repeatedly spending requests inside a closed window.
                reset_at="$(gh api rate_limit --jq .resources.core.reset \
                  2>/dev/null || true)"
                if [[ "$reset_at" =~ ^[1-9][0-9]*$ ]]; then
                  now="$(date +%s)"
                  skew=$(( (GITHUB_RUN_ID + attempt) % 5 ))
                  wait_seconds=$(( reset_at - now + 2 + skew ))
                  (( wait_seconds > 0 )) || wait_seconds=1
                  if (( wait_seconds > 3700 )); then
                    printf '%s\n' "$output" >&2
                    return "$api_status"
                  fi
                else
                  wait_seconds=60
                fi
              elif grep -Eqi 'secondary rate limit|HTTP 429' <<< "$output"; then
                (( wait_seconds >= 60 )) || wait_seconds=60
              fi

              printf 'GitHub API cleanup authentication attempt %s/4 failed transiently; waiting %ss.\n' \
                "$attempt" "$wait_seconds" >&2
              sleep "$wait_seconds"
              delay=$(( delay < 60 ? delay * 2 : 60 ))
              (( delay <= 60 )) || delay=60
            done
          }
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/master ]]

          case "$GITHUB_EVENT_NAME" in
            schedule)
              ;;
            delete)
              [[ "$DELETED_REF_TYPE" == branch ]]
              [[ -n "$DELETED_REF" && "$DELETED_REF" != *$'\n'* ]]
              ;;
            *)
              exit 2
              ;;
          esac

          repository_json="$(protected_gh_api_retry "repos/$GITHUB_REPOSITORY")"
          jq -e '.default_branch == "master"' <<< "$repository_json" > /dev/null

          run_json="$(protected_gh_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          jq -e \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $run_id and .event == $event and
             .path == ".github/workflows/prune-actions-caches.yml" and
             .head_branch == "master" and .head_sha == $sha and
             .head_repository.full_name == $repository' \
            <<< "$run_json" > /dev/null

          implementation_sha="$(protected_gh_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$implementation_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'implementation_sha=%s\n' "$implementation_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the exact protected cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.implementation_sha }}
          persist-credentials: false

      - name: Prune only revalidated bounded cache IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/prune_actions_caches.py
          --repository "$GITHUB_REPOSITORY"
          --expected-default-branch master
          --apply
          --max-delete-count 75
          --max-delete-bytes 10737418240
          --delete-delay-seconds 1
