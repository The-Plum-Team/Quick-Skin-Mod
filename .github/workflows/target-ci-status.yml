name: Publish target CI status

# Events wake a fresh read of protected master. They never supply executable code or results.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Build gate, Packaged E2E]
    types: [requested, in_progress, completed]
    branches: [master]
  repository_dispatch:
    types: [target-ci-status]
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions: {}

concurrency:
  group: quick-skin-target-ci-status
  cancel-in-progress: false

jobs:
  publish:
    name: Publish a small protected status snapshot
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'repository_dispatch' ||
       github.event.client_payload.source_repository == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Check out the current protected status implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Authenticate the checked-out master generation
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$current_sha" == "$source_sha" ]]
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Collect target status without executing build or runtime jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/target_status.py collect \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/target-ci-status"

      - name: Publish one atomic data-only status generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/target_status_publish.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$SOURCE_SHA" \
            --directory "$RUNNER_TEMP/target-ci-status"
