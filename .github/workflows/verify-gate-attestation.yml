name: Verify gate attestation

# Reusable, lightweight proof that a release-branch tree is byte-for-byte the tree already tested
# by one trusted workflow run. Callers surface this result under their own workflow name, which
# lets GitHub's native branch badges report the exact release state without rebuilding Minecraft.
on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_workflow:
        required: true
        type: string
      tested_branch:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      target_sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify exact tested tree
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      # The release commit is authenticated as inert GitHub API data below. Never check out or
      # execute it in this default-branch cache context; only the protected retry helper is loaded.
      - name: Check out protected attestation transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: controller
          persist-credentials: false

      - name: Verify branch, commit, tree, and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TESTED_BRANCH: ${{ inputs.tested_branch }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          set -euo pipefail
          source controller/scripts/ci/github_api_retry.sh
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_WORKFLOW" == build-gate.yml \
            || "$SOURCE_WORKFLOW" == on-demand-e2e.yml ]]
          [[ "$TESTED_BRANCH" == automation/sync/* ]]
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF_NAME" =~ ^[a-z0-9]+(-and-[a-z0-9]+)*-[0-9]+(\.[0-9]+)+$ ]]
          [[ "$GITHUB_SHA" == "$TARGET_SHA" ]]
          [[ "$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" \
            --jq .commit.sha)" == "$TARGET_SHA" ]]

          tested_commit="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/git/commits/$TESTED_SHA")"
          target_commit="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/git/commits/$TARGET_SHA")"
          jq -e --arg sha "$TESTED_SHA" \
            '.sha == $sha and (.tree.sha | test("^[0-9a-f]{40}$"))' \
            <<< "$tested_commit" > /dev/null
          jq -e --arg sha "$TARGET_SHA" \
            '.sha == $sha and (.tree.sha | test("^[0-9a-f]{40}$"))' \
            <<< "$target_commit" > /dev/null
          [[ "$(jq -r .tree.sha <<< "$tested_commit")" \
            == "$(jq -r .tree.sha <<< "$target_commit")" ]]
          comparison="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/compare/$TESTED_SHA...$TARGET_SHA")"
          jq -e --arg tested "$TESTED_SHA" --arg target "$TARGET_SHA" \
            '.status == "ahead" and .merge_base_commit.sha == $tested and
             .base_commit.sha == $tested and .commits[-1].sha == $target' \
            <<< "$comparison" > /dev/null

          run_json="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          [[ "$(jq -r .status <<< "$run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<< "$run_json")" == success ]]
          [[ "$(jq -r .event <<< "$run_json")" == workflow_dispatch ]]
          [[ "$(jq -r .head_branch <<< "$run_json")" == "$TESTED_BRANCH" ]]
          [[ "$(jq -r .head_sha <<< "$run_json")" == "$TESTED_SHA" ]]
          [[ "$(jq -r .path <<< "$run_json")" \
            == ".github/workflows/$SOURCE_WORKFLOW" ]]
          [[ "$(jq -r '.head_repository.full_name // ""' <<< "$run_json")" \
            == "$GITHUB_REPOSITORY" ]]

          {
            printf '### Verified release gate\n\n'
            printf -- '- Target branch: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Final commit: `%s`\n' "$TARGET_SHA"
            printf -- '- Tested commit: `%s`\n' "$TESTED_SHA"
            printf -- '- Source workflow: `%s` (run `%s`)\n' \
              "$SOURCE_WORKFLOW" "$SOURCE_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
