name: AI mod compatibility review

# This secret-bearing workflow receives only metadata-free PNG capsules curated by the separate
# compatibility workflow. Its protected producer wakes it explicitly because that producer was
# itself created with GITHUB_TOKEN and cannot reliably recurse through workflow_run. Every
# mod/loader capsule is reviewed concurrently. A durable marker is uploaded before an
# Opus-confirmed defect cancels the remaining sessions.
on:
  schedule:
    - cron: "17,47 * * * *"
  repository_dispatch:
    types:
      - mod-compatibility-review-requested
      - mod-compatibility-review-sweep-requested
      - mod-compatibility-publication-requested
  workflow_dispatch:
    inputs:
      operation:
        description: Recover the queue or republish one already-clean source without model calls
        required: true
        default: recover
        type: choice
        options:
          - recover
          - publish
      source_run_id:
        description: Exact completed compatibility source run for publish recovery
        required: false
        type: string

permissions: {}

concurrency:
  group: >-
    mod-compatibility-review-${{ github.event.client_payload.source_run_id ||
    inputs.source_run_id ||
    'queue-sweep' }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover one pending compatibility review
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'repository_dispatch' ||
       github.event.action == 'mod-compatibility-review-sweep-requested') &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'recover')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the protected compatibility queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Dispatch the oldest authenticated pending source
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          selected="$(mktemp "$RUNNER_TEMP/mod-compatibility-queue.XXXXXX")"
          selector_status=0
          if python3 scripts/ci/mod_compatibility_review_queue.py \
              --repository "$GITHUB_REPOSITORY" \
              --github-output "$selected"; then
            selector_status=0
          else
            selector_status=$?
          fi
          if [[ "$selector_status" -eq 75 ]]; then
            echo "::warning::GitHub API quota exhausted; compatibility review recovery deferred"
            exit 0
          fi
          [[ "$selector_status" -eq 0 ]]
          if ! grep -qx 'eligible=true' "$selected"; then
            printf 'No current compatibility review is pending.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source_run_id="$(sed -n 's/^source_run_id=//p' "$selected")"
          source_sha="$(sed -n 's/^source_sha=//p' "$selected")"
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          payload="$RUNNER_TEMP/mod-compatibility-review-recovery.json"
          jq -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$source_run_id" \
            --arg source_sha "$source_sha" \
            '{event_type:"mod-compatibility-review-requested",client_payload:{
              source_repository:$source_repository,source_run_id:$source_run_id,
              source_sha:$source_sha}}' > "$payload"
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$payload" > /dev/null

  enumerate:
    name: Authenticate compatibility capsules
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'mod-compatibility-review-requested' &&
      github.event.client_payload.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      completed_count: ${{ steps.matrix.outputs.completed_count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      pending_count: ${{ steps.matrix.outputs.pending_count }}
      source_run_id: ${{ steps.owner.outputs.source_run_id }}
      implementation_sha: ${{ steps.owner.outputs.implementation_sha }}

    steps:
      - name: Check out the protected capsule policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate the completed source workflow
        id: owner
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          owner=''
          for attempt in {1..120}; do
            if ! owner="$(github_api_retry \
                "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
                2>/dev/null)"; then
              owner=''
              sleep 2
              continue
            fi
            if [[ "$(jq -r .status <<< "$owner")" == completed ]]; then
              break
            fi
            sleep 2
          done
          test -n "$owner"
          implementation_sha="$(jq -er \
            '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<< "$owner")"
          [[ "$implementation_sha" == "$SOURCE_SHA" ]]
          [[ "$implementation_sha" == "$GITHUB_SHA" ]]
          jq -e \
            --arg implementation_sha "$implementation_sha" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and .status == "completed" and
             (.conclusion == "success" or .conclusion == "failure") and
             .event == "repository_dispatch" and .head_branch == "master" and
             .head_sha == $implementation_sha and
             .path == ".github/workflows/mod-compatibility-e2e.yml" and
             .head_repository.full_name == $repository' <<< "$owner" > /dev/null
          git fetch --no-tags origin "$implementation_sha"
          git merge-base --is-ancestor "$implementation_sha" "$GITHUB_SHA"
          current_master="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$current_master" == "$GITHUB_SHA" ]]
          printf 'implementation_sha=%s\n' "$implementation_sha" >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the exact source-owned compatibility plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mod-compatibility-plan
          path: ${{ runner.temp }}/compatibility-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.owner.outputs.source_run_id }}

      - name: Select every unique capsule produced by a successful lane
        id: matrix
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA: ${{ steps.owner.outputs.implementation_sha }}
          SOURCE_RUN_ID: ${{ steps.owner.outputs.source_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          plan="$RUNNER_TEMP/compatibility-plan/mod-compatibility-plan.json"
          test -f "$plan" -a ! -L "$plan"
          jq -e \
            '.schema_version == 1 and
             (.source_run_id | type == "number" and . > 0) and
             (.base_matrix_kind == "pr-anchors" or
              .base_matrix_kind == "native-anchors") and
             (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.source_branch | type == "string" and
              test("^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$")) and
             (.target_sha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.target_branch | type == "string" and
              test("^[a-z0-9]+(-and-[a-z0-9]+)*-[0-9]+([.][0-9]+)+$")) and
             (if .base_matrix_kind == "pr-anchors" then
                (.source_branch | test("^automation/sync/[A-Za-z0-9._/-]+$"))
              else .source_branch == .target_branch end) and
             .release_branch == .target_branch and
             (.compatibility_contract_sha256 | type == "string" and
              test("^[0-9a-f]{64}$")) and
             (.runnable | type == "array" and length <= 64) and
             (.not_applicable | type == "array" and length <= 64) and
             (.base_matrix_kind as $base_matrix_kind |
              .compatibility_contract_sha256 as $lock |
              all(.runnable[];
                (.id | type == "string" and test("^[a-z0-9][a-z0-9_-]{0,255}$")) and
                (.artifact_node | type == "string" and
                  test("^[a-z0-9][a-z0-9.-]{0,127}$")) and
                (.runtime_version | type == "string" and
                  test("^[0-9]+([.][0-9]+)+$")) and
                (.loader == "fabric" or .loader == "forge" or
                  .loader == "neoforge") and
                (.compatibility_mod | type == "string" and
                  test("^[a-z][a-z0-9-]{1,63}$")) and
                (.compatibility_name | type == "string" and
                  test("^[A-Za-z0-9][A-Za-z0-9 ._+-]{0,127}$")) and
                (.base_evidence_name | type == "string" and
                  test("^packaged-e2e-[a-z0-9_-]{1,255}$") and
                  (if $base_matrix_kind == "pr-anchors" then
                     endswith("--pr-behavior")
                   else endswith("--scheduled-behavior") end)) and
                .compatibility_contract_sha256 == $lock))' \
            "$plan" > /dev/null
          plan_source_sha="$(jq -er .source_sha "$plan")"
          git fetch --no-tags origin "$plan_source_sha"
          expected_lock="$(git show \
            "$plan_source_sha:e2e/mod-compatibility-contract.json" |
            sha256sum | cut -d ' ' -f 1)"
          [[ "$expected_lock" == \
            "$(jq -er .compatibility_contract_sha256 "$plan")" ]]
          target_branch="$(jq -er .target_branch "$plan")"
          target_sha="$(jq -er .target_sha "$plan")"
          [[ "$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/$target_branch" \
            --jq .commit.sha)" == "$target_sha" ]]

          artifacts="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          matrix="$(jq -c \
            --argjson artifacts "$artifacts" \
            --argjson compatibility_run_id "$SOURCE_RUN_ID" \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            '. as $plan |
             [$plan.runnable[] as $lane |
              ("mod-compatibility-review-input-" +
                ($compatibility_run_id|tostring) + "-" +
                $lane.id) as $name |
              [$artifacts.artifacts[] | select(.name == $name and .expired == false and
                .workflow_run.id == $compatibility_run_id and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                ((.size_in_bytes | type) == "number" and .size_in_bytes > 0 and
                 .size_in_bytes <= 536870912))] as $matches |
              if ($matches|length) > 1 then
                error("duplicate review capsule for " + $lane.id)
              elif ($matches|length) == 0 then empty
              else $matches[0] as $artifact |
                {id:$lane.id,artifact_node:$lane.artifact_node,
                 runtime_version:$lane.runtime_version,loader:$lane.loader,
                 mod:$lane.compatibility_mod,mod_name:$lane.compatibility_name,
                 base_evidence_name:$lane.base_evidence_name,
                 artifact_id:$artifact.id,artifact_name:$artifact.name,
                 artifact_size:$artifact.size_in_bytes,artifact_digest:$artifact.digest,
                 source_run_id:$compatibility_run_id,
                 implementation_sha:$implementation_sha,
                 source_sha:$plan.source_sha,target_branch:$plan.target_branch,
                 target_sha:$plan.target_sha}
              end] | {include:.}' "$plan")"
          count="$(jq '.include | length' <<< "$matrix")"
          [[ "$count" =~ ^[0-9]+$ ]]
          (( count <= $(jq '.runnable | length' "$plan") ))
          pending='{"include":[]}'
          completed_count=0
          while IFS= read -r lane; do
            lane_id="$(jq -er .id <<< "$lane")"
            completion_name="mod-compatibility-lane-complete-$SOURCE_RUN_ID-$lane_id"
            completions="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$completion_name&per_page=100")"
            jq -e --arg name "$completion_name" \
              '(.artifacts | type == "array" and length <= 100) and
               all(.artifacts[]; .name == $name)' <<< "$completions" > /dev/null
            authenticated=0
            while IFS=$'\t' read -r completion_run_id expired size digest head_sha; do
              [[ -n "$completion_run_id" && "$expired" == false ]] || continue
              [[ "$size" =~ ^[1-9][0-9]*$ ]] || continue
              (( size <= 1048576 )) || continue
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || continue
              [[ "$head_sha" == "$GITHUB_SHA" ]] || continue
              completion_owner="$(github_api_retry \
                "repos/$GITHUB_REPOSITORY/actions/runs/$completion_run_id" \
                2>/dev/null || true)"
              if [[ -n "$completion_owner" ]] && jq -e \
                  --arg implementation_sha "$GITHUB_SHA" \
                  --arg repository "$GITHUB_REPOSITORY" \
                  '.status == "completed" and
                   (.conclusion == "success" or .conclusion == "failure") and
                   .event == "repository_dispatch" and .head_branch == "master" and
                   .head_sha == $implementation_sha and
                   .path == ".github/workflows/mod-compatibility-review.yml" and
                   .head_repository.full_name == $repository' \
                  <<< "$completion_owner" > /dev/null; then
                authenticated=$((authenticated + 1))
              fi
            done < <(jq -r --arg name "$completion_name" \
              '.artifacts[] | select(.name == $name) |
               [.workflow_run.id, .expired, .size_in_bytes, .digest,
                .workflow_run.head_sha] | @tsv' <<< "$completions")
            (( authenticated <= 1 ))
            if (( authenticated == 1 )); then
              completed_count=$((completed_count + 1))
            else
              pending="$(jq -c --argjson lane "$lane" \
                '.include += [$lane]' <<< "$pending")"
            fi
          done < <(jq -c '.include[]' <<< "$matrix")
          pending_count="$(jq '.include | length' <<< "$pending")"
          [[ "$pending_count" =~ ^[0-9]+$ ]]
          (( completed_count + pending_count == count ))
          if (( pending_count > 0 )); then
            pending_input="$RUNNER_TEMP/mod-compatibility-pending.json"
            printf '%s\n' "$pending" > "$pending_input"
            pending="$(python3 scripts/ci/mod_compatibility_review_queue.py \
              --admit-matrix "$pending_input")"
            jq -e \
              '.include | length > 0 and
               all(.[];
                 (.model_parallelism | type == "number" and
                  floor == . and . >= 1 and . <= 32) and
                 (.model_start_delay_seconds | type == "number" and
                  floor == . and . >= 0 and . <= 30))' \
              <<< "$pending" > /dev/null
          fi
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'completed_count=%s\n' "$completed_count" >> "$GITHUB_OUTPUT"
          printf 'pending_count=%s\n' "$pending_count" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$pending" >> "$GITHUB_OUTPUT"

  capacity-check:
    name: Read shared Claude capacity
    needs: enumerate
    if: needs.enumerate.outputs.pending_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      probe_required: ${{ steps.circuit.outputs.probe_required }}
      ready: ${{ steps.circuit.outputs.ready }}
      state: ${{ steps.circuit.outputs.state }}

    steps:
      - name: Check out the protected capacity policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reuse only a fresh authenticated capacity marker
        id: circuit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/claude_capacity_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --implementation-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report an active subscription pause
        if: >-
          steps.circuit.outputs.probe_required == 'false' &&
          steps.circuit.outputs.ready == 'false'
        run: |
          printf 'Claude capacity remains paused; every unfinished compatibility lane remains queued.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  capacity-probe:
    name: Probe shared Claude capacity once
    needs:
      - enumerate
      - capacity-check
    if: >-
      needs.enumerate.outputs.pending_count != '0' &&
      (needs.capacity-check.outputs.probe_required == 'true' ||
       needs.capacity-check.outputs.ready == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    concurrency:
      group: quick-skin-claude-capacity-probe
      cancel-in-progress: false
    outputs:
      fresh_ready: ${{ steps.resolve.outputs.fresh_ready }}
      ready: ${{ steps.resolve.outputs.ready }}

    steps:
      - name: Check out the protected capacity probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Recheck capacity after acquiring the global probe slot
        id: circuit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/claude_capacity_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --implementation-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Node for the locked capacity probe
        if: >-
          steps.circuit.outputs.probe_required == 'true' ||
          steps.circuit.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked Claude Code outside the repository
        if: >-
          steps.circuit.outputs.probe_required == 'true' ||
          steps.circuit.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-capacity-cli"
          cp .github/claude/package.json .github/claude/package-lock.json \
            "$RUNNER_TEMP/claude-capacity-cli/"
          (
            cd "$RUNNER_TEMP/claude-capacity-cli"
            npm ci --ignore-scripts
            node node_modules/@anthropic-ai/claude-code/install.cjs
            node_modules/.bin/claude --version
          )

      - name: Probe once without tools before parallel review fan-out
        id: probe
        if: >-
          steps.circuit.outputs.probe_required == 'true' ||
          steps.circuit.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          python3 scripts/ci/claude_capacity_probe.py \
            --claude \
              "$RUNNER_TEMP/claude-capacity-cli/node_modules/.bin/claude" \
            --model claude-haiku-4-5 \
            --work-root "$RUNNER_TEMP/claude-capacity-probe" \
            --marker "$RUNNER_TEMP/claude-capacity-marker.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish only the sanitized shared capacity marker
        if: >-
          (steps.circuit.outputs.probe_required == 'true' ||
           steps.circuit.outputs.ready == 'true') &&
          steps.probe.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.probe.outputs.marker_name }}
          path: ${{ runner.temp }}/claude-capacity-marker.json
          if-no-files-found: error
          retention-days: 1

      - name: Resolve whether model sessions may start
        id: resolve
        if: always() && steps.circuit.outcome == 'success' && steps.probe.outcome != 'failure'
        shell: bash
        env:
          CACHED_READY: ${{ steps.circuit.outputs.ready }}
          PROBE_READY: ${{ steps.probe.outputs.ready }}
          PROBE_REQUIRED: ${{ steps.circuit.outputs.probe_required }}
        run: |
          set -euo pipefail
          [[ "$CACHED_READY" == true || "$CACHED_READY" == false ]]
          [[ "$PROBE_REQUIRED" == true || "$PROBE_REQUIRED" == false ]]
          fresh_ready=false
          if [[ "$PROBE_REQUIRED" == true || "$CACHED_READY" == true ]]; then
            [[ "$PROBE_READY" == true || "$PROBE_READY" == false ]]
            ready="$PROBE_READY"
            fresh_ready="$PROBE_READY"
          else
            ready="$CACHED_READY"
          fi
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          printf 'fresh_ready=%s\n' "$fresh_ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            printf 'Claude capacity is paused; every unfinished compatibility lane remains queued.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  review:
    name: ${{ matrix.artifact_node }} / ${{ matrix.mod_name }}
    needs:
      - enumerate
      - capacity-check
      - capacity-probe
    if: >-
      always() &&
      needs.enumerate.outputs.pending_count != '0' &&
      needs.capacity-check.result == 'success' &&
      needs.capacity-probe.result == 'success' &&
      needs.capacity-probe.outputs.fresh_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.enumerate.outputs.matrix) }}

    steps:
      - name: Check out the exact protected reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate current master before capsule or model admission
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          SOURCE_IMPLEMENTATION_SHA: ${{ matrix.implementation_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$SOURCE_IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_IMPLEMENTATION_SHA" == "$GITHUB_SHA" ]]
          current_master="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          [[ "$current_master" == "$GITHUB_SHA" ]]

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked image decoder
        run: |
          python3 -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            --requirement scripts/pages/requirements.txt

      - name: Fetch and authenticate only the curated capsule
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ matrix.artifact_digest }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ARTIFACT_SIZE: ${{ matrix.artifact_size }}
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ matrix.source_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( ARTIFACT_SIZE <= 536870912 ))
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_NAME" == \
            "mod-compatibility-review-input-$SOURCE_RUN_ID-${{ matrix.id }}" ]]
          metadata="$(github_api_retry \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg name "$ARTIFACT_NAME" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --argjson size "$ARTIFACT_SIZE" \
            '.id == $artifact_id and .name == $name and .digest == $digest and
             .size_in_bytes == $size and .expired == false and
             .workflow_run.id == $run_id' <<< "$metadata" > /dev/null
          archive="$RUNNER_TEMP/mod-compatibility-capsule.zip"
          github_api_retry_to_file "$archive" \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          [[ "$(stat -c %s "$archive")" == "$ARTIFACT_SIZE" ]]
          [[ "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)" == \
             "$ARTIFACT_DIGEST" ]]
          capsule="$RUNNER_TEMP/mod-compatibility-capsule"
          python3 scripts/ci/bounded_zip.py "$archive" "$capsule" \
            --max-archive-bytes 536870912 \
            --max-entries 520 \
            --max-total-bytes 536870912 \
            --max-file-bytes 33554432 \
            --max-compression-ratio 200 > /dev/null
          rm -f -- "$archive"
          proof="$capsule/curation-proof.json"
          manifest="$capsule/review-input/visual-review-manifest.json"
          test -f "$proof" -a -f "$manifest"
          test -d "$capsule/review-input/images"
          [[ -z "$(find "$capsule/review-input/images" -mindepth 2 -print -quit)" ]]
          jq -e \
            --arg artifact_node "${{ matrix.artifact_node }}" \
            --arg implementation_sha "${{ matrix.implementation_sha }}" \
            --arg loader "${{ matrix.loader }}" \
            --arg mod "${{ matrix.mod }}" \
            --arg runtime_version "${{ matrix.runtime_version }}" \
            --arg source_sha "${{ matrix.source_sha }}" \
            --arg target_branch "${{ matrix.target_branch }}" \
            --arg target_sha "${{ matrix.target_sha }}" \
            --argjson compatibility_run_id "$SOURCE_RUN_ID" \
            '(keys | sort) == (["artifact_inventory", "artifact_node",
              "compatibility_contract_sha256", "compatibility_run_id", "frame_count",
              "implementation_sha", "kind", "loader", "manifest_sha256", "mod",
              "mod_name", "mod_version", "mod_version_id", "runtime_version",
              "scenario_contract_sha256", "schema_version", "source_run_id", "source_sha",
              "target_branch", "target_sha"] | sort) and
             .schema_version == 1 and
             .kind == "quick-skin-mod-compatibility-review-input" and
             .compatibility_run_id == $compatibility_run_id and
             .implementation_sha == $implementation_sha and
             .artifact_node == $artifact_node and .runtime_version == $runtime_version and
             .loader == $loader and .mod == $mod and .source_sha == $source_sha and
             .target_branch == $target_branch and .target_sha == $target_sha and
             (.source_run_id | type == "number" and . > 0) and
             (.scenario_contract_sha256 | type == "string" and
              test("^[0-9a-f]{64}$")) and
             (.compatibility_contract_sha256 | type == "string" and
              test("^[0-9a-f]{64}$")) and
             (.manifest_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
             (.frame_count | type == "number" and . > 0 and . <= 512)' \
            "$proof" > /dev/null
          [[ "$(sha256sum "$manifest" | cut -d ' ' -f 1)" == \
            "$(jq -er .manifest_sha256 "$proof")" ]]
          [[ "$(jq length "$manifest")" == "$(jq -er .frame_count "$proof")" ]]
          git fetch --no-tags origin "${{ matrix.source_sha }}"
          source_contract="$RUNNER_TEMP/source-scenario-contract.json"
          git show "${{ matrix.source_sha }}:e2e/scenario-contract.json" \
            > "$source_contract"
          [[ "$(sha256sum "$source_contract" | cut -d ' ' -f 1)" == \
            "$(jq -er .scenario_contract_sha256 "$proof")" ]]
          [[ "$(git show \
              "${{ matrix.source_sha }}:e2e/mod-compatibility-contract.json" |
              sha256sum | cut -d ' ' -f 1)" == \
            "$(jq -er .compatibility_contract_sha256 "$proof")" ]]

          for kind in base candidate; do
            artifact_id="$(jq -er ".artifact_inventory.$kind.id" "$proof")"
            artifact_run_id="$(jq -er ".artifact_inventory.$kind.run_id" "$proof")"
            artifact_name="$(jq -er ".artifact_inventory.$kind.name" "$proof")"
            artifact_size="$(jq -er ".artifact_inventory.$kind.size_in_bytes" "$proof")"
            artifact_digest="$(jq -er ".artifact_inventory.$kind.digest" "$proof")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_size" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            raw_metadata="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            jq -e \
              --arg digest "$artifact_digest" \
              --arg name "$artifact_name" \
              --argjson artifact_id "$artifact_id" \
              --argjson run_id "$artifact_run_id" \
              --argjson size "$artifact_size" \
              '.id == $artifact_id and .name == $name and .digest == $digest and
               .size_in_bytes == $size and .expired == false and
               .workflow_run.id == $run_id' <<< "$raw_metadata" > /dev/null
            raw_owner="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id")"
            if [[ "$kind" == base ]]; then
              [[ "$artifact_name" == "${{ matrix.base_evidence_name }}" ]]
              [[ "$artifact_run_id" == "$(jq -er .source_run_id "$proof")" ]]
              jq -e \
                --arg source_sha "${{ matrix.source_sha }}" \
                --arg repository "$GITHUB_REPOSITORY" \
                '.status == "completed" and .conclusion == "success" and
                 .head_sha == $source_sha and .path == ".github/workflows/on-demand-e2e.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$raw_owner" > /dev/null
            else
              [[ "$artifact_name" == "mod-compatibility-e2e-${{ matrix.id }}" ]]
              [[ "$artifact_run_id" == "$SOURCE_RUN_ID" ]]
              jq -e \
                --arg implementation_sha "${{ matrix.implementation_sha }}" \
                --arg repository "$GITHUB_REPOSITORY" \
                '.status == "completed" and
                 (.conclusion == "success" or .conclusion == "failure") and
                 .head_sha == $implementation_sha and
                 .path == ".github/workflows/mod-compatibility-e2e.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$raw_owner" > /dev/null
            fi
          done
          python3 e2e/check_visual_review.py \
            --manifest "$manifest" \
            --input-root "$capsule/review-input" \
            --require-paired \
            --compatibility-scenario-contract "$source_contract" \
            --compatibility-artifact-node "${{ matrix.artifact_node }}" \
            --compatibility-mod "${{ matrix.mod }}" \
            --validate-input-only
          sha256sum "$manifest" > "$RUNNER_TEMP/mod-compatibility-manifest.sha256"

      - name: Restore authenticated compatibility verdict cache shards
        id: verdict-cache
        continue-on-error: true
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/ci/github_api_retry.sh"
          printf 'restored=false\n' >> "$GITHUB_OUTPUT"
          printf 'artifact_ids=\n' >> "$GITHUB_OUTPUT"
          policy_sha256="$(python3 \
            "$GITHUB_WORKSPACE/e2e/visual_review_cache.py" policy \
            --runner "$GITHUB_WORKSPACE/e2e/visual_review_runner.py" \
            --checker "$GITHUB_WORKSPACE/e2e/check_visual_review.py" \
            --cache-codec "$GITHUB_WORKSPACE/e2e/visual_review_cache.py" \
            --similarity-codec "$GITHUB_WORKSPACE/e2e/visual_similarity.py" \
            --scenario-contract \
              "$GITHUB_WORKSPACE/e2e/mod-compatibility-contract.json" \
            --release-matrix "$GITHUB_WORKSPACE/release/release-matrix.json" \
            --provider-lock "$GITHUB_WORKSPACE/.github/claude/package-lock.json" \
            --triage-prompt \
              "$GITHUB_WORKSPACE/e2e/mod_compatibility_review_prompt.md" \
            --verify-prompt \
              "$GITHUB_WORKSPACE/e2e/mod_compatibility_review_verify_prompt.md" \
            --triage-model claude-haiku-4-5 \
            --verify-model claude-opus-5 \
            --review-mode reference-comparison \
            --triage-chunk-size 8 \
            --verify-chunk-size 4)"
          [[ "$policy_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'policy_sha256=%s\n' "$policy_sha256" >> "$GITHUB_OUTPUT"
          cache_name="mod-compatibility-verdict-cache-$policy_sha256-${{ matrix.id }}"
          if ! artifacts="$(github_api_retry --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$cache_name&per_page=100")"; then
            exit 0
          fi
          if ! jq -e \
            '(type == "array") and
             ([.[] | (.artifacts | type == "array")] | all) and
             ([.[].artifacts[]] | length <= 100)' \
              <<< "$artifacts" > /dev/null; then
            exit 0
          fi
          cache_arguments=()
          cache_ids=()
          while IFS=$'\t' read -r candidate_id candidate_run_id; do
            [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]
            candidate_run="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id" \
              2>/dev/null || true)"
            if [[ -z "$candidate_run" ]] || ! jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --argjson run_id "$candidate_run_id" \
                '.id == $run_id and .status == "completed" and
                 (.conclusion == "success" or .conclusion == "failure") and
                 (.event == "repository_dispatch" or .event == "schedule" or
                  .event == "workflow_dispatch") and
                 .head_branch == "master" and
                 (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
                 .path == ".github/workflows/mod-compatibility-review.yml" and
                 .head_repository.full_name == $repository' \
                <<< "$candidate_run" > /dev/null; then
              continue
            fi
            cache_owner_sha="$(jq -er .head_sha <<< "$candidate_run")"
            if ! git -C "$GITHUB_WORKSPACE" cat-file -e \
                "$cache_owner_sha^{commit}" 2>/dev/null; then
              if ! git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
                  "$cache_owner_sha"; then
                continue
              fi
            fi
            if ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
                "$cache_owner_sha" "$GITHUB_SHA"; then
              continue
            fi
            owner_producer="$(git -C "$GITHUB_WORKSPACE" rev-parse \
              "$cache_owner_sha:.github/workflows/mod-compatibility-review.yml" \
              2>/dev/null || true)"
            current_producer="$(git -C "$GITHUB_WORKSPACE" rev-parse \
              "$GITHUB_SHA:.github/workflows/mod-compatibility-review.yml")"
            if [[ -z "$owner_producer" \
                || "$owner_producer" != "$current_producer" ]]; then
              continue
            fi
            cache_metadata="$(jq -c --argjson id "$candidate_id" \
              '[.[].artifacts[] | select(.id == $id)] |
               if length == 1 then .[0] else empty end' <<< "$artifacts")"
            if [[ -z "$cache_metadata" ]]; then
              continue
            fi
            if ! cache_size="$(jq -er .size_in_bytes <<< "$cache_metadata")" || \
                ! cache_digest="$(jq -er \
                  '.digest | select(type == "string" and
                    test("^sha256:[0-9a-f]{64}$"))' <<< "$cache_metadata")"; then
              continue
            fi
            cache_archive="$RUNNER_TEMP/mod-compatibility-verdict-cache-$candidate_id.zip"
            if ! github_api_retry_to_file "$cache_archive" \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$candidate_id/zip"; then
              continue
            fi
            if [[ "$(stat -c %s "$cache_archive")" != "$cache_size" ]] || \
                [[ "sha256:$(sha256sum "$cache_archive" | cut -d ' ' -f 1)" != \
                  "$cache_digest" ]]; then
              rm -f -- "$cache_archive"
              continue
            fi
            cache_root="$RUNNER_TEMP/restored-mod-compatibility-cache-$candidate_id"
            if ! python3 "$GITHUB_WORKSPACE/scripts/ci/bounded_zip.py" \
                "$cache_archive" "$cache_root" \
                --max-archive-bytes 4194304 \
                --max-entries 1 \
                --max-total-bytes 4194304 \
                --max-file-bytes 4194304 \
                --max-compression-ratio 200 > /dev/null; then
              rm -f -- "$cache_archive"
              continue
            fi
            rm -f -- "$cache_archive"
            restored="$cache_root/visual-review-verdict-cache.json"
            normalized="$RUNNER_TEMP/mod-compatibility-verdict-cache-$candidate_id.json"
            if [[ ! -f "$restored" || -L "$restored" ]] || \
                ! python3 "$GITHUB_WORKSPACE/e2e/visual_review_cache.py" validate \
                  --cache "$restored" \
                  --policy-sha256 "$policy_sha256" \
                  --normalized-output "$normalized"; then
              continue
            fi
            cache_arguments+=(--cache "$normalized")
            cache_ids+=("$candidate_id")
            if (( ${#cache_ids[@]} == 32 )); then
              break
            fi
          done < <(jq -r --arg name "$cache_name" \
            '[.[].artifacts[] |
              select(.name == $name and .expired == false and
                (.size_in_bytes | type == "number" and . > 0 and . <= 4194304) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                (.id | type == "number" and . > 0) and
                (.workflow_run.id | type == "number" and . > 0))] |
             sort_by(.created_at, .id) | reverse | .[] |
             [.id, .workflow_run.id] | @tsv' <<< "$artifacts" || true)
          if (( ${#cache_ids[@]} == 0 )); then
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/e2e/visual_review_cache.py" combine \
            "${cache_arguments[@]}" \
            --policy-sha256 "$policy_sha256" \
            --output visual-review-verdict-cache.input.json
          cache_id_list="$(IFS=,; printf '%s' "${cache_ids[*]}")"
          [[ "$cache_id_list" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          printf 'artifact_ids=%s\n' "$cache_id_list" >> "$GITHUB_OUTPUT"
          printf 'restored=true\n' >> "$GITHUB_OUTPUT"

      - name: Install Node for the locked Claude CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked Claude Code outside the repository
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-cli"
          cp .github/claude/package.json .github/claude/package-lock.json \
            "$RUNNER_TEMP/claude-cli/"
          (
            cd "$RUNNER_TEMP/claude-cli"
            npm ci --ignore-scripts
            node node_modules/@anthropic-ai/claude-code/install.cjs
            node_modules/.bin/claude --version
          )

      - name: Reuse exact regions, then review with Haiku and selective Opus
        id: model
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          admission_delay="${{ matrix.model_start_delay_seconds }}"
          [[ "$admission_delay" =~ ^([0-9]|[12][0-9]|30)$ ]]
          if (( admission_delay > 0 )); then
            sleep "$admission_delay"
          fi
          cache_arguments=()
          if [[ "${{ steps.verdict-cache.outputs.restored }}" == true ]]; then
            cache_arguments=(
              --cache visual-review-verdict-cache.input.json
              --cache-policy-sha256 \
                "${{ steps.verdict-cache.outputs.policy_sha256 }}"
            )
          fi
          model_status=0
          python3 "$GITHUB_WORKSPACE/e2e/visual_review_runner.py" \
            --capsule . \
            --manifest review-input/visual-review-manifest.json \
            --input-root review-input \
            --review-mode reference-comparison \
            --claude "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" \
            --triage-prompt "$GITHUB_WORKSPACE/e2e/mod_compatibility_review_prompt.md" \
            --verify-prompt "$GITHUB_WORKSPACE/e2e/mod_compatibility_review_verify_prompt.md" \
            --triage-model claude-haiku-4-5 \
            --verify-model claude-opus-5 \
            --triage-chunk-size 8 \
            --verify-chunk-size 4 \
            --max-parallel-calls "${{ matrix.model_parallelism }}" \
            --model-attempts 3 \
            --call-spacing-seconds 2 \
            "${cache_arguments[@]}" \
            --output visual-review-report.staged.json \
            --completion-state visual-review-completion.json \
            --failure-report visual-review-failure.json \
            || model_status=$?
          printf 'model_status=%s\n' "$model_status" >> "$GITHUB_OUTPUT"

      - name: Normalize and classify the protected verdict
        id: check
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        shell: bash
        env:
          MODEL_STATUS: ${{ steps.model.outputs.model_status }}
        run: |
          set -euo pipefail
          printf 'confirmed_defect=false\n' >> "$GITHUB_OUTPUT"
          [[ "$MODEL_STATUS" =~ ^[0-9]{1,3}$ ]]
          if (( MODEL_STATUS != 0 )); then
            exit "$MODEL_STATUS"
          fi
          sha256sum --check "$RUNNER_TEMP/mod-compatibility-manifest.sha256"
          state="$(jq -er '.state | select(. == "complete" or
            . == "blocking-partial")' visual-review-completion.json)"
          report_arguments=(
            --manifest review-input/visual-review-manifest.json
            --report visual-review-report.staged.json
            --normalized-report visual-review-report.json
            --require-paired
          )
          if [[ "$state" == blocking-partial ]]; then
            jq -e 'length > 0 and all(.[]; .defect == true)' \
              visual-review-report.staged.json > /dev/null
            report_arguments+=(--allow-blocking-partial)
          fi
          review_status=0
          python3 "$GITHUB_WORKSPACE/e2e/check_visual_review.py" \
            "${report_arguments[@]}" || review_status=$?
          test -s visual-review-report.json
          if (( review_status == 1 )); then
            jq -e 'length > 0 and any(.[]; .defect == true)' \
              visual-review-report.json > /dev/null
            printf 'confirmed_defect=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (( review_status == 0 ))
          [[ "$state" == complete ]]

      - name: Publish the protected compatibility verdict cache
        id: publish-verdict-cache
        if: >-
          always() && steps.check.outcome == 'success' &&
          steps.model.outputs.model_status == '0' &&
          steps.verdict-cache.outputs.policy_sha256 != ''
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          update_arguments=()
          if [[ -f visual-review-verdict-cache.input.json ]]; then
            update_arguments=(--existing-cache visual-review-verdict-cache.input.json)
          fi
          python3 "$GITHUB_WORKSPACE/e2e/visual_review_cache.py" update \
            "${update_arguments[@]}" \
            --manifest review-input/visual-review-manifest.json \
            --report visual-review-report.json \
            --policy-sha256 "${{ steps.verdict-cache.outputs.policy_sha256 }}" \
            --review-mode reference-comparison \
            --output visual-review-verdict-cache.json
          printf 'artifact_name=mod-compatibility-verdict-cache-%s-%s\n' \
            "${{ steps.verdict-cache.outputs.policy_sha256 }}" \
            "${{ matrix.id }}" >> "$GITHUB_OUTPUT"

      - name: Upload the protected compatibility verdict cache
        id: verdict-cache-artifact
        if: always() && steps.publish-verdict-cache.outputs.artifact_name != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish-verdict-cache.outputs.artifact_name }}
          path: ${{ runner.temp }}/mod-compatibility-capsule/visual-review-verdict-cache.json
          if-no-files-found: error
          retention-days: 7

      - name: Retire consumed compatibility verdict cache shards
        if: >-
          always() && steps.verdict-cache.outputs.restored == 'true' &&
          steps.verdict-cache-artifact.outputs.artifact-id != ''
        continue-on-error: true
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          old_id_list="${{ steps.verdict-cache.outputs.artifact_ids }}"
          new_id="${{ steps.verdict-cache-artifact.outputs.artifact-id }}"
          cache_name="${{ steps.publish-verdict-cache.outputs.artifact_name }}"
          expected_cache_name="mod-compatibility-verdict-cache-${{ steps.verdict-cache.outputs.policy_sha256 }}-${{ matrix.id }}"
          [[ "$old_id_list" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          [[ "$new_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$cache_name" == "$expected_cache_name" ]]
          IFS=, read -r -a old_ids <<< "$old_id_list"
          for old_id in "${old_ids[@]}"; do
            [[ "$old_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$old_id" != "$new_id" ]]
            metadata="$(github_api_retry \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$old_id" \
              2>/dev/null || true)"
            if [[ -z "$metadata" ]]; then
              continue
            fi
            jq -e \
              --arg name "$cache_name" \
              --argjson artifact_id "$old_id" \
              '.id == $artifact_id and .name == $name and .expired == false' \
              <<< "$metadata" > /dev/null
            github_api_retry --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$old_id" > /dev/null
          done

      - name: Classify a failed lane without provider text
        id: failure
        if: always() && steps.check.outcome != 'success'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          capsule="$RUNNER_TEMP/mod-compatibility-capsule"
          mkdir -p "$capsule"
          failure="$capsule/visual-review-failure.json"
          if [[ ! -f "$failure" ]]; then
            jq -n \
              '{schema_version:1,category:"protected_validation",
                stage:"compatibility",transient:false}' \
              > "$failure"
          fi
          jq -e \
            '(keys | sort) == (["category", "schema_version", "stage",
              "transient"] | sort) and
             .schema_version == 1 and
             (.category | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
             (.stage | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
             (.transient | type == "boolean")' "$failure" > /dev/null
          category="$(jq -er .category "$failure")"
          printf 'category=%s\n' "$category" >> "$GITHUB_OUTPUT"
          cp -- "$failure" \
            "$RUNNER_TEMP/mod-compatibility-failure-${{ matrix.id }}.json"

      - name: Upload only the sanitized failed-lane marker
        if: always() && steps.failure.outputs.category != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-attempt-${{ matrix.source_run_id }}-${{ matrix.id }}
          path: ${{ runner.temp }}/mod-compatibility-failure-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload the exact normalized lane report
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-review-${{ matrix.source_run_id }}-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/mod-compatibility-capsule/curation-proof.json
            ${{ runner.temp }}/mod-compatibility-capsule/review-input/visual-review-manifest.json
            ${{ runner.temp }}/mod-compatibility-capsule/visual-review-report.json
            ${{ runner.temp }}/mod-compatibility-capsule/visual-review-completion.json
          if-no-files-found: error
          retention-days: 7

      - name: Create a clean lane completion marker
        if: >-
          steps.check.outcome == 'success' &&
          steps.check.outputs.confirmed_defect == 'false'
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        shell: bash
        run: |
          set -euo pipefail
          report_sha256="$(sha256sum visual-review-report.json | cut -d ' ' -f 1)"
          jq -n \
            --arg lane "${{ matrix.id }}" \
            --arg report_sha256 "$report_sha256" \
            --argjson source_run_id "${{ matrix.source_run_id }}" \
            '{schema_version:1,kind:"quick-skin-mod-compatibility-lane-complete",
              source_run_id:$source_run_id,lane:$lane,
              report_sha256:$report_sha256}' \
            > mod-compatibility-lane-complete.json

      - name: Upload the durable clean lane marker
        if: >-
          steps.check.outcome == 'success' &&
          steps.check.outputs.confirmed_defect == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-lane-complete-${{ matrix.source_run_id }}-${{ matrix.id }}
          path: ${{ runner.temp }}/mod-compatibility-capsule/mod-compatibility-lane-complete.json
          if-no-files-found: error
          retention-days: 7

      - name: Create an Opus-confirmed wave block
        id: block
        if: steps.check.outputs.confirmed_defect == 'true'
        working-directory: ${{ runner.temp }}/mod-compatibility-capsule
        shell: bash
        run: |
          set -euo pipefail
          report_sha256="$(sha256sum visual-review-report.json | cut -d ' ' -f 1)"
          jq -n \
            --arg lane "${{ matrix.id }}" \
            --arg mod "${{ matrix.mod }}" \
            --arg report_sha256 "$report_sha256" \
            --arg target_sha "${{ matrix.target_sha }}" \
            --argjson source_run_id "${{ matrix.source_run_id }}" \
            '{schema_version:1,kind:"quick-skin-mod-compatibility-wave-block",
              source_run_id:$source_run_id,target_sha:$target_sha,lane:$lane,
              mod:$mod,report_sha256:$report_sha256}' \
            > mod-compatibility-wave-block.json

      - name: Upload the durable confirmed-defect marker
        id: block-artifact
        if: steps.check.outputs.confirmed_defect == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-wave-block-${{ matrix.source_run_id }}
          path: ${{ runner.temp }}/mod-compatibility-capsule/mod-compatibility-wave-block.json
          if-no-files-found: error
          retention-days: 7

      - name: Cancel every sibling session after the durable Opus block exists
        if: steps.block-artifact.outputs.artifact-id != ''
        shell: bash
        env:
          GITHUB_API_RETRY_ATTEMPTS: "10"
          GITHUB_API_RETRY_MAX_DELAY_SECONDS: "60"
          GITHUB_API_RETRY_MAX_WAIT_SECONDS: "3700"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          github_api_retry --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          exit 1

  gate:
    name: AI mod compatibility gate
    needs:
      - enumerate
      - capacity-check
      - capacity-probe
      - review
    if: always() && needs.enumerate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    outputs:
      complete: ${{ steps.result.outputs.complete }}

    steps:
      - name: Download sanitized failed-lane markers from this attempt
        if: always() && needs.review.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mod-compatibility-attempt-${{ needs.enumerate.outputs.source_run_id }}-*
          path: ${{ runner.temp }}/compatibility-attempts
          merge-multiple: true

      - name: Detect a quota rejection without reading provider output
        id: failures
        if: always() && needs.review.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          printf 'quota_rejected=false\n' >> "$GITHUB_OUTPUT"
          attempts="$RUNNER_TEMP/compatibility-attempts"
          [[ ! -e "$attempts" || -d "$attempts" ]]
          [[ -z "$(find "$attempts" -mindepth 2 -print -quit 2>/dev/null || true)" ]]
          while IFS= read -r -d '' failure; do
            name="$(basename "$failure")"
            [[ -f "$failure" && ! -L "$failure" ]]
            [[ "$name" =~ ^mod-compatibility-failure-[a-z0-9][a-z0-9_-]{0,255}\.json$ ]]
            jq -e \
              '(keys | sort) == (["category", "schema_version", "stage",
                "transient"] | sort) and
               .schema_version == 1 and
               (.category | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
               (.stage | type == "string" and test("^[a-z0-9_-]{1,64}$")) and
               (.transient | type == "boolean")' "$failure" > /dev/null
            if [[ "$(jq -er .category "$failure")" == quota_or_rate_limit ]]; then
              printf 'quota_rejected=true\n' >> "$GITHUB_OUTPUT"
            fi
          done < <(find "$attempts" -mindepth 1 -maxdepth 1 -type f -print0 \
            2>/dev/null || true)

      - name: Create one sanitized shared pause marker
        if: always() && steps.failures.outputs.quota_rejected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            '{schema_version:1,category:"quota_or_rate_limit",
              stage:"compatibility",transient:true}' \
            > "$RUNNER_TEMP/claude-capacity-marker.json"

      - name: Open the shared Claude circuit after a quota rejection
        if: always() && steps.failures.outputs.quota_rejected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-capacity-pause
          path: ${{ runner.temp }}/claude-capacity-marker.json
          if-no-files-found: error
          retention-days: 1

      - name: Resolve the durable compatibility review state
        id: result
        if: always()
        shell: bash
        env:
          CACHED_READY: ${{ needs.capacity-check.outputs.ready }}
          CAPACITY_STATE: ${{ needs.capacity-check.outputs.state }}
          CAPACITY_CHECK_RESULT: ${{ needs.capacity-check.result }}
          COMPLETED_COUNT: ${{ needs.enumerate.outputs.completed_count }}
          COUNT: ${{ needs.enumerate.outputs.count }}
          PENDING_COUNT: ${{ needs.enumerate.outputs.pending_count }}
          PROBE_FRESH_READY: ${{ needs.capacity-probe.outputs.fresh_ready }}
          PROBE_READY: ${{ needs.capacity-probe.outputs.ready }}
          PROBE_REQUIRED: ${{ needs.capacity-check.outputs.probe_required }}
          PROBE_RESULT: ${{ needs.capacity-probe.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail
          [[ "$COUNT" =~ ^[0-9]+$ ]]
          [[ "$COMPLETED_COUNT" =~ ^[0-9]+$ ]]
          [[ "$PENDING_COUNT" =~ ^[0-9]+$ ]]
          (( COMPLETED_COUNT + PENDING_COUNT == COUNT ))
          printf 'complete=false\n' >> "$GITHUB_OUTPUT"
          if (( PENDING_COUNT == 0 )); then
            [[ "$REVIEW_RESULT" == skipped ]]
            printf 'complete=true\n' >> "$GITHUB_OUTPUT"
            printf 'All %s available compatibility lanes were already reviewed.\n' \
              "$COUNT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          [[ "$CAPACITY_CHECK_RESULT" == success ]]
          [[ "$CACHED_READY" == true || "$CACHED_READY" == false ]]
          [[ "$CAPACITY_STATE" == unknown || "$CAPACITY_STATE" == ready ||
             "$CAPACITY_STATE" == paused ]]
          [[ "$PROBE_REQUIRED" == true || "$PROBE_REQUIRED" == false ]]
          ready=false
          if [[ "$CAPACITY_STATE" == paused ]]; then
            [[ "$CACHED_READY" == false ]]
            [[ "$PROBE_REQUIRED" == false ]]
            [[ "$PROBE_RESULT" == skipped ]]
          else
            [[ "$PROBE_RESULT" == success ]]
            [[ "$PROBE_READY" == true || "$PROBE_READY" == false ]]
            [[ "$PROBE_FRESH_READY" == true || "$PROBE_FRESH_READY" == false ]]
            [[ "$PROBE_READY" == "$PROBE_FRESH_READY" ]]
            ready="$PROBE_FRESH_READY"
          fi
          if [[ "$ready" == true ]]; then
            [[ "$REVIEW_RESULT" == success ]]
            printf 'complete=true\n' >> "$GITHUB_OUTPUT"
            printf 'All %s compatibility lanes passed durable independent visual review.\n' \
              "$COUNT" >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$REVIEW_RESULT" == skipped ]]
            printf 'Claude capacity is paused; %s unfinished compatibility lanes remain queued.\n' \
              "$PENDING_COUNT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create the authenticated source completion marker
        if: always() && steps.result.outputs.complete == 'true'
        shell: bash
        env:
          COMPLETED_COUNT: ${{ needs.enumerate.outputs.completed_count }}
          COUNT: ${{ needs.enumerate.outputs.count }}
          IMPLEMENTATION_SHA: ${{ needs.enumerate.outputs.implementation_sha }}
          PENDING_COUNT: ${{ needs.enumerate.outputs.pending_count }}
          SOURCE_RUN_ID: ${{ needs.enumerate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$COUNT" =~ ^[0-9]+$ ]]
          [[ "$COMPLETED_COUNT" =~ ^[0-9]+$ ]]
          [[ "$PENDING_COUNT" =~ ^[0-9]+$ ]]
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg implementation_sha "$IMPLEMENTATION_SHA" \
            --argjson lane_count "$COUNT" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '{schema_version:1,kind:"quick-skin-mod-compatibility-review-complete",
              source_run_id:$source_run_id,implementation_sha:$implementation_sha,
              lane_count:$lane_count}' \
            > "$RUNNER_TEMP/mod-compatibility-review-complete.json"

      - name: Upload the durable source completion marker
        if: always() && steps.result.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-compatibility-review-complete-${{ needs.enumerate.outputs.source_run_id }}
          path: ${{ runner.temp }}/mod-compatibility-review-complete.json
          if-no-files-found: error
          retention-days: 7

  request-publication:
    name: Request post-success compatibility publication
    needs:
      - enumerate
      - gate
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.gate.outputs.complete == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch the completed source into a fresh protected publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.enumerate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          payload="$RUNNER_TEMP/mod-compatibility-publication-request.json"
          jq -n \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            '{event_type:"mod-compatibility-publication-requested",client_payload:{
              source_run_id:$source_run_id}}' > "$payload"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$payload" > /dev/null

  publish-evidence:
    name: Publish compact compatibility evidence
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'repository_dispatch' &&
        github.event.action == 'mod-compatibility-publication-requested') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the protected compatibility publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked evidence decoder and encoder
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement scripts/pages/requirements.txt

      - name: Authenticate, compact and bind the complete clean wave
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_RUN_ID: >-
            ${{ github.event_name == 'repository_dispatch' &&
            github.event.client_payload.source_run_id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(github_api_retry "repos/$GITHUB_REPOSITORY/branches/master" \
             --jq .commit.sha)" == \
             "$GITHUB_SHA" ]]
          python3 scripts/pages/collect_compatibility.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$REQUESTED_SOURCE_RUN_ID" \
            --current-implementation-sha "$GITHUB_SHA" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --output public-compatibility \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the compact public compatibility handoff
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: public-compatibility/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Wake the protected Pages publisher
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.collect.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          BRANCH: ${{ steps.collect.outputs.branch }}
          COMPATIBILITY_RUN_ID: ${{ steps.collect.outputs.compatibility_run_id }}
          COVERAGE_SHA: ${{ steps.collect.outputs.coverage_sha }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.collect.outputs.target_sha }}
        run: |
          set -euo pipefail
          source scripts/ci/github_api_retry.sh
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_NAME" == "pages-mod-compatibility-$BRANCH" ]]
          [[ "$ARTIFACT_URL" == \
             "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID" ]]
          payload="$RUNNER_TEMP/pages-compatibility-evidence-ready.json"
          jq -n \
            --arg artifact_digest "sha256:$ARTIFACT_DIGEST" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg branch "$BRANCH" \
            --arg coverage_sha "$COVERAGE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg target_sha "$TARGET_SHA" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson compatibility_run_id "$COMPATIBILITY_RUN_ID" \
            --argjson publication_run_id "$GITHUB_RUN_ID" \
            '{event_type:"pages-compatibility-evidence-ready",client_payload:{
              repository:$repository,publication_run_id:$publication_run_id,
              publication_sha:env.GITHUB_SHA,artifact_id:$artifact_id,
              artifact_name:$artifact_name,artifact_digest:$artifact_digest,
              compatibility_run_id:$compatibility_run_id,branch:$branch,
              target_sha:$target_sha,coverage_sha:$coverage_sha}}' > "$payload"
          github_api_retry --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$payload" > /dev/null

  continue:
    name: Wake the next pending compatibility review
    needs:
      - enumerate
      - gate
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.gate.outputs.complete == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch another independently selected source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/mod-compatibility-review-continuation.json"
          jq -n \
            '{event_type:"mod-compatibility-review-sweep-requested"}' \
            > "$payload"
          dispatch_error="$RUNNER_TEMP/mod-compatibility-review-continuation.error"
          for attempt in 1 2 3; do
            : > "$dispatch_error"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
                --input "$payload" 2> "$dispatch_error"; then
              exit 0
            fi
            if grep -Fq 'API rate limit exceeded' "$dispatch_error"; then
              echo "::warning::GitHub API quota exhausted; compatibility continuation deferred"
              exit 0
            fi
            if grep -Eq 'secondary rate limit|abuse detection|\(HTTP 429\)' \
                "$dispatch_error" && (( attempt < 3 )); then
              sleep $((attempt * 5))
              continue
            fi
            cat "$dispatch_error" >&2
            exit 1
          done
